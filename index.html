<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portale Iscrizione ai Corsi | Azienda di prova</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React e ReactDOM da CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel per JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-slate-100 text-slate-800 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      function App() {
        const [view, setView] = useState('courses'); // 'courses', 'admin-login', 'admin-dashboard'
        const [selectedBrand, setSelectedBrand] = useState('all');
        const [selectedCourse, setSelectedCourse] = useState(null);
        const [submitted, setSubmitted] = useState(false);
        const [submitError, setSubmitError] = useState('');
        const [adminPin, setAdminPin] = useState('');
        const [adminError, setAdminError] = useState(false);
        const [adminTab, setAdminTab] = useState('registrations'); // 'registrations', 'add-course', 'settings'

        // Email amministratore salvata in localStorage
        const [adminEmail, setAdminEmail] = useState(() => {
          return localStorage.getItem('system_admin_email') || 'ermanno.zanardi69@gmail.com';
        });
        const [tempAdminEmail, setTempAdminEmail] = useState(adminEmail);
        const [emailSavedMsg, setEmailSavedMsg] = useState(false);

        // Stato per i corsi
        const [courses, setCourses] = useState(() => {
          const saved = localStorage.getItem('system_courses_v5');
          return saved ? JSON.parse(saved) : [
            {
              id: 1,
              brand: 'tecnoalarm',
              brandName: 'TECNOALARM',
              title: 'CORSO TECNICO BASE - LIVELLO 1',
              code: 'TEC-ANT-01',
              date: 'giovedì 1 ott 2026',
              time: '09:00 – 13:00',
              modality: 'In presenza',
              location: "Via dell'Innovazione 8/10 - 20032 Cormano (MI)",
              maxParticipants: 12,
              duration: '4 Ore',
              description: 'Corso Tecnico Base - Panoramica prodotti Tecnoalarm, Tipici di Cablaggio, Utilizzo Base e diagnostica, Passi di programmazione e Software Centro.',
              level: 'Base',
              isNew: true
            },
            {
              id: 2,
              brand: 'tecnofire',
              brandName: 'TECNOFIRE',
              title: 'CORSO TECNICO BASE - LIVELLO 1',
              code: 'TFIRE-NOR-02',
              date: 'giovedì 29 ott 2026',
              time: '09:00 – 13:00',
              modality: 'In presenza',
              location: "Via dell'Innovazione 8/10 - 20032 Cormano (MI)",
              maxParticipants: 12,
              duration: '4 Ore',
              description: 'Corso Tecnico Base - Panoramica prodotti Tecnofire, Tipici di Cablaggio, Utilizzo Base e diagnostica, Passi di programmazione e Software Centro.',
              level: 'Base',
              isNew: true
            },
            {
              id: 3,
              brand: 'nice',
              brandName: 'NICE',
              title: 'CORSO AUTOMAZIONI SMART & ECOSYSTEM',
              code: 'NICE-AUT-03',
              date: 'martedì 5 nov 2026',
              time: '14:00 – 18:00',
              modality: 'Google Meet',
              location: 'Google Meet (Link online)',
              maxParticipants: 20,
              duration: '4 Ore',
              description: 'Installazione e programmazione centrali per cancelli, barriere e protocolli radio bidirezionali.',
              level: 'Intermedio',
              isNew: false
            },
            {
              id: 4,
              brand: 'dahua',
              brandName: 'DAHUA',
              title: 'CORSO VIDEOSORVEGLIANZA IP & AI',
              code: 'DAH-AI-04',
              date: 'giovedì 12 nov 2026',
              time: '09:00 – 13:00',
              modality: 'Google Meet',
              location: 'Google Meet (Link online)',
              maxParticipants: 25,
              duration: '4 Ore',
              description: 'Configurazione telecamere termiche, WizSense, riconoscimento facciale e NVR di ultima generazione.',
              level: 'Avanzato',
              isNew: false
            }
          ];
        });
        
        // Stato per le iscrizioni
        const [registrations, setRegistrations] = useState(() => {
          const saved = localStorage.getItem('course_registrations_v5');
          return saved ? JSON.parse(saved) : [
            {
              id: 1,
              courseId: 1,
              fullName: 'Mario Rossi',
              company: 'Rossi Impianti Srl',
              vatNumber: '01234567890',
              email: 'mario@rossiimpianti.it',
              phone: '3331234567',
              city: 'Milano (MI)',
              courseTitle: 'CORSO TECNICO BASE - LIVELLO 1',
              brandName: 'TECNOALARM',
              date: 'giovedì 1 ott 2026',
              timestamp: '02/10/2026 10:30'
            }
          ];
        });

        const [formData, setFormData] = useState({
          fullName: '',
          company: '',
          vatNumber: '',
          email: '',
          phone: '',
          city: ''
        });

        // Form nuovo corso per admin
        const [newCourseData, setNewCourseData] = useState({
          brand: 'tecnoalarm',
          brandName: 'TECNOALARM',
          title: '',
          code: '',
          date: '',
          time: '09:00 – 13:00',
          modality: 'In presenza',
          location: '',
          maxParticipants: 12,
          duration: '4 Ore',
          description: '',
          level: 'Base',
          isNew: true
        });

        useEffect(() => {
          localStorage.setItem('course_registrations_v5', JSON.stringify(registrations));
        }, [registrations]);

        useEffect(() => {
          localStorage.setItem('system_courses_v5', JSON.stringify(courses));
        }, [courses]);

        useEffect(() => {
          localStorage.setItem('system_admin_email', adminEmail);
        }, [adminEmail]);

        const filteredCourses = selectedBrand === 'all' 
          ? courses 
          : courses.filter(c => c.brand === selectedBrand);

        const handleInputChange = (e) => {
          setFormData({ ...formData, [e.target.name]: e.target.value });
        };

        const getCourseEnrollmentCount = (courseId) => {
          return registrations.filter(r => r.courseId === courseId).length;
        };

        const getCompanyEnrollmentCountForCourse = (courseId, vatNumber) => {
          const cleanVat = vatNumber.trim().toLowerCase();
          return registrations.filter(r => r.courseId === courseId && r.vatNumber.trim().toLowerCase() === cleanVat).length;
        };

        const handleSubmit = (e) => {
          e.preventDefault();
          setSubmitError('');

          const currentCount = getCourseEnrollmentCount(selectedCourse.id);
          const maxAllowed = selectedCourse.maxParticipants || 12;

          if (currentCount >= maxAllowed) {
            setSubmitError('Spiacenti, questo corso ha raggiunto il numero massimo di partecipanti ed è completo (Sold Out).');
            return;
          }

          const companyCount = getCompanyEnrollmentCountForCourse(selectedCourse.id, formData.vatNumber);
          if (companyCount >= 2) {
            setSubmitError('Attenzione: La tua azienda (Partita IVA inserita) ha già raggiunto il limite massimo di 2 partecipanti iscritti a questo corso.');
            return;
          }

          const newReg = {
            id: Date.now(),
            courseId: selectedCourse.id,
            ...formData,
            courseTitle: selectedCourse.title,
            brandName: selectedCourse.brandName,
            date: selectedCourse.date,
            timestamp: new Date().toLocaleString()
          };

          setRegistrations([newReg, ...registrations]);
          setSubmitted(true);
        };

        const handleAdminLogin = (e) => {
          e.preventDefault();
          if (adminPin === 'admin123') {
            setAdminError(false);
            setView('admin-dashboard');
            setAdminPin('');
          } else {
            setAdminError(true);
          }
        };

        const handleSaveAdminEmail = (e) => {
          e.preventDefault();
          setAdminEmail(tempAdminEmail);
          setEmailSavedMsg(true);
          setTimeout(() => setEmailSavedMsg(false), 3000);
        };

        const handleNewCourseChange = (e) => {
          const { name, value, type, checked } = e.target;
          if (name === 'brand') {
            let bName = 'TECNOALARM';
            if (value === 'tecnofire') bName = 'TECNOFIRE';
            if (value === 'nice') bName = 'NICE';
            if (value === 'dahua') bName = 'DAHUA';
            if (value === 'altro') bName = 'ALTRO';
            setNewCourseData({ ...newCourseData, brand: value, brandName: bName });
          } else if (name === 'modality' && value === 'Google Meet') {
            setNewCourseData({ ...newCourseData, modality: value, location: 'Google Meet (Link online)' });
          } else {
            setNewCourseData({ ...newCourseData, [name]: type === 'checkbox' ? checked : value });
          }
        };

        const handleAddCourseSubmit = (e) => {
          e.preventDefault();
          const createdCourse = {
            id: Date.now(),
            ...newCourseData,
            maxParticipants: parseInt(newCourseData.maxParticipants) || 12
          };
          setCourses([...courses, createdCourse]);
          alert('Nuovo corso aggiunto con successo!');
          setNewCourseData({
            brand: 'tecnoalarm',
            brandName: 'TECNOALARM',
            title: '',
            code: '',
            date: '',
            time: '09:00 – 13:00',
            modality: 'In presenza',
            location: '',
            maxParticipants: 12,
            duration: '4 Ore',
            description: '',
            level: 'Base',
            isNew: true
          });
          setAdminTab('registrations');
        };

        const handleDeleteCourse = (id) => {
          if (confirm('Vuoi davvero eliminare questo corso?')) {
            setCourses(courses.filter(c => c.id !== id));
          }
        };

        const handleDownloadLocandina = (course) => {
          alert(`Download locandina per: ${course.title} (${course.brandName})`);
        };

        const totalRegistrations = registrations.length;
        const registrationsByBrand = registrations.reduce((acc, reg) => {
          acc[reg.brandName] = (acc[reg.brandName] || 0) + 1;
          return acc;
        }, {});

        return (
          <div className="min-h-screen flex flex-col bg-slate-100 text-slate-800">
            
            {/* Header istituzionale Blu Scuro */}
            <header className="bg-[#1b365d] text-white shadow-md">
              <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div className="flex items-center space-x-3 cursor-pointer" onClick={() => { setView('courses'); setSelectedCourse(null); setSubmitted(false); }}>
                  <div className="bg-[#d9381e] p-2 rounded-lg text-white font-bold shadow">
                    💡
                  </div>
                  <div>
                    <h1 className="text-sm sm:text-base font-bold tracking-tight">Portale Iscrizione ai Corsi Tecnico Commerciali di Azienda di prova</h1>
                    <p className="text-xs text-slate-300">Formazione tecnica sui sistemi Tecnoalarm, Tecnofire, Nice e Dahua</p>
                  </div>
                </div>
                <div>
                  {view !== 'admin-dashboard' && view !== 'admin-login' ? (
                    <button
                      onClick={() => { setView('admin-login'); setAdminError(false); }}
                      className="text-amber-300 hover:text-amber-200 text-sm font-bold transition-colors uppercase tracking-wider px-3 py-1.5 rounded-lg border border-amber-300/30 hover:bg-amber-400/10"
                    >
                      Admin
                    </button>
                  ) : (
                    <button
                      onClick={() => { setView('courses'); setSelectedCourse(null); setSubmitted(false); }}
                      className="text-white hover:text-slate-200 text-sm font-bold transition-colors bg-blue-600 px-3 py-1.5 rounded-lg"
                    >
                      Home Corsi
                    </button>
                  )}
                </div>
              </div>

              {/* Banner centrale Calendario */}
              {view === 'courses' && !selectedCourse && (
                <div className="bg-[#162d4f] py-10 text-center border-t border-blue-900/50">
                  <h2 className="text-2xl sm:text-4xl font-extrabold tracking-wide uppercase text-white mb-2">
                    CALENDARIO CORSI 2026
                  </h2>
                  <p className="text-xs sm:text-sm text-slate-300">
                    Formazione tecnica sui sistemi Tecnoalarm, Tecnofire, Nice e Dahua
                  </p>
                </div>
              )}
            </header>

            {/* Main Content */}
            <main className="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
              
              {/* VISTA CATALOGO CORSI */}
              {view === 'courses' && !selectedCourse && (
                <div>
                  {/* Filtro Marchi */}
                  <div className="flex flex-wrap justify-center gap-2 mb-8">
                    {[
                      { id: 'all', label: 'Tutti i Marchi' },
                      { id: 'tecnoalarm', label: 'Tecnoalarm' },
                      { id: 'tecnofire', label: 'Tecnofire' },
                      { id: 'nice', label: 'Nice' },
                      { id: 'dahua', label: 'Dahua' },
                    ].map(brand => (
                      <button
                        key={brand.id}
                        onClick={() => setSelectedBrand(brand.id)}
                        className={`px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-sm ${
                          selectedBrand === brand.id
                            ? 'bg-[#1b365d] text-white shadow-md'
                            : 'bg-white text-slate-700 hover:bg-slate-200 border border-slate-300'
                        }`}
                      >
                        {brand.label}
                      </button>
                    ))}
                  </div>

                  {filteredCourses.length === 0 ? (
                    <div className="bg-white rounded-2xl border border-slate-200 p-12 text-center text-slate-500 text-sm shadow-sm">
                      Nessun corso disponibile al momento per questo marchio.
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                      {filteredCourses.map(course => {
                        const enrolled = getCourseEnrollmentCount(course.id);
                        const maxLimit = course.maxParticipants || 12;
                        const isFull = enrolled >= maxLimit;
                        const percentage = Math.min(100, Math.round((enrolled / maxLimit) * 100));

                        return (
                          <div 
                            key={course.id}
                            className="bg-white rounded-2xl border border-slate-200 shadow-lg overflow-hidden flex flex-col justify-between transition-all hover:shadow-xl relative"
                          >
                            {/* Header Card Bordeaux */}
                            <div className="bg-[#8b1e1e] text-white p-6 relative overflow-hidden">
                              {course.isNew && (
                                <div className="absolute -right-12 top-4 bg-amber-400 text-slate-900 text-[10px] font-extrabold py-1 px-12 rotate-45 shadow-sm uppercase tracking-wider">
                                  NOVITÀ
                                </div>
                              )}
                              
                              <div className="flex justify-between items-center mb-3">
                                <span className="bg-white/20 text-white text-xs font-extrabold px-3 py-1 rounded tracking-wider">
                                  {course.brandName}
                                </span>
                                <span className="text-xs text-white/90 bg-black/20 px-2.5 py-1 rounded">
                                  {course.modality}
                                </span>
                              </div>
                              <h3 className="text-lg sm:text-xl font-black tracking-tight text-white uppercase">{course.title}</h3>
                            </div>

                            {/* Contenuto Card */}
                            <div className="p-6 flex-grow flex flex-col justify-between">
                              <div>
                                <div className="grid grid-cols-2 gap-4 mb-4 pb-4 border-b border-slate-100 text-xs">
                                  <div>
                                    <span className="text-slate-400 font-semibold uppercase block mb-1">DATA</span>
                                    <span className="font-bold text-slate-900">{course.date}</span>
                                  </div>
                                  <div>
                                    <span className="text-slate-400 font-semibold uppercase block mb-1">ORARIO</span>
                                    <span className="font-bold text-slate-900">{course.time}</span>
                                  </div>
                                </div>

                                <div className="mb-4 pb-4 border-b border-slate-100 text-xs">
                                  <span className="text-slate-400 font-semibold uppercase block mb-1">SEDE / MODALITÀ</span>
                                  <span className="font-bold text-slate-900">{course.location}</span>
                                </div>

                                <p className="text-slate-600 text-xs leading-relaxed mb-6">
                                  {course.description}
                                </p>
                              </div>

                              <div>
                                {/* Barra Posti Disponibili */}
                                <div className="mb-6">
                                  <div className="flex justify-between items-center text-xs mb-1.5">
                                    <span className="text-slate-500 font-medium">Posti disponibili</span>
                                    <span className={`font-bold ${isFull ? 'text-red-600' : 'text-slate-900'}`}>
                                      {enrolled} / {maxLimit}
                                    </span>
                                  </div>
                                  <div className="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                                    <div 
                                      className={`h-full transition-all duration-500 ${isFull ? 'bg-red-600' : 'bg-[#1b365d]'}`}
                                      style={{ width: `${percentage}%` }}
                                    ></div>
                                  </div>
                                </div>

                                {/* Pulsanti Azione */}
                                <div className="space-y-2.5">
                                  <button
                                    onClick={() => { setSelectedCourse(course); setSubmitted(false); setSubmitError(''); }}
                                    disabled={isFull}
                                    className={`w-full font-bold py-3 px-4 rounded-xl text-sm transition-all shadow-md flex items-center justify-center gap-2 ${
                                      isFull 
                                        ? 'bg-slate-300 text-slate-500 cursor-not-allowed' 
                                        : 'bg-[#8b1e1e] hover:bg-[#721818] text-white shadow-[#8b1e1e]/20'
                                    }`}
                                  >
                                    {isFull ? 'Corso Esaurito (Sold Out)' : 'Iscriviti'}
                                  </button>

                                  <button
                                    onClick={() => handleDownloadLocandina(course)}
                                    className="w-full bg-white hover:bg-slate-50 text-slate-700 font-bold py-2.5 px-4 rounded-xl text-xs transition-colors border border-slate-300 flex items-center justify-center gap-2 shadow-sm"
                                  >
                                    📄 Scarica Locandina
                                  </button>
                                </div>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}

              {/* VISTA MODULO ISCRIZIONE */}
              {view === 'courses' && selectedCourse && (
                <div className="max-w-xl mx-auto bg-white rounded-2xl border border-slate-200 shadow-xl p-6 sm:p-8">
                  {!submitted ? (
                    <div>
                      <button
                        onClick={() => setSelectedCourse(null)}
                        className="text-xs font-bold text-[#1b365d] hover:underline mb-6 inline-flex items-center gap-1"
                      >
                        ← Torna all'elenco corsi
                      </button>

                      <div className="mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <div className="flex justify-between items-center mb-1">
                          <span className="text-xs font-bold text-[#8b1e1e] uppercase tracking-wider">{selectedCourse.brandName}</span>
                          <span className="text-xs font-semibold px-2.5 py-0.5 rounded bg-blue-100 text-blue-800">
                            {selectedCourse.modality}
                          </span>
                        </div>
                        <h3 className="text-base font-bold text-slate-900">{selectedCourse.title}</h3>
                        <p className="text-xs text-slate-500 mt-1">📅 {selectedCourse.date} ({selectedCourse.time}) | 📍 {selectedCourse.location}</p>
                        <p className="text-xs text-[#1b365d] font-semibold mt-2">ℹ️ Erogato da Azienda di prova (Massimo 2 partecipanti per azienda).</p>
                      </div>

                      <h2 className="text-xl font-bold text-slate-900 mb-4">Modulo di Registrazione Installatore</h2>
                      
                      {submitError && (
                        <div className="mb-4 bg-red-50 border border-red-200 text-red-700 text-xs p-3 rounded-lg font-medium">
                          {submitError}
                        </div>
                      )}

                      <form onSubmit={handleSubmit} className="space-y-4">
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Nome e Cognome del Partecipante *</label>
                          <input
                            type="text"
                            name="fullName"
                            required
                            value={formData.fullName}
                            onChange={handleInputChange}
                            className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]"
                            placeholder="Mario Rossi"
                          />
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Ragione Sociale Azienda *</label>
                            <input
                              type="text"
                              name="company"
                              required
                              value={formData.company}
                              onChange={handleInputChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]"
                              placeholder="Impianti Elettrici Srl"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Partita IVA (limite 2) *</label>
                            <input
                              type="text"
                              name="vatNumber"
                              required
                              value={formData.vatNumber}
                              onChange={handleInputChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d] font-mono"
                              placeholder="01234567890"
                            />
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Email Aziendale *</label>
                            <input
                              type="email"
                              name="email"
                              required
                              value={formData.email}
                              onChange={handleInputChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]"
                              placeholder="mario@impianti.it"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Telefono / Cellulare *</label>
                            <input
                              type="tel"
                              name="phone"
                              required
                              value={formData.phone}
                              onChange={handleInputChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]"
                              placeholder="333 1234567"
                            />
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Città sede lavorativa *</label>
                          <input
                            type="text"
                            name="city"
                            required
                            value={formData.city}
                            onChange={handleInputChange}
                            className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]"
                            placeholder="Milano (MI)"
                          />
                        </div>

                        <button
                          type="submit"
                          className="w-full mt-3 bg-[#8b1e1e] hover:bg-[#721818] text-white font-bold py-3 px-4 rounded-xl text-sm transition-colors shadow-md shadow-[#8b1e1e]/20"
                        >
                          Conferma Iscrizione al Corso
                        </button>
                      </form>
                    </div>
                  ) : (
                    <div className="text-center py-6">
                      <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl font-bold shadow-inner">
                        ✓
                      </div>
                      <h3 className="text-xl font-bold text-slate-900 mb-2">Iscrizione Effettuata con Successo!</h3>
                      <p className="text-slate-600 text-sm mb-6 leading-relaxed">
                        Grazie <strong>{formData.fullName}</strong> ({formData.company}). Abbiamo registrato la tua richiesta per il corso <strong>{selectedCourse.title}</strong> erogato da <strong>Azienda di prova</strong>.
                      </p>
                      
                      <div className="bg-slate-50 border border-slate-200 p-4 rounded-xl text-xs text-slate-700 mb-6 text-left space-y-1.5">
                        <p>✉️ <strong>Email di conferma inviata a:</strong> {formData.email}</p>
                        <p>🔔 <strong>Notifica admin inviata a:</strong> {adminEmail}</p>
                        <p className="text-emerald-700 font-semibold pt-1">✓ Registrazione completata e notificata con successo!</p>
                      </div>

                      <button
                        onClick={() => { setSubmitted(false); setSelectedCourse(null); }}
                        className="bg-[#1b365d] hover:bg-[#162d4f] text-white font-bold py-2.5 px-6 rounded-xl text-sm transition-colors shadow"
                      >
                        Torna alla Home Corsi
                      </button>
                    </div>
                  )}
                </div>
              )}

              {/* VISTA LOGIN ADMIN */}
              {view === 'admin-login' && (
                <div className="max-w-md mx-auto bg-white rounded-2xl border border-slate-200 shadow-xl p-8 mt-10">
                  <div className="text-center mb-6">
                    <div className="w-12 h-12 bg-blue-50 text-[#1b365d] rounded-xl flex items-center justify-center mx-auto mb-3 text-xl font-bold shadow">
                      🔒
                    </div>
                    <h2 className="text-xl font-bold text-slate-900">Area Riservata Admin</h2>
                    <p className="text-xs text-slate-500 mt-1">Azienda di prova • Inserisci il PIN</p>
                  </div>

                  <form onSubmit={handleAdminLogin} className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">PIN di Accesso (Usa: admin123)</label>
                      <input
                        type="password"
                        required
                        value={adminPin}
                        onChange={(e) => setAdminPin(e.target.value)}
                        className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d] text-center tracking-widest text-lg"
                        placeholder="••••••••"
                      />
                    </div>
                    {adminError && (
                      <p className="text-xs text-red-600 text-center font-semibold">PIN errato. Riprova (prova con admin123)</p>
                    )}
                    <button
                      type="submit"
                      className="w-full bg-[#1b365d] hover:bg-[#162d4f] text-white font-bold py-3 px-4 rounded-xl text-sm transition-colors shadow-md"
                    >
                      Accedi al Pannello
                    </button>
                  </form>
                </div>
              )}

              {/* VISTA PANNELLO DASHBOARD ADMIN */}
              {view === 'admin-dashboard' && (
                <div>
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 bg-[#1b365d] text-white p-6 rounded-2xl shadow-md">
                    <div>
                      <span className="text-xs text-amber-300 font-bold uppercase tracking-wider">Pannello di Controllo</span>
                      <h2 className="text-2xl font-black mt-0.5">Azienda di prova</h2>
                      <p className="text-xs text-slate-300 mt-1">Gestione corsi, limiti di posti e reportistica iscrizioni</p>
                    </div>
                    <div className="flex flex-wrap items-center gap-2">
                      <button
                        onClick={() => setAdminTab('registrations')}
                        className={`text-xs px-4 py-2.5 rounded-xl font-bold transition-all ${adminTab === 'registrations' ? 'bg-[#8b1e1e] text-white shadow' : 'bg-white/10 text-white hover:bg-white/20'}`}
                      >
                        📊 Report Iscritti ({registrations.length})
                      </button>
                      <button
                        onClick={() => setAdminTab('add-course')}
                        className={`text-xs px-4 py-2.5 rounded-xl font-bold transition-all ${adminTab === 'add-course' ? 'bg-[#8b1e1e] text-white shadow' : 'bg-white/10 text-white hover:bg-white/20'}`}
                      >
                        ➕ Inserisci Corso
                      </button>
                      <button
                        onClick={() => setAdminTab('settings')}
                        className={`text-xs px-4 py-2.5 rounded-xl font-bold transition-all ${adminTab === 'settings' ? 'bg-[#8b1e1e] text-white shadow' : 'bg-white/10 text-white hover:bg-white/20'}`}
                      >
                        ⚙️ Impostazioni Email
                      </button>
                    </div>
                  </div>

                  {/* SEZIONE REPORT ISCRITTI */}
                  {adminTab === 'registrations' && (
                    <div>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                          <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Totale Iscrizioni</p>
                          <p className="text-3xl font-black text-slate-900 mt-1">{totalRegistrations}</p>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm sm:col-span-2">
                          <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Iscritti per Marchio</p>
                          <div className="flex flex-wrap gap-2">
                            {Object.keys(registrationsByBrand).length === 0 ? (
                              <span className="text-xs text-slate-400">Nessun dato disponibile</span>
                            ) : (
                              Object.entries(registrationsByBrand).map(([brand, count]) => (
                                <span key={brand} className="bg-red-50 text-[#8b1e1e] border border-red-200 text-xs font-bold px-3 py-1.5 rounded-xl">
                                  {brand}: <strong>{count}</strong>
                                </span>
                              ))
                            )}
                          </div>
                        </div>
                      </div>

                      <div className="flex justify-between items-center mb-4">
                        <h3 className="text-lg font-bold text-slate-900">Elenco Dettagliato Installatori</h3>
                        {registrations.length > 0 && (
                          <button
                            onClick={() => {
                              if (confirm('Vuoi davvero cancellare tutte le iscrizioni?')) {
                                setRegistrations([]);
                              }
                            }}
                            className="text-xs text-red-600 hover:text-red-800 font-bold bg-red-50 px-3 py-1.5 rounded-xl border border-red-200 transition-colors"
                          >
                            Svuota Storico Iscrizioni
                          </button>
                        )}
                      </div>

                      {registrations.length === 0 ? (
                        <div className="bg-white rounded-2xl border border-slate-200 p-12 text-center shadow-sm">
                          <p className="text-slate-500 text-sm">Nessuna iscrizione registrata al momento.</p>
                        </div>
                      ) : (
                        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                          <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                              <thead>
                                <tr className="bg-slate-50 border-b border-slate-200 text-xs text-slate-600 uppercase tracking-wider">
                                  <th className="p-4 font-bold">Data & Ora</th>
                                  <th className="p-4 font-bold">Installatore</th>
                                  <th className="p-4 font-bold">Azienda / P.IVA</th>
                                  <th className="p-4 font-bold">Contatti</th>
                                  <th className="p-4 font-bold">Corso Scelto</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-100 text-sm text-slate-700">
                                {registrations.map((reg) => (
                                  <tr key={reg.id} className="hover:bg-slate-50 transition-colors">
                                    <td className="p-4 text-xs text-slate-500 whitespace-nowrap">{reg.timestamp}</td>
                                    <td className="p-4 font-bold text-slate-900">
                                      {reg.fullName}
                                      <div className="text-xs text-slate-500 font-normal">{reg.city}</div>
                                    </td>
                                    <td className="p-4">
                                      {reg.company}
                                      <div className="text-xs text-slate-500 font-mono">P.IVA: {reg.vatNumber}</div>
                                    </td>
                                    <td className="p-4 text-xs">
                                      <div>✉️ {reg.email}</div>
                                      <div className="mt-0.5">📞 {reg.phone}</div>
                                    </td>
                                    <td className="p-4">
                                      <div className="flex items-center gap-1.5 mb-1">
                                        <span className="inline-block bg-red-50 text-[#8b1e1e] border border-red-200 text-xs font-bold px-2 py-0.5 rounded">
                                          {reg.brandName}
                                        </span>
                                      </div>
                                      <div className="text-xs font-bold text-slate-900">{reg.courseTitle}</div>
                                      <div className="text-xs text-slate-500">📅 {reg.date}</div>
                                    </td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  {/* SEZIONE IMPOSTAZIONI EMAIL ADMIN */}
                  {adminTab === 'settings' && (
                    <div className="max-w-xl mx-auto bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
                      <h3 className="text-lg font-bold text-slate-900 mb-1">Configurazione Email Amministratore</h3>
                      <p className="text-xs text-slate-500 mb-6">Indirizzo email di Azienda di prova per la ricezione delle notifiche di iscrizione.</p>

                      {emailSavedMsg && (
                        <div className="mb-4 bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs p-3 rounded-lg font-semibold">
                          ✓ Indirizzo email amministrativo aggiornato con successo!
                        </div>
                      )}

                      <form onSubmit={handleSaveAdminEmail} className="space-y-4">
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Email Ricezione Notifiche Admin *</label>
                          <input
                            type="email"
                            required
                            value={tempAdminEmail}
                            onChange={(e) => setTempAdminEmail(e.target.value)}
                            className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]"
                            placeholder="es. ermanno.zanardi69@gmail.com"
                          />
                        </div>

                        <div className="pt-2">
                          <button
                            type="submit"
                            className="w-full bg-[#1b365d] hover:bg-[#162d4f] text-white font-bold py-3 px-4 rounded-xl text-sm transition-colors shadow-md"
                          >
                            Salva Indirizzo Email
                          </button>
                        </div>
                      </form>
                    </div>
                  )}

                  {/* SEZIONE INSERISCI NUOVO CORSO */}
                  {adminTab === 'add-course' && (
                    <div className="max-w-2xl mx-auto bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
                      <h3 className="text-lg font-bold text-slate-900 mb-1">Crea Nuovo Corso di Formazione</h3>
                      <p className="text-xs text-slate-500 mb-6">Azienda di prova • Imposta modalità di erogazione e posti massimi.</p>

                      <form onSubmit={handleAddCourseSubmit} className="space-y-4">
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Marchio di Riferimento *</label>
                            <select
                              name="brand"
                              value={newCourseData.brand}
                              onChange={handleNewCourseChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d] bg-white"
                            >
                              <option value="tecnoalarm">Tecnoalarm</option>
                              <option value="tecnofire">Tecnofire</option>
                              <option value="nice">Nice</option>
                              <option value="dahua">Dahua</option>
                              <option value="altro">Altro Marchio</option>
                            </select>
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Livello del Corso</label>
                            <select
                              name="level"
                              value={newCourseData.level}
                              onChange={handleNewCourseChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d] bg-white"
                            >
                              <option value="Base">Base</option>
                              <option value="Intermedio">Intermedio</option>
                              <option value="Avanzato">Avanzato</option>
                              <option value="Professionale">Professionale</option>
                            </select>
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Titolo del Corso *</label>
                          <input
                            type="text"
                            name="title"
                            required
                            value={newCourseData.title}
                            onChange={handleNewCourseChange}
                            className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]"
                            placeholder="Es. CORSO TECNICO AVANZATO"
                          />
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Modality *</label>
                            <select
                              name="modality"
                              value={newCourseData.modality}
                              onChange={handleNewCourseChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d] bg-white"
                            >
                              <option value="In presenza">In presenza</option>
                              <option value="Google Meet">Google Meet</option>
                            </select>
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Max Partecipanti *</label>
                            <input
                              type="number"
                              name="maxParticipants"
                              min="1"
                              max="200"
                              required
                              value={newCourseData.maxParticipants}
                              onChange={handleNewCourseChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1 flex items-center gap-1">
                              <input 
                                type="checkbox" 
                                name="isNew"
                                checked={newCourseData.isNew}
                                onChange={handleNewCourseChange}
                                className="rounded border-slate-300"
                              />
                              Etichetta Novità
                            </label>
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Data *</label>
                            <input
                              type="text"
                              name="date"
                              required
                              value={newCourseData.date}
                              onChange={handleNewCourseChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]"
                              placeholder="Es. giovedì 15 nov 2026"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Orario *</label>
                            <input
                              type="text"
                              name="time"
                              required
                              value={newCourseData.time}
                              onChange={handleNewCourseChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]"
                              placeholder="Es. 09:00 – 13:00"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Durata *</label>
                            <input
                              type="text"
                              name="duration"
                              required
                              value={newCourseData.duration}
                              onChange={handleNewCourseChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]"
                              placeholder="Es. 4 Ore"
                            />
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Sede o Link Piattaforma *</label>
                          <input
                            type="text"
                            name="location"
                            required
                            value={newCourseData.location}
                            onChange={handleNewCourseChange}
                            className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]"
                            placeholder="Es. Via dell'Innovazione 8/10 - 20032 Cormano (MI)"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Descrizione Dettagliata *</label>
                          <textarea
                            name="description"
                            required
                            rows="3"
                            value={newCourseData.description}
                            onChange={handleNewCourseChange}
                            className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]"
                            placeholder="Panoramica prodotti, diagnostica e programmazione..."
                          ></textarea>
                        </div>

                        <div className="pt-2 flex gap-3">
                          <button
                            type="submit"
                            className="flex-1 bg-[#1b365d] hover:bg-[#162d4f] text-white font-bold py-3 px-4 rounded-xl text-sm transition-colors shadow-md"
                          >
                            Pubblica Corso nel Catalogo
                          </button>
                          <button
                            type="button"
                            onClick={() => setAdminTab('registrations')}
                            className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-4 rounded-xl text-sm transition-colors"
                          >
                            Annulla
                          </button>
                        </div>
                      </form>

                      {/* Lista corsi esistenti con opzione di eliminazione */}
                      <div className="mt-10 border-t border-slate-200 pt-6">
                        <h4 className="text-sm font-bold text-slate-900 mb-3">Corsi Attualmente in Catalogo (Gestione Rapida)</h4>
                        <div className="space-y-2 max-h-60 overflow-y-auto">
                          {courses.map(c => (
                            <div key={c.id} className="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs">
                              <div>
                                <span className="font-bold text-[#8b1e1e] uppercase">{c.brandName}:</span> <span className="font-semibold text-slate-900">{c.title}</span> <span className="text-slate-500">({c.date} - Max {c.maxParticipants})</span>
                              </div>
                              <button
                                onClick={() => handleDeleteCourse(c.id)}
                                className="text-red-600 hover:text-red-800 font-bold px-2.5 py-1 bg-white border border-red-200 rounded-lg shadow-sm"
                              >
                                Elimina
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>

                    </div>
                  )}

                </div>
              )}

            </main>

            {/* Footer */}
            <footer className="bg-[#1b365d] text-white border-t border-blue-900/50 py-6 text-center text-xs text-slate-300 mt-16">
              <p>© 2026 <strong className="text-white">Azienda di prova</strong> - Portale Formazione Installatori Tecnici. Tutti i diritti riservati.</p>
            </footer>
          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById('root'));
    </script>
  </body>
</html>
