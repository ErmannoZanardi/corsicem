<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portale Iscrizione ai Corsi | Portale Formazione</title>
    <!-- Google Fonts: Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Roboto', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <!-- React e ReactDOM da CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel per JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase JS Client per database cloud -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body class="bg-slate-100 text-slate-800 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // ==========================================
      // CONFIGURAZIONE SUPABASE (Database Cloud)
      // ==========================================
      // Inserisci qui i dati presi dalle impostazioni API del tuo progetto Supabase:
      const SUPABASE_URL = "YOUR_SUPABASE_URL";       // es. "https://abcdefgh.supabase.co"
      const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY"; // es. "eyJhbGciOi..."

      let supabaseClient = null;
      if (SUPABASE_URL && SUPABASE_URL !== "YOUR_SUPABASE_URL" && window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }

      function App() {
        const [view, setView] = useState('courses'); // 'courses', 'admin-login', 'admin-dashboard'
        const [selectedBrand, setSelectedBrand] = useState('all');
        const [selectedCourse, setSelectedCourse] = useState(null);
        const [submitted, setSubmitted] = useState(false);
        const [submitError, setSubmitError] = useState('');
        const [adminPin, setAdminPin] = useState('');
        const [adminError, setAdminError] = useState(false);
        const [adminTab, setAdminTab] = useState('registrations'); // 'registrations', 'add-course', 'settings', 'branding', 'brands-management'

        // Configurazioni personalizzabili tramite Admin salvate in localStorage
        const [companyName, setCompanyName] = useState(() => {
          return localStorage.getItem('system_company_name') || 'Azienda di prova';
        });
        const [companyLogo, setCompanyLogo] = useState(() => {
          return localStorage.getItem('system_company_logo') || '';
        });
        const [headerTitle, setHeaderTitle] = useState(() => {
          return localStorage.getItem('system_header_title') || 'CALENDARIO CORSI 2026';
        });
        const [copyrightText, setCopyrightText] = useState(() => {
          return localStorage.getItem('system_copyright_text') || '© 2026 Portale Formazione Installatori Tecnici. Tutti i diritti riservati.';
        });
        const [adminEmail, setAdminEmail] = useState(() => {
          return localStorage.getItem('system_admin_email') || 'ermanno.zanardi69@gmail.com';
        });

        // Stato per i marchi con colore personalizzabile
        const [brands, setBrands] = useState(() => {
          const saved = localStorage.getItem('system_brands_v2');
          return saved ? JSON.parse(saved) : [
            { id: 'tecnoalarm', name: 'TECNOALARM', logoUrl: '', color: '#8b1e1e' },
            { id: 'tecnofire', name: 'TECNOFIRE', logoUrl: '', color: '#b91c1c' },
            { id: 'nice', name: 'NICE', logoUrl: '', color: '#0369a1' },
            { id: 'dahua', name: 'DAHUA', logoUrl: '', color: '#4338ca' }
          ];
        });

        const [newBrandData, setNewBrandData] = useState({ name: '', logoUrl: '', color: '#1b365d' });

        // Stati temporanei per i form di impostazione admin
        const [tempCompanyName, setTempCompanyName] = useState(companyName);
        const [tempCompanyLogo, setTempCompanyLogo] = useState(companyLogo);
        const [tempHeaderTitle, setTempHeaderTitle] = useState(headerTitle);
        const [tempCopyrightText, setTempCopyrightText] = useState(copyrightText);
        const [tempAdminEmail, setTempAdminEmail] = useState(adminEmail);
        const [settingsSavedMsg, setSettingsSavedMsg] = useState(false);

        // Stato per i corsi
        const [courses, setCourses] = useState(() => {
          const saved = localStorage.getItem('system_courses_v10');
          return saved ? JSON.parse(saved) : [
            {
              id: 1,
              brand: 'tecnoalarm',
              brandName: 'TECNOALARM',
              title: 'CORSO TECNICO BASE - LIVELLO 1',
              code: 'TEC-ANT-01',
              date: 'giovedì 1 ott 2026',
              time: '09:00 – 13:00',
              modality: 'In presenza',
              location: "Via dell'Innovazione 8/10 - 20032 Cormano (MI)",
              maxParticipants: 12,
              duration: '4 Ore',
              description: 'Corso Tecnico Base - Panoramica prodotti Tecnoalarm, Tipici di Cablaggio, Utilizzo Base e diagnostica, Passi di programmazione e Software Centro.',
              level: 'Base',
              isNew: true
            },
            {
              id: 2,
              brand: 'tecnofire',
              brandName: 'TECNOFIRE',
              title: 'CORSO TECNICO BASE - LIVELLO 1',
              code: 'TFIRE-NOR-02',
              date: 'giovedì 29 ott 2026',
              time: '09:00 – 13:00',
              modality: 'In presenza',
              location: "Via dell'Innovazione 8/10 - 20032 Cormano (MI)",
              maxParticipants: 12,
              duration: '4 Ore',
              description: 'Corso Tecnico Base - Panoramica prodotti Tecnofire, Tipici di Cablaggio, Utilizzo Base e diagnostica, Passi di programmazione e Software Centro.',
              level: 'Base',
              isNew: true
            },
            {
              id: 3,
              brand: 'nice',
              brandName: 'NICE',
              title: 'CORSO AUTOMAZIONI SMART & ECOSYSTEM',
              code: 'NICE-AUT-03',
              date: 'martedì 5 nov 2026',
              time: '14:00 – 18:00',
              modality: 'Google Meet',
              location: 'Google Meet (Link online)',
              maxParticipants: 20,
              duration: '4 Ore',
              description: 'Installazione e programmazione centrali per cancelli, barriere e protocolli radio bidirezionali.',
              level: 'Intermedio',
              isNew: false
            },
            {
              id: 4,
              brand: 'dahua',
              brandName: 'DAHUA',
              title: 'CORSO VIDEOSORVEGLIANZA IP & AI',
              code: 'DAH-AI-04',
              date: 'giovedì 12 nov 2026',
              time: '09:00 – 13:00',
              modality: 'Google Meet',
              location: 'Google Meet (Link online)',
              maxParticipants: 25,
              duration: '4 Ore',
              description: 'Configurazione telecamere termiche, WizSense, riconoscimento facciale e NVR di ultima generazione.',
              level: 'Avanzato',
              isNew: false
            }
          ];
        });
        
        // Stato per le iscrizioni (sincronizzato con Supabase se attivo)
        const [registrations, setRegistrations] = useState(() => {
          const saved = localStorage.getItem('course_registrations_v11');
          return saved ? JSON.parse(saved) : [];
        });

        // Caricamento iscrizioni da Supabase all'avvio
        useEffect(() => {
          async function fetchRegistrations() {
            if (supabaseClient) {
              const { data, error } = await supabaseClient.from('registrations').select('*').order('id', { ascending: false });
              if (!error && data) {
                // Mappiamo i dati dal formato Supabase allo state locale
                const formatted = data.map(r => ({
                  id: r.id,
                  courseId: r.course_id,
                  fullName: r.full_name,
                  company: r.company,
                  vatNumber: r.vat_number,
                  email: r.email,
                  phone: r.phone,
                  city: r.city,
                  courseTitle: r.course_title,
                  brandName: r.brand_name,
                  date: r.date,
                  timestamp: r.timestamp
                }));
                setRegistrations(formatted);
              }
            }
          }
          fetchRegistrations();
        }, []);

        const [formData, setFormData] = useState({
          fullName: '',
          company: '',
          vatNumber: '',
          email: '',
          phone: '',
          city: ''
        });

        const [editingCourseId, setEditingCourseId] = useState(null);
        const [newCourseData, setNewCourseData] = useState({
          brand: brands[0]?.id || 'tecnoalarm',
          brandName: brands[0]?.name || 'TECNOALARM',
          title: '',
          code: '',
          date: '',
          time: '09:00 – 13:00',
          modality: 'In presenza',
          location: '',
          maxParticipants: 12,
          duration: '4 Ore',
          description: '',
          level: 'Base',
          isNew: true
        });

        useEffect(() => {
          localStorage.setItem('course_registrations_v11', JSON.stringify(registrations));
        }, [registrations]);

        useEffect(() => {
          localStorage.setItem('system_courses_v10', JSON.stringify(courses));
        }, [courses]);

        useEffect(() => {
          localStorage.setItem('system_brands_v2', JSON.stringify(brands));
        }, [brands]);

        useEffect(() => {
          localStorage.setItem('system_company_name', companyName);
          localStorage.setItem('system_company_logo', companyLogo);
          localStorage.setItem('system_header_title', headerTitle);
          localStorage.setItem('system_copyright_text', copyrightText);
          localStorage.setItem('system_admin_email', adminEmail);
        }, [companyName, companyLogo, headerTitle, copyrightText, adminEmail]);

        const filteredCourses = selectedBrand === 'all' 
          ? courses 
          : courses.filter(c => c.brand === selectedBrand);

        const handleInputChange = (e) => {
          setFormData({ ...formData, [e.target.name]: e.target.value });
        };

        const getCourseEnrollmentCount = (courseId) => {
          return registrations.filter(r => r.courseId === courseId).length;
        };

        const getCompanyEnrollmentCountForCourse = (courseId, vatNumber) => {
          const cleanVat = vatNumber.trim().toLowerCase();
          return registrations.filter(r => r.courseId === courseId && r.vatNumber.trim().toLowerCase() === cleanVat).length;
        };

        const handleSubmit = async (e) => {
          e.preventDefault();
          setSubmitError('');

          const currentCount = getCourseEnrollmentCount(selectedCourse.id);
          const maxAllowed = selectedCourse.maxParticipants || 12;

          if (currentCount >= maxAllowed) {
            setSubmitError('Spiacenti, questo corso ha raggiunto il numero massimo di partecipanti ed è completo (Sold Out).');
            return;
          }

          const companyCount = getCompanyEnrollmentCountForCourse(selectedCourse.id, formData.vatNumber);
          if (companyCount >= 2) {
            setSubmitError('Attenzione: La tua azienda (Partita IVA inserita) ha già raggiunto il limite massimo di 2 partecipanti iscritti a questo corso.');
            return;
          }

          const newRegData = {
            course_id: selectedCourse.id,
            full_name: formData.fullName,
            company: formData.company,
            vat_number: formData.vatNumber,
            email: formData.email,
            phone: formData.phone,
            city: formData.city,
            course_title: selectedCourse.title,
            brand_name: selectedCourse.brandName,
            date: selectedCourse.date,
            timestamp: new Date().toLocaleString()
          };

          // Salvataggio su Supabase se configurato
          if (supabaseClient) {
            const { data, error } = await supabaseClient.from('registrations').insert([newRegData]).select();
            if (error) {
              console.error("Errore salvataggio Supabase:", error);
              setSubmitError("Errore di connessione al database cloud. Riprova.");
              return;
            }
            if (data && data[0]) {
              newRegData.id = data[0].id;
            }
          }

          const localReg = {
            id: newRegData.id || Date.now(),
            courseId: selectedCourse.id,
            ...formData,
            courseTitle: selectedCourse.title,
            brandName: selectedCourse.brandName,
            date: selectedCourse.date,
            timestamp: newRegData.timestamp
          };

          setRegistrations([localReg, ...registrations]);
          setSubmitted(true);
        };

        const handleAdminLogin = (e) => {
          e.preventDefault();
          if (adminPin === 'admin123') {
            setAdminError(false);
            setView('admin-dashboard');
            setAdminPin('');
          } else {
            setAdminError(true);
          }
        };

        const handleSaveSettings = (e) => {
          e.preventDefault();
          setCompanyName(tempCompanyName);
          setCompanyLogo(tempCompanyLogo);
          setHeaderTitle(tempHeaderTitle);
          setCopyrightText(tempCopyrightText);
          setAdminEmail(tempAdminEmail);
          setSettingsSavedMsg(true);
          setTimeout(() => setSettingsSavedMsg(false), 3000);
        };

        const handleAddBrandSubmit = (e) => {
          e.preventDefault();
          if (!newBrandData.name.trim()) return;
          const id = newBrandData.name.toLowerCase().replace(/[^a-z0-9]/g, '_');
          if (brands.some(b => b.id === id)) {
            alert('Questo marchio esiste già.');
            return;
          }
          const updatedBrands = [...brands, { id, name: newBrandData.name.toUpperCase(), logoUrl: newBrandData.logoUrl, color: newBrandData.color }];
          setBrands(updatedBrands);
          setNewBrandData({ name: '', logoUrl: '', color: '#1b365d' });
          alert('Marchio aggiunto con successo!');
        };

        const handleDeleteBrand = (brandId) => {
          if (confirm('Vuoi davvero rimuovere questo marchio?')) {
            setBrands(brands.filter(b => b.id !== brandId));
          }
        };

        const handleBrandUpdate = (brandId, field, value) => {
          setBrands(brands.map(b => b.id === brandId ? { ...b, [field]: value } : b));
        };

        const handleNewCourseChange = (e) => {
          const { name, value, type, checked } = e.target;
          if (name === 'brand') {
            const foundBrand = brands.find(b => b.id === value);
            setNewCourseData({ ...newCourseData, brand: value, brandName: foundBrand ? foundBrand.name : value.toUpperCase() });
          } else if (name === 'modality' && value === 'Google Meet') {
            setNewCourseData({ ...newCourseData, modality: value, location: 'Google Meet (Link online)' });
          } else {
            setNewCourseData({ ...newCourseData, [name]: type === 'checkbox' ? checked : value });
          }
        };

        const handleAddCourseSubmit = (e) => {
          e.preventDefault();
          if (editingCourseId) {
            setCourses(courses.map(c => c.id === editingCourseId ? { ...c, ...newCourseData, maxParticipants: parseInt(newCourseData.maxParticipants) || 12 } : c));
            alert('Corso modificato con successo!');
            setEditingCourseId(null);
          } else {
            const createdCourse = {
              id: Date.now(),
              ...newCourseData,
              maxParticipants: parseInt(newCourseData.maxParticipants) || 12
            };
            setCourses([...courses, createdCourse]);
            alert('Nuovo corso aggiunto con successo!');
          }

          setNewCourseData({
            brand: brands[0]?.id || 'tecnoalarm',
            brandName: brands[0]?.name || 'TECNOALARM',
            title: '',
            code: '',
            date: '',
            time: '09:00 – 13:00',
            modality: 'In presenza',
            location: '',
            maxParticipants: 12,
            duration: '4 Ore',
            description: '',
            level: 'Base',
            isNew: true
          });
          setAdminTab('registrations');
        };

        const handleEditCourseClick = (course) => {
          setEditingCourseId(course.id);
          setNewCourseData({
            brand: course.brand,
            brandName: course.brandName,
            title: course.title,
            code: course.code || '',
            date: course.date,
            time: course.time,
            modality: course.modality,
            location: course.location,
            maxParticipants: course.maxParticipants,
            duration: course.duration,
            description: course.description,
            level: course.level || 'Base',
            isNew: course.isNew || false
          });
          setAdminTab('add-course');
        };

        const handleDeleteCourse = (id) => {
          if (confirm('Vuoi davvero eliminare questo corso?')) {
            setCourses(courses.filter(c => c.id !== id));
            if (editingCourseId === id) setEditingCourseId(null);
          }
        };

        const handleDownloadLocandina = (course) => {
          alert(`Download locandina per: ${course.title} (${course.brandName})`);
        };

        const totalRegistrations = registrations.length;
        const registrationsByBrand = registrations.reduce((acc, reg) => {
          acc[reg.brandName] = (acc[reg.brandName] || 0) + 1;
          return acc;
        }, {});

        return (
          <div className="min-h-screen flex flex-col bg-slate-100 text-slate-800 font-sans">
            
            {/* Header istituzionale Blu Scuro */}
            <header className="bg-[#1b365d] text-white shadow-md">
              <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div className="flex items-center space-x-3 cursor-pointer" onClick={() => { setView('courses'); setSelectedCourse(null); setSubmitted(false); }}>
                  {companyLogo ? (
                    <img src={companyLogo} alt={companyName} className="h-10 w-auto rounded object-contain bg-white p-1" />
                  ) : (
                    <div className="bg-[#d9381e] p-2 rounded-lg text-white font-bold shadow">
                      💡
                    </div>
                  )}
                  <div>
                    <h1 className="text-sm sm:text-base font-bold tracking-tight">Portale Iscrizione ai Corsi Tecnico Commerciali di {companyName}</h1>
                    <p className="text-xs text-slate-300">Formazione tecnica professionale</p>
                  </div>
                </div>
                <div>
                  {view !== 'admin-dashboard' && view !== 'admin-login' ? (
                    <button
                      onClick={() => { setView('admin-login'); setAdminError(false); }}
                      className="text-amber-300 hover:text-amber-200 text-sm font-bold transition-colors uppercase tracking-wider px-3 py-1.5 rounded-lg border border-amber-300/30 hover:bg-amber-400/10"
                    >
                      Admin
                    </button>
                  ) : (
                    <button
                      onClick={() => { setView('courses'); setSelectedCourse(null); setSubmitted(false); }}
                      className="text-white hover:text-slate-200 text-sm font-bold transition-colors bg-blue-600 px-3 py-1.5 rounded-lg"
                    >
                      Home Corsi
                    </button>
                  )}
                </div>
              </div>

              {/* Banner centrale Calendario */}
              {view === 'courses' && !selectedCourse && (
                <div className="bg-[#162d4f] py-10 text-center border-t border-blue-900/50">
                  <h2 className="text-2xl sm:text-4xl font-black tracking-wide uppercase text-white mb-2">
                    {headerTitle}
                  </h2>
                  <p className="text-xs sm:text-sm text-slate-300 font-light">
                    Formazione tecnica sui sistemi dei marchi autorizzati
                  </p>
                </div>
              )}
            </header>

            {/* Main Content */}
            <main className="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
              
              {/* VISTA CATALOGO CORSI */}
              {view === 'courses' && !selectedCourse && (
                <div>
                  {/* Filtro Marchi Dinamico */}
                  <div className="flex flex-wrap justify-center gap-2 mb-8">
                    <button
                      onClick={() => setSelectedBrand('all')}
                      className={`px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-sm ${
                        selectedBrand === 'all'
                          ? 'bg-[#1b365d] text-white shadow-md'
                          : 'bg-white text-slate-700 hover:bg-slate-200 border border-slate-300'
                      }`}
                    >
                      Tutti i Marchi
                    </button>
                    {brands.map(brand => (
                      <button
                        key={brand.id}
                        onClick={() => setSelectedBrand(brand.id)}
                        className={`px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-sm flex items-center gap-2 ${
                          selectedBrand === brand.id
                            ? 'bg-[#1b365d] text-white shadow-md'
                            : 'bg-white text-slate-700 hover:bg-slate-200 border border-slate-300'
                        }`}
                      >
                        <span className="w-2.5 h-2.5 rounded-full inline-block" style={{ backgroundColor: brand.color || '#8b1e1e' }}></span>
                        {brand.logoUrl && <img src={brand.logoUrl} alt="" className="h-4 w-auto object-contain" />}
                        {brand.name}
                      </button>
                    ))}
                  </div>

                  {filteredCourses.length === 0 ? (
                    <div className="bg-white rounded-2xl border border-slate-200 p-12 text-center text-slate-500 text-sm shadow-sm">
                      Nessun corso disponibile al momento per questo marchio.
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                      {filteredCourses.map(course => {
                        const enrolled = getCourseEnrollmentCount(course.id);
                        const maxLimit = course.maxParticipants || 12;
                        const isFull = enrolled >= maxLimit;
                        const percentage = Math.min(100, Math.round((enrolled / maxLimit) * 100));
                        const brandObj = brands.find(b => b.id === course.brand || b.name === course.brandName);
                        const cardColor = brandObj?.color || '#8b1e1e';

                        return (
                          <div 
                            key={course.id}
                            className="bg-white rounded-2xl border border-slate-200 shadow-lg overflow-hidden flex flex-col justify-between transition-all hover:shadow-xl relative"
                          >
                            {/* Header Card con colore dinamico del marchio */}
                            <div className="text-white p-6 relative overflow-hidden" style={{ backgroundColor: cardColor }}>
                              {course.isNew && (
                                <div className="absolute -right-12 top-4 bg-amber-400 text-slate-900 text-[10px] font-black py-1 px-12 rotate-45 shadow-sm uppercase tracking-wider">
                                  NOVITÀ
                                </div>
                              )}
                              
                              <div className="flex justify-between items-center mb-3">
                                <div className="flex items-center gap-2 bg-white/20 px-3 py-1 rounded">
                                  {brandObj?.logoUrl && <img src={brandObj.logoUrl} alt="" className="h-4 w-auto object-contain bg-white rounded p-0.5" />}
                                  <span className="text-white text-xs font-black tracking-wider">
                                    {course.brandName}
                                  </span>
                                </div>
                                <span className="text-xs text-white/90 bg-black/20 px-2.5 py-1 rounded font-medium">
                                  {course.modality}
                                </span>
                              </div>
                              <h3 className="text-lg sm:text-xl font-black tracking-tight text-white uppercase">{course.title}</h3>
                            </div>

                            {/* Contenuto Card */}
                            <div className="p-6 flex-grow flex flex-col justify-between">
                              <div>
                                <div className="grid grid-cols-2 gap-4 mb-4 pb-4 border-b border-slate-100 text-xs">
                                  <div>
                                    <span className="text-slate-400 font-bold uppercase block mb-1">DATA</span>
                                    <span className="font-bold text-slate-900">{course.date}</span>
                                  </div>
                                  <div>
                                    <span className="text-slate-400 font-bold uppercase block mb-1">ORARIO</span>
                                    <span className="font-bold text-slate-900">{course.time}</span>
                                  </div>
                                </div>

                                <div className="mb-4 pb-4 border-b border-slate-100 text-xs">
                                  <span className="text-slate-400 font-bold uppercase block mb-1">SEDE / MODALITÀ</span>
                                  <span className="font-bold text-slate-900">{course.location}</span>
                                </div>

                                <p className="text-slate-600 text-xs leading-relaxed mb-6 font-normal">
                                  {course.description}
                                </p>
                              </div>

                              <div>
                                {/* Barra Posti Disponibili */}
                                <div className="mb-6">
                                  <div className="flex justify-between items-center text-xs mb-1.5">
                                    <span className="text-slate-500 font-medium">Posti disponibili</span>
                                    <span className={`font-bold ${isFull ? 'text-red-600' : 'text-slate-900'}`}>
                                      {enrolled} / {maxLimit}
                                    </span>
                                  </div>
                                  <div className="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                                    <div 
                                      className={`h-full transition-all duration-500 ${isFull ? 'bg-red-600' : 'bg-[#1b365d]'}`}
                                      style={{ width: `${percentage}%` }}
                                    ></div>
                                  </div>
                                </div>

                            value={tempCompanyName}
                            onChange={(e) => setTempCompanyName(e.target.value)}
                            className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]"
                            placeholder="Es. Azienda di prova"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">URL Logo Aziendale (Header)</label>
                          <input
                            type="url"
                            value={tempCompanyLogo}
                            onChange={(e) => setTempCompanyLogo(e.target.value)}
                            className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]"
                            placeholder="https://esempio.com/logo-azienda.png"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Titolo Principale Calendario (Banner) *</label>
                          <input
                            type="text"
                            required
                            value={tempHeaderTitle}
                            onChange={(e) => setTempHeaderTitle(e.target.value)}
                            className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]"
                            placeholder="Es. CALENDARIO CORSI 2026"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Testo Copyright Footer *</label>
                          <input
                            type="text"
                            required
                            value={tempCopyrightText}
                            onChange={(e) => setTempCopyrightText(e.target.value)}
                            className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]"
                            placeholder="Es. © 2026 Nome Azienda. Tutti i diritti riservati."
                          />
                        </div>

                        <div className="pt-2">
                          <button
                            type="submit"
                            className="w-full bg-[#1b365d] hover:bg-[#162d4f] text-white font-bold py-3 px-4 rounded-xl text-sm transition-colors shadow-md"
                          >
                            Salva Personalizzazioni
                          </button>
                        </div>
                      </form>
                    </div>
                  )}

                  {/* SEZIONE INSERISCI O MODIFICA CORSO */}
                  {adminTab === 'add-course' && (
                    <div className="max-w-2xl mx-auto bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
                      <div className="flex justify-between items-center mb-1">
                        <h3 className="text-lg font-bold text-slate-900">
                          {editingCourseId ? '✏️ Modifica Corso Esistente' : '➕ Crea Nuovo Corso di Formazione'}
                        </h3>
                        {editingCourseId && (
                          <button
                            onClick={() => {
                              setEditingCourseId(null);
                              setNewCourseData({
                                brand: brands[0]?.id || 'tecnoalarm',
                                brandName: brands[0]?.name || 'TECNOALARM',
                                title: '',
                                code: '',
                                date: '',
                                time: '09:00 – 13:00',
                                modality: 'In presenza',
                                location: '',
                                maxParticipants: 12,
                                duration: '4 Ore',
                                description: '',
                                level: 'Base',
                                isNew: true
                              });
                            }}
                            className="text-xs text-blue-600 hover:underline font-semibold"
                          >
                            Passa a Nuovo Corso
                          </button>
                        )}
                      </div>
                      <p className="text-xs text-slate-500 mb-6">{companyName} • Gestione catalogo corsi formativi.</p>

                      <form onSubmit={handleAddCourseSubmit} className="space-y-4">
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Marchio di Riferimento *</label>
                            <select
                              name="brand"
                              value={newCourseData.brand}
                              onChange={handleNewCourseChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d] bg-white"
                            >
                              {brands.map(b => (
                                <option key={b.id} value={b.id}>{b.name}</option>
                              ))}
                            </select>
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Livello del Corso</label>
                            <select
                              name="level"
                              value={newCourseData.level}
                              onChange={handleNewCourseChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d] bg-white"
                            >
                              <option value="Base">Base</option>
                              <option value="Intermedio">Intermedio</option>
                              <option value="Avanzato">Avanzato</option>
                              <option value="Professionale">Professionale</option>
                            </select>
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Titolo del Corso *</label>
                          <input
                            type="text"
                            name="title"
                            required
                            value={newCourseData.title}
                            onChange={handleNewCourseChange}
                            className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]"
                            placeholder="Es. CORSO TECNICO AVANZATO"
                          />
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Modalità *</label>
                            <select
                              name="modality"
                              value={newCourseData.modality}
                              onChange={handleNewCourseChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d] bg-white"
                            >
                              <option value="In presenza">In presenza</option>
                              <option value="Google Meet">Google Meet</option>
                            </select>
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Max Partecipanti *</label>
                            <input
                              type="number"
                              name="maxParticipants"
                              min="1"
                              max="200"
                              required
                              value={newCourseData.maxParticipants}
                              onChange={handleNewCourseChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1 flex items-center gap-1">
                              <input 
                                type="checkbox" 
                                name="isNew"
                                checked={newCourseData.isNew}
                                onChange={handleNewCourseChange}
                                className="rounded border-slate-300"
                              />
                              Etichetta Novità
                            </label>
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Data *</label>
                            <input
                              type="text"
                              name="date"
                              required
                              value={newCourseData.date}
                              onChange={handleNewCourseChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]"
                              placeholder="Es. giovedì 15 nov 2026"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Orario *</label>
                            <input
                              type="text"
                              name="time"
                              required
                              value={newCourseData.time}
                              onChange={handleNewCourseChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]"
                              placeholder="Es. 09:00 – 13:00"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Durata *</label>
                            <input
                              type="text"
                              name="duration"
                              required
                              value={newCourseData.duration}
                              onChange={handleNewCourseChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]"
                              placeholder="Es. 4 Ore"
                            />
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Sede o Link Piattaforma *</label>
                          <input
                            type="text"
                            name="location"
                            required
                            value={newCourseData.location}
                            onChange={handleNewCourseChange}
                            className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]"
                            placeholder="Es. Via dell'Innovazione 8/10 - 20032 Cormano (MI)"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Descrizione Dettagliata *</label>
                          <textarea
                            name="description"
                            required
                            rows="3"
                            value={newCourseData.description}
                            onChange={handleNewCourseChange}
                            className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]"
                            placeholder="Panoramica prodotti, diagnostica e programmazione..."
                          ></textarea>
                        </div>

                        <div className="pt-2 flex gap-3">
                          <button
                            type="submit"
                            className="flex-1 bg-[#1b365d] hover:bg-[#162d4f] text-white font-bold py-3 px-4 rounded-xl text-sm transition-colors shadow-md"
                          >
                            {editingCourseId ? 'Salva Modifiche Corso' : 'Pubblica Corso nel Catalogo'}
                          </button>
                          <button
                            type="button"
                            onClick={() => { setEditingCourseId(null); setAdminTab('registrations'); }}
                            className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-4 rounded-xl text-sm transition-colors"
                          >
                            Annulla
                          </button>
                        </div>
                      </form>

                      {/* Lista corsi esistenti con opzioni di modifica ed eliminazione */}
                      <div className="mt-10 border-t border-slate-200 pt-6">
                        <h4 className="text-sm font-bold text-slate-900 mb-3">Corsi Attualmente in Catalogo (Gestione Rapida)</h4>
                        <div className="space-y-2 max-h-60 overflow-y-auto">
                          {courses.map(c => {
                            const bObj = brands.find(b => b.id === c.brand || b.name === c.brandName);
                            return (
                              <div key={c.id} className="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs">
                                <div>
                                  <span className="font-bold uppercase" style={{ color: bObj?.color || '#8b1e1e' }}>{c.brandName}:</span> <span className="font-semibold text-slate-900">{c.title}</span> <span className="text-slate-500">({c.date})</span>
                                </div>
                                <div className="flex gap-1.5">
                                  <button
                                    onClick={() => handleEditCourseClick(c)}
                                    className="text-blue-600 hover:text-blue-800 font-bold px-2.5 py-1 bg-white border border-blue-200 rounded-lg shadow-sm"
                                  >
                                    Modifica
                                  </button>
                                  <button
                                    onClick={() => handleDeleteCourse(c.id)}
                                    className="text-red-600 hover:text-red-800 font-bold px-2.5 py-1 bg-white border border-red-200 rounded-lg shadow-sm"
                                  >
                                    Elimina
                                  </button>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>

                    </div>
                  )}

                </div>
              )}

            </main>

            {/* Footer */}
            <footer className="bg-[#1b365d] text-white border-t border-blue-900/50 py-6 text-center text-xs text-slate-300 mt-16">
              <p>{copyrightText}</p>
            </footer>
          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById('root'));
    </script>
  </body>
</html>
