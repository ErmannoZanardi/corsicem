<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portale Iscrizione ai Corsi | Portale Formazione</title>
    <!-- Google Fonts: Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Roboto', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <!-- React e ReactDOM da CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel per JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase JS Client per database cloud -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body class="bg-slate-100 text-slate-800 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // ==========================================
      // CONFIGURAZIONE SUPABASE (Database Cloud)
      // ==========================================
      const SUPABASE_URL = "https://nsfqltisjpjirqoadjnh.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zZnFsdGlzanBqaXJxb2Fkam5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4ODk5NDgsImV4cCI6MjEwNjQ2NTk0OH0.uWIC4REeMSmFC1LbYt7kpZP40CQ4GXbmH_Ct7AkkGFE";

      let supabaseClient = null;
      if (SUPABASE_URL && SUPABASE_URL !== "YOUR_SUPABASE_URL" && window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }

      function App() {
        const [view, setView] = useState('courses'); 
        const [selectedBrand, setSelectedBrand] = useState('all');
        const [selectedCourse, setSelectedCourse] = useState(null);
        const [submitted, setSubmitted] = useState(false);
        const [submitError, setSubmitError] = useState('');
        const [adminPin, setAdminPin] = useState('');
        const [adminError, setAdminError] = useState(false);
        const [adminTab, setAdminTab] = useState('registrations'); 

        const [companyName, setCompanyName] = useState('Azienda di prova');
        const [companyLogo, setCompanyLogo] = useState('');
        const [headerTitle, setHeaderTitle] = useState('CALENDARIO CORSI 2026');
        const [copyrightText, setCopyrightText] = useState('© 2026 Portale Formazione Installatori Tecnici. Tutti i diritti riservati.');
        const [adminEmail, setAdminEmail] = useState('ermanno.zanardi69@gmail.com');

        const [brands, setBrands] = useState([
          { id: 'tecnoalarm', name: 'TECNOALARM', logoUrl: '', color: '#8b1e1e' },
          { id: 'tecnofire', name: 'TECNOFIRE', logoUrl: '', color: '#b91c1c' },
          { id: 'nice', name: 'NICE', logoUrl: '', color: '#0369a1' },
          { id: 'dahua', name: 'DAHUA', logoUrl: '', color: '#4338ca' }
        ]);

        const [newBrandData, setNewBrandData] = useState({ name: '', logoUrl: '', color: '#1b365d' });

        const [tempCompanyName, setTempCompanyName] = useState(companyName);
        const [tempCompanyLogo, setTempCompanyLogo] = useState(companyLogo);
        const [tempHeaderTitle, setTempHeaderTitle] = useState(headerTitle);
        const [tempCopyrightText, setTempCopyrightText] = useState(copyrightText);
        const [tempAdminEmail, setTempAdminEmail] = useState(adminEmail);
        const [settingsSavedMsg, setSettingsSavedMsg] = useState(false);

        const [courses, setCourses] = useState([]);
        const [registrations, setRegistrations] = useState([]);

        useEffect(() => {
          async function fetchData() {
            if (supabaseClient) {
              const { data: settingsData, error: settingsError } = await supabaseClient.from('settings').select('*');
              if (!settingsError && settingsData && settingsData.length > 0) {
                settingsData.forEach(item => {
                  if (item.key === 'company_name') setCompanyName(item.value);
                  if (item.key === 'company_logo') setCompanyLogo(item.value);
                  if (item.key === 'header_title') setHeaderTitle(item.value);
                  if (item.key === 'copyright_text') setCopyrightText(item.value);
                  if (item.key === 'admin_email') setAdminEmail(item.value);
                  if (item.key === 'brands_list') {
                    try { setBrands(JSON.parse(item.value)); } catch(e) {}
                  }
                });
              }

              const { data: coursesData, error: coursesError } = await supabaseClient.from('courses').select('*');
              if (!coursesError && coursesData && coursesData.length > 0) {
                const formattedCourses = coursesData.map(c => ({
                  id: c.id,
                  brand: c.brand,
                  brandName: c.brand_name,
                  title: c.title,
                  code: c.code,
                  date: c.date,
                  time: c.time,
                  modality: c.modality,
                  location: c.location,
                  maxParticipants: c.max_participants,
                  duration: c.duration,
                  description: c.description,
                  level: c.level,
                  isNew: c.is_new
                }));
                setCourses(formattedCourses);
              }

              const { data: regData, error: regError } = await supabaseClient.from('registrations').select('*').order('id', { ascending: false });
              if (!regError && regData) {
                const formattedRegs = regData.map(r => ({
                  id: r.id,
                  courseId: r.course_id,
                  fullName: r.full_name,
                  company: r.company,
                  vatNumber: r.vat_number,
                  email: r.email,
                  phone: r.phone,
                  city: r.city,
                  courseTitle: r.course_title,
                  brandName: r.brand_name,
                  date: r.date,
                  timestamp: r.timestamp
                }));
                setRegistrations(formattedRegs);
              }
            }
          }
          fetchData();
        }, []);

        useEffect(() => {
          setTempCompanyName(companyName);
          setTempCompanyLogo(companyLogo);
          setTempHeaderTitle(headerTitle);
          setTempCopyrightText(copyrightText);
          setTempAdminEmail(adminEmail);
        }, [companyName, companyLogo, headerTitle, copyrightText, adminEmail]);

        const [formData, setFormData] = useState({
          fullName: '',
          company: '',
          vatNumber: '',
          email: '',
          phone: '',
          city: ''
        });

        const [editingCourseId, setEditingCourseId] = useState(null);
        const [newCourseData, setNewCourseData] = useState({
          brand: brands[0]?.id || 'tecnoalarm',
          brandName: brands[0]?.name || 'TECNOALARM',
          title: '',
          code: '',
          date: '',
          time: '09:00 – 13:00',
          modality: 'In presenza',
          location: '',
          maxParticipants: 12,
          duration: '4 Ore',
          description: '',
          level: 'Base',
          isNew: true
        });

        const filteredCourses = selectedBrand === 'all' 
          ? courses 
          : courses.filter(c => c.brand === selectedBrand);

        const handleInputChange = (e) => {
          setFormData({ ...formData, [e.target.name]: e.target.value });
        };

        const getCourseEnrollmentCount = (courseId) => {
          return registrations.filter(r => r.courseId === courseId).length;
        };

        const getCompanyEnrollmentCountForCourse = (courseId, vatNumber) => {
          const cleanVat = vatNumber.trim().toLowerCase();
          return registrations.filter(r => r.courseId === courseId && r.vatNumber.trim().toLowerCase() === cleanVat).length;
        };

        const saveSettingToSupabase = async (key, value) => {
          if (supabaseClient) {
            await supabaseClient.from('settings').upsert([{ key, value, updated_at: new Date() }]);
          }
        };

        const handleSubmit = async (e) => {
          e.preventDefault();
          setSubmitError('');

          const currentCount = getCourseEnrollmentCount(selectedCourse.id);
          const maxAllowed = selectedCourse.maxParticipants || 12;

          if (currentCount >= maxAllowed) {
            setSubmitError('Spiacenti, questo corso ha raggiunto il numero massimo di partecipanti ed è completo (Sold Out).');
            return;
          }

          const companyCount = getCompanyEnrollmentCountForCourse(selectedCourse.id, formData.vatNumber);
          if (companyCount >= 2) {
            setSubmitError('Attenzione: La tua azienda ha già raggiunto il limite massimo di 2 partecipanti iscritti a questo corso.');
            return;
          }

          // CORRETTO: Gestione del tipo course_id per evitare errori di tipo bigint/uuid sul database
          let parsedCourseId = selectedCourse.id;
          if (typeof parsedCourseId === 'string' && !isNaN(parsedCourseId)) {
            parsedCourseId = parseInt(parsedCourseId, 10);
          } else if (typeof parsedCourseId === 'string') {
            // Se il database richiede un numero bigint ma l'id è una stringa alfanumerica/UUID, 
            // proviamo a convertirlo o passarlo in modo sicuro (o gestiamo eventuali fallback).
            // Se la tua tabella usa UUID per courses.id, allora la tabella registrations.course_id deve essere uuid e non bigint.
            // Qui convertiamo in numero se possibile, altrimenti se la colonna è bigint e riceve UUID va modificata la tabella su Supabase.
            const num = Number(parsedCourseId);
            if (!isNaN(num)) parsedCourseId = num;
          }

          const newRegData = {
            course_id: parsedCourseId,
            full_name: formData.fullName,
            company: formData.company,
            vat_number: formData.vatNumber,
            email: formData.email,
            phone: formData.phone,
            city: formData.city,
            course_title: selectedCourse.title,
            brand_name: selectedCourse.brandName,
            date: selectedCourse.date,
            timestamp: new Date().toLocaleString()
          };

          if (supabaseClient) {
            const { data, error } = await supabaseClient.from('registrations').insert([newRegData]).select();
            if (error) {
              setSubmitError("Errore di connessione al database cloud: " + error.message);
              return;
            }
            if (data && data[0]) {
              newRegData.id = data[0].id;
            }
          }

          const localReg = {
            id: newRegData.id || Date.now(),
            courseId: selectedCourse.id,
            ...formData,
            courseTitle: selectedCourse.title,
            brandName: selectedCourse.brandName,
            date: selectedCourse.date,
            timestamp: newRegData.timestamp
          };

          setRegistrations([localReg, ...registrations]);
          setSubmitted(true);
        };

        const handleAdminLogin = (e) => {
          e.preventDefault();
          if (adminPin === 'admin123') {
            setAdminError(false);
            setView('admin-dashboard');
            setAdminPin('');
          } else {
            setAdminError(true);
          }
        };

        const handleSaveSettings = async (e) => {
          e.preventDefault();
          setCompanyName(tempCompanyName);
          setCompanyLogo(tempCompanyLogo);
          setHeaderTitle(tempHeaderTitle);
          setCopyrightText(tempCopyrightText);
          setAdminEmail(tempAdminEmail);

          await saveSettingToSupabase('company_name', tempCompanyName);
          await saveSettingToSupabase('company_logo', tempCompanyLogo);
          await saveSettingToSupabase('header_title', tempHeaderTitle);
          await saveSettingToSupabase('copyright_text', tempCopyrightText);
          await saveSettingToSupabase('admin_email', tempAdminEmail);

          setSettingsSavedMsg(true);
          setTimeout(() => setSettingsSavedMsg(false), 3000);
        };

        const handleAddBrandSubmit = async (e) => {
          e.preventDefault();
          if (!newBrandData.name.trim()) return;
          const id = newBrandData.name.toLowerCase().replace(/[^a-z0-9]/g, '_');
          if (brands.some(b => b.id === id)) {
            alert('Questo marchio esiste già.');
            return;
          }
          const updatedBrands = [...brands, { id, name: newBrandData.name.toUpperCase(), logoUrl: newBrandData.logoUrl, color: newBrandData.color }];
          setBrands(updatedBrands);
          await saveSettingToSupabase('brands_list', JSON.stringify(updatedBrands));
          setNewBrandData({ name: '', logoUrl: '', color: '#1b365d' });
          alert('Marchio aggiunto e salvato su Supabase!');
        };

        const handleDeleteBrand = async (brandId) => {
          if (confirm('Vuoi davvero rimuovere questo marchio?')) {
            const updatedBrands = brands.filter(b => b.id !== brandId);
            setBrands(updatedBrands);
            await saveSettingToSupabase('brands_list', JSON.stringify(updatedBrands));
          }
        };

        const handleBrandUpdate = async (brandId, field, value) => {
          const updatedBrands = brands.map(b => b.id === brandId ? { ...b, [field]: value } : b);
          setBrands(updatedBrands);
          await saveSettingToSupabase('brands_list', JSON.stringify(updatedBrands));
        };

        const handleNewCourseChange = (e) => {
          const { name, value, type, checked } = e.target;
          if (name === 'brand') {
            const foundBrand = brands.find(b => b.id === value);
            setNewCourseData({ ...newCourseData, brand: value, brandName: foundBrand ? foundBrand.name : value.toUpperCase() });
          } else if (name === 'modality' && value === 'Google Meet') {
            setNewCourseData({ ...newCourseData, modality: value, location: 'Google Meet (Link online)' });
          } else {
            setNewCourseData({ ...newCourseData, [name]: type === 'checkbox' ? checked : value });
          }
        };

        const handleAddCourseSubmit = async (e) => {
          e.preventDefault();

          const coursePayload = {
            brand: newCourseData.brand,
            brand_name: newCourseData.brandName,
            title: newCourseData.title,
            code: newCourseData.code || '',
            date: newCourseData.date,
            time: newCourseData.time,
            modality: newCourseData.modality,
            location: newCourseData.location,
            max_participants: parseInt(newCourseData.maxParticipants) || 12,
            duration: newCourseData.duration,
            description: newCourseData.description,
            level: newCourseData.level,
            is_new: newCourseData.isNew
          };

          if (editingCourseId) {
            if (supabaseClient) {
              const { error } = await supabaseClient.from('courses').update(coursePayload).eq('id', editingCourseId);
              if (error) {
                alert("Errore durante l'aggiornamento su Supabase: " + error.message);
                return;
              }
            }

            setCourses(courses.map(c => c.id === editingCourseId ? { ...c, ...newCourseData, maxParticipants: parseInt(newCourseData.maxParticipants) || 12 } : c));
            alert('Corso modificato con successo!');
            setEditingCourseId(null);
          } else {
            let newId = Date.now();
            if (supabaseClient) {
              const { data, error } = await supabaseClient.from('courses').insert([coursePayload]).select();
              if (error) {
                alert("Errore durante il salvataggio su Supabase: " + error.message);
                return;
              }
              if (data && data[0]) {
                newId = data[0].id;
              }
            }

            const createdCourse = {
              id: newId,
              ...newCourseData,
              maxParticipants: parseInt(newCourseData.maxParticipants) || 12
            };
            setCourses([...courses, createdCourse]);
            alert('Nuovo corso aggiunto con successo sul database!');
          }

          setNewCourseData({
            brand: brands[0]?.id || 'tecnoalarm',
            brandName: brands[0]?.name || 'TECNOALARM',
            title: '',
            code: '',
            date: '',
            time: '09:00 – 13:00',
            modality: 'In presenza',
            location: '',
            maxParticipants: 12,
            duration: '4 Ore',
            description: '',
            level: 'Base',
            isNew: true
          });
          setAdminTab('registrations');
        };

        const handleEditCourseClick = (course) => {
          setEditingCourseId(course.id);
          setNewCourseData({
            brand: course.brand,
            brandName: course.brandName,
            title: course.title,
            code: course.code || '',
            date: course.date,
            time: course.time,
            modality: course.modality,
            location: course.location,
            maxParticipants: course.maxParticipants,
            duration: course.duration,
            description: course.description,
            level: course.level || 'Base',
            isNew: course.isNew || false
          });
          setAdminTab('add-course');
        };

        const handleDeleteCourse = async (id) => {
          if (confirm('Vuoi davvero eliminare questo corso?')) {
            if (supabaseClient) {
              const { error } = await supabaseClient.from('courses').delete().eq('id', id);
              if (error) {
                alert("Errore durante l'eliminazione: " + error.message);
                return;
              }
            }
            setCourses(courses.filter(c => c.id !== id));
            if (editingCourseId === id) setEditingCourseId(null);
            alert('Corso eliminato con successo.');
          }
        };

        const handleDownloadLocandina = (course) => {
          alert(`Download locandina per: ${course.title} (${course.brandName})`);
        };

        const totalRegistrations = registrations.length;
        const registrationsByBrand = registrations.reduce((acc, reg) => {
          acc[reg.brandName] = (acc[reg.brandName] || 0) + 1;
          return acc;
        }, {});

        return (
          <div className="min-h-screen flex flex-col bg-slate-100 text-slate-800 font-sans">
            <header className="bg-[#1b365d] text-white shadow-md">
              <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div className="flex items-center space-x-3 cursor-pointer" onClick={() => { setView('courses'); setSelectedCourse(null); setSubmitted(false); }}>
                  {companyLogo ? (
                    <img src={companyLogo} alt={companyName} className="h-10 w-auto rounded object-contain bg-white p-1" />
                  ) : (
                    <div className="bg-[#d9381e] p-2 rounded-lg text-white font-bold shadow">💡</div>
                  )}
                  <div>
                    <h1 className="text-sm sm:text-base font-bold tracking-tight">Portale Iscrizione ai Corsi Tecnico Commerciali di {companyName}</h1>
                    <p className="text-xs text-slate-300">Formazione tecnica professionale</p>
                  </div>
                </div>
                <div>
                  {view !== 'admin-dashboard' && view !== 'admin-login' ? (
                    <button
                      onClick={() => { setView('admin-login'); setAdminError(false); }}
                      className="text-amber-300 hover:text-amber-200 text-sm font-bold transition-colors uppercase tracking-wider px-3 py-1.5 rounded-lg border border-amber-300/30 hover:bg-amber-400/10"
                    >
                      Admin
                    </button>
                  ) : (
                    <button
                      onClick={() => { setView('courses'); setSelectedCourse(null); setSubmitted(false); }}
                      className="text-white hover:text-slate-200 text-sm font-bold transition-colors bg-blue-600 px-3 py-1.5 rounded-lg"
                    >
                      Home Corsi
                    </button>
                  )}
                </div>
              </div>

              {view === 'courses' && !selectedCourse && (
                <div className="bg-[#162d4f] py-10 text-center border-t border-blue-900/50">
                  <h2 className="text-2xl sm:text-4xl font-black tracking-wide uppercase text-white mb-2">{headerTitle}</h2>
                  <p className="text-xs sm:text-sm text-slate-300 font-light">Formazione tecnica sui sistemi dei marchi autorizzati</p>
                </div>
              )}
            </header>

            <main className="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
              {view === 'courses' && !selectedCourse && (
                <div>
                  <div className="flex flex-wrap justify-center gap-2 mb-8">
                    <button
                      onClick={() => setSelectedBrand('all')}
                      className={`px-4 py-2 rounded-xl text-sm font-bold transition-all shadow-sm ${selectedBrand === 'all' ? 'bg-[#1b365d] text-white shadow-md' : 'bg-white text-slate-700 hover:bg-slate-200 border border-slate-300'}`}
                    >
                      Tutti i Marchi
                    </button>
                    {brands.map(brand => (
                      <button
                        key={brand.id}
                        onClick={() => setSelectedBrand(brand.id)}
                        className={`px-4 py-2 rounded-xl text-sm font-bold transition-all shadow-sm flex items-center gap-2 ${selectedBrand === brand.id ? 'bg-[#1b365d] text-white shadow-md' : 'bg-white text-slate-700 hover:bg-slate-200 border border-slate-300'}`}
                      >
                        <span className="w-3 h-3 rounded-full inline-block" style={{ backgroundColor: brand.color || '#8b1e1e' }}></span>
                        {brand.logoUrl && <img src={brand.logoUrl} alt="" className="h-5 w-auto object-contain" />}
                        {brand.name}
                      </button>
                    ))}
                  </div>

                  {filteredCourses.length === 0 ? (
                    <div className="bg-white rounded-2xl border border-slate-200 p-12 text-center text-slate-500 text-base shadow-sm">
                      Nessun corso disponibile al momento per questo marchio.
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                      {filteredCourses.map(course => {
                        const enrolled = getCourseEnrollmentCount(course.id);
                        const maxLimit = course.maxParticipants || 12;
                        const isFull = enrolled >= maxLimit;
                        const percentage = Math.min(100, Math.round((enrolled / maxLimit) * 100));
                        const brandObj = brands.find(b => b.id === course.brand || b.name === course.brandName);
                        const cardColor = brandObj?.color || '#8b1e1e';

                        return (
                          <div key={course.id} className="bg-white rounded-2xl border border-slate-200 shadow-lg overflow-hidden flex flex-col justify-between transition-all hover:shadow-xl relative">
                            <div className="text-white p-6 relative overflow-hidden" style={{ backgroundColor: cardColor }}>
                              {course.isNew && (
                                <div className="absolute -right-12 top-4 bg-amber-400 text-slate-900 text-xs font-black py-1 px-12 rotate-45 shadow-sm uppercase tracking-wider">NOVITÀ</div>
                              )}
                              <div className="flex justify-between items-center mb-3">
                                <div className="flex items-center gap-2 bg-white/20 px-3.5 py-1.5 rounded-lg">
                                  {brandObj?.logoUrl && <img src={brandObj.logoUrl} alt="" className="h-5 w-auto object-contain bg-white rounded p-0.5" />}
                                  <span className="text-white text-sm font-black tracking-wider">{course.brandName}</span>
                                </div>
                                <span className="text-xs sm:text-sm text-white/95 bg-black/25 px-3 py-1 rounded-lg font-semibold">{course.modality}</span>
                              </div>
                              <h3 className="text-xl sm:text-2xl font-black tracking-tight text-white uppercase">{course.title}</h3>
                            </div>

                            <div className="p-6 sm:p-8 flex-grow flex flex-col justify-between">
                              <div>
                                <div className="grid grid-cols-2 gap-4 mb-5 pb-5 border-b border-slate-100 text-sm">
                                  <div>
                                    <span className="text-slate-400 font-bold uppercase block mb-1 text-xs">DATA</span>
                                    <span className="font-bold text-slate-900 text-base">{course.date}</span>
                                  </div>
                                  <div>
                                    <span className="text-slate-400 font-bold uppercase block mb-1 text-xs">ORARIO</span>
                                    <span className="font-bold text-slate-900 text-base">{course.time}</span>
                                  </div>
                                </div>
                                <div className="mb-5 pb-5 border-b border-slate-100 text-sm">
                                  <span className="text-slate-400 font-bold uppercase block mb-1 text-xs">SEDE / MODALITÀ</span>
                                  <span className="font-bold text-slate-900 text-base">{course.location}</span>
                                </div>
                                <p className="text-slate-700 text-sm sm:text-base leading-relaxed mb-6 font-normal">{course.description}</p>
                              </div>

                              <div>
                                <div className="mb-6">
                                  <div className="flex justify-between items-center text-sm mb-2">
                                    <span className="text-slate-600 font-bold">Posti occupati</span>
                                    <span className={`font-black text-base ${isFull ? 'text-red-600' : 'text-slate-900'}`}>{enrolled} / {maxLimit}</span>
                                  </div>
                                  <div className="w-full bg-slate-200 h-3 rounded-full overflow-hidden shadow-inner">
                                    <div className={`h-full transition-all duration-500 ${isFull ? 'bg-red-600' : 'bg-[#1b365d]'}`} style={{ width: `${percentage}%` }}></div>
                                  </div>
                                </div>

                                <div className="space-y-3">
                                  <button
                                    onClick={() => { setSelectedCourse(course); setSubmitted(false); setSubmitError(''); }}
                                    disabled={isFull}

                      </div>
                      <p className="text-xs text-slate-500 mb-6">{companyName} • Gestione catalogo corsi formativi su Supabase.</p>

                      <form onSubmit={handleAddCourseSubmit} className="space-y-4">
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Marchio di Riferimento *</label>
                            <select name="brand" value={newCourseData.brand} onChange={handleNewCourseChange} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d] bg-white">
                              {brands.map(b => (<option key={b.id} value={b.id}>{b.name}</option>))}
                            </select>
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Livello del Corso</label>
                            <select name="level" value={newCourseData.level} onChange={handleNewCourseChange} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d] bg-white">
                              <option value="Base">Base</option>
                              <option value="Intermedio">Intermedio</option>
                              <option value="Avanzato">Avanzato</option>
                              <option value="Professionale">Professionale</option>
                            </select>
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Titolo del Corso *</label>
                          <input type="text" name="title" required value={newCourseData.title} onChange={handleNewCourseChange} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Es. CORSO TECNICO AVANZATO" />
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Modalità *</label>
                            <select name="modality" value={newCourseData.modality} onChange={handleNewCourseChange} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d] bg-white">
                              <option value="In presenza">In presenza</option>
                              <option value="Google Meet">Google Meet</option>
                            </select>
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Max Partecipanti *</label>
                            <input type="number" name="maxParticipants" min="1" max="200" required value={newCourseData.maxParticipants} onChange={handleNewCourseChange} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1 flex items-center gap-1">
                              <input type="checkbox" name="isNew" checked={newCourseData.isNew} onChange={handleNewCourseChange} className="rounded border-slate-300" /> Etichetta Novità
                            </label>
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Data *</label>
                            <input type="text" name="date" required value={newCourseData.date} onChange={handleNewCourseChange} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Es. giovedì 15 nov 2026" />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Orario *</label>
                            <input type="text" name="time" required value={newCourseData.time} onChange={handleNewCourseChange} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Es. 09:00 – 13:00" />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Durata *</label>
                            <input type="text" name="duration" required value={newCourseData.duration} onChange={handleNewCourseChange} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Es. 4 Ore" />
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Sede o Link Piattaforma *</label>
                          <input type="text" name="location" required value={newCourseData.location} onChange={handleNewCourseChange} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Es. Via Bergamo,20 - 24050 Mornico al Serio (BG)" />
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Descrizione Dettagliata *</label>
                          <textarea name="description" required rows="3" value={newCourseData.description} onChange={handleNewCourseChange} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Panoramica prodotti, diagnostica e programmazione..."></textarea>
                        </div>

                        <div className="pt-2 flex gap-3">
                          <button type="submit" className="flex-1 bg-[#1b365d] hover:bg-[#162d4f] text-white font-bold py-3 px-4 rounded-xl text-sm transition-colors shadow-md">{editingCourseId ? 'Salva Modifiche Corso' : 'Pubblica Corso nel Catalogo'}</button>
                          <button type="button" onClick={() => { setEditingCourseId(null); setAdminTab('registrations'); }} className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-4 rounded-xl text-sm transition-colors">Annulla</button>
                        </div>
                      </form>

                      <div className="mt-10 border-t border-slate-200 pt-6">
                        <h4 className="text-sm font-bold text-slate-900 mb-3">Corsi Attualmente in Catalogo (Gestione Rapida)</h4>
                        <div className="space-y-2 max-h-60 overflow-y-auto">
                          {courses.map(c => {
                            const bObj = brands.find(b => b.id === c.id || b.name === c.brandName);
                            return (
                              <div key={c.id} className="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs">
                                <div>
                                  <span className="font-bold uppercase" style={{ color: bObj?.color || '#8b1e1e' }}>{c.brandName}:</span> <span className="font-semibold text-slate-900">{c.title}</span> <span className="text-slate-500">({c.date})</span>
                                </div>
                                <div className="flex gap-1.5">
                                  <button onClick={() => handleEditCourseClick(c)} className="text-blue-600 hover:text-blue-800 font-bold px-2.5 py-1 bg-white border border-blue-200 rounded-lg shadow-sm">Modifica</button>
                                  <button onClick={() => handleDeleteCourse(c.id)} className="text-red-600 hover:text-red-800 font-bold px-2.5 py-1 bg-white border border-red-200 rounded-lg shadow-sm">Elimina</button>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </main>

            <footer className="bg-[#1b365d] text-white border-t border-blue-900/50 py-6 text-center text-xs text-slate-300 mt-16">
              <p>{copyrightText}</p>
            </footer>
          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById('root'));
    </script>
  </body>
</html>
