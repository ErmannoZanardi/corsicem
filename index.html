<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  </head>
  <body class="bg-slate-100 text-slate-800 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // ==========================================
      // CONFIGURAZIONE SUPABASE (Database Cloud)
      // ==========================================
      const SUPABASE_URL = "https://nsfqltisjpjirqoadjnh.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zZnFsdGlzanBqaXJxb2Fkam5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4ODk5NDgsImV4cCI6MjEwNjQ2NTk0OH0.uWIC4REeMSmFC1LbYt7kpZP40CQ4GXbmH_Ct7AkkGFE";

      let supabaseClient = null;
      if (SUPABASE_URL && SUPABASE_URL !== "YOUR_SUPABASE_URL" && window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }

      function App() {
        const [view, setView] = useState('courses'); 
        const [selectedBrand, setSelectedBrand] = useState('all');
        const [selectedCourse, setSelectedCourse] = useState(null);
        const [submitted, setSubmitted] = useState(false);
        const [submitError, setSubmitError] = useState('');
        const [adminPin, setAdminPin] = useState('');
        const [adminError, setAdminError] = useState(false);
        const [adminTab, setAdminTab] = useState('registrations'); 

        const [companyName, setCompanyName] = useState('Azienda di prova');
        const [companyLogo, setCompanyLogo] = useState('');
        const [headerTitle, setHeaderTitle] = useState('CALENDARIO CORSI 2026');
        const [copyrightText, setCopyrightText] = useState('© 2026 Portale Formazione Installatori Tecnici. Tutti i diritti riservati.');
        const [adminEmail, setAdminEmail] = useState('ermanno.zanardi69@gmail.com');

        const [brands, setBrands] = useState([
          { id: 'tecnoalarm', name: 'TECNOALARM', logoUrl: '', color: '#8b1e1e', posterBgUrl: '', certificateBgUrl: '' },
          { id: 'tecnofire', name: 'TECNOFIRE', logoUrl: '', color: '#b91c1c', posterBgUrl: '', certificateBgUrl: '' },
          { id: 'nice', name: 'NICE', logoUrl: '', color: '#0369a1', posterBgUrl: '', certificateBgUrl: '' },
          { id: 'dahua', name: 'DAHUA', logoUrl: '', color: '#4338ca', posterBgUrl: '', certificateBgUrl: '' }
        ]);

        const [newBrandData, setNewBrandData] = useState({ name: '', logoUrl: '', color: '#1b365d', posterBgUrl: '', certificateBgUrl: '' });

        const [tempCompanyName, setTempCompanyName] = useState(companyName);
        const [tempCompanyLogo, setTempCompanyLogo] = useState(companyLogo);
        const [tempHeaderTitle, setTempHeaderTitle] = useState(headerTitle);
        const [tempCopyrightText, setTempCopyrightText] = useState(copyrightText);
        const [tempAdminEmail, setTempAdminEmail] = useState(adminEmail);
        const [settingsSavedMsg, setSettingsSavedMsg] = useState(false);

        const [courses, setCourses] = useState([]);
        const [registrations, setRegistrations] = useState([]);
        
        // Stati per la modifica di un'iscrizione esistente dall'Admin
        const [editingRegistrationId, setEditingRegistrationId] = useState(null);
        const [editRegData, setEditRegData] = useState({
          fullName: '',
          company: '',
          vatNumber: '',
          email: '',
          phone: '',
          city: ''
        });

        const editorRef = useRef(null);

        useEffect(() => {
          async function fetchData() {
            if (supabaseClient) {
              const { data: settingsData, error: settingsError } = await supabaseClient.from('settings').select('*');
              if (!settingsError && settingsData && settingsData.length > 0) {
                settingsData.forEach(item => {
                  if (item.key === 'company_name') setCompanyName(item.value);
                  if (item.key === 'company_logo') setCompanyLogo(item.value);
                  if (item.key === 'header_title') setHeaderTitle(item.value);
                  if (item.key === 'copyright_text') setCopyrightText(item.value);
                  if (item.key === 'admin_email') setAdminEmail(item.value);
                  if (item.key === 'brands_list') {
                    try { setBrands(JSON.parse(item.value)); } catch(e) {}
                  }
                });
              }

              const { data: coursesData, error: coursesError } = await supabaseClient.from('courses').select('*');
              if (!coursesError && coursesData && coursesData.length > 0) {
                const formattedCourses = coursesData.map(c => ({
                  id: c.id,
                  brand: c.brand,
                  brandName: c.brand_name,
                  title: c.title,
                  code: c.code,
                  date: c.date,
                  time: c.time,
                  modality: c.modality,
                  location: c.location,
                  maxParticipants: c.max_participants,
                  duration: c.duration,
                  description: c.description,
                  level: c.level || 'Base',
                  price: c.price || 'Gratuito',
                  speaker: c.speaker || 'Ermanno Zanardi',
                  isNew: c.is_new,
                  isActive: c.is_active !== undefined ? c.is_active : true
                }));
                setCourses(formattedCourses);
              }

              const { data: regData, error: regError } = await supabaseClient.from('registrations').select('*').order('id', { ascending: false });
              if (!regError && regData) {
                const formattedRegs = regData.map(r => ({
                  id: r.id,
                  courseId: r.course_id,
                  fullName: r.full_name,
                  company: r.company,
                  vatNumber: r.vat_number,
                  email: r.email,
                  phone: r.phone,
                  city: r.city,
                  courseTitle: r.course_title,
                  brandName: r.brand_name,
                  date: r.date,
                  timestamp: r.timestamp
                }));
                setRegistrations(formattedRegs);
              }
            }
          }
          fetchData();
        }, []);

        useEffect(() => {
          setTempCompanyName(companyName);
          setTempCompanyLogo(companyLogo);
          setTempHeaderTitle(headerTitle);
          setTempCopyrightText(copyrightText);
          setTempAdminEmail(adminEmail);
        }, [companyName, companyLogo, headerTitle, copyrightText, adminEmail]);

        const [formData, setFormData] = useState({
          fullName: '',
          company: '',
          vatNumber: '',
          email: '',
          phone: '',
          city: ''
        });

        const [editingCourseId, setEditingCourseId] = useState(null);
        const [newCourseData, setNewCourseData] = useState({
          brand: brands[0]?.id || 'tecnoalarm',
          brandName: brands[0]?.name || 'TECNOALARM',
          title: '',
          code: '',
          date: '',
          time: '09:00 – 13:00',
          modality: 'In presenza',
          location: '',
          maxParticipants: 12,
          duration: '4 Ore',
          description: '',
          level: 'Base',
          price: 'Gratuito',
          speaker: 'Ermanno Zanardi',
          isNew: true,
          isActive: true
        });

        useEffect(() => {
          if (editorRef.current) {
            if (editorRef.current.innerHTML !== newCourseData.description) {
              editorRef.current.innerHTML = newCourseData.description || '';
            }
          }
        }, [editingCourseId, adminTab]);

        const activeCoursesForPublic = courses.filter(c => c.isActive !== false);

        const filteredCourses = selectedBrand === 'all' 
          ? activeCoursesForPublic 
          : activeCoursesForPublic.filter(c => c.brand === selectedBrand);

        const handleInputChange = (e) => {
          setFormData({ ...formData, [e.target.name]: e.target.value });
        };

        const getCourseEnrollmentCount = (courseId) => {
          return registrations.filter(r => r.courseId === courseId).length;
        };

        const getCompanyEnrollmentCountForCourse = (courseId, vatNumber) => {
          const cleanVat = vatNumber.trim().toLowerCase();
          return registrations.filter(r => r.courseId === courseId && r.vatNumber.trim().toLowerCase() === cleanVat).length;
        };

        const saveSettingToSupabase = async (key, value) => {
          if (supabaseClient) {
            await supabaseClient.from('settings').upsert([{ key, value, updated_at: new Date() }]);
          }
        };

        const handleSubmit = async (e) => {
          e.preventDefault();
          setSubmitError('');

          const courseObj = courses.find(c => c.id === selectedCourse.id);
          const maxAllowed = courseObj?.maxParticipants || selectedCourse.maxParticipants || 12;
          const currentCount = getCourseEnrollmentCount(selectedCourse.id);

          if (currentCount >= maxAllowed) {
            setSubmitError('Spiacenti, questo corso ha raggiunto il numero massimo di partecipanti ed è completo (Sold Out).');
            return;
          }

          const companyCount = getCompanyEnrollmentCountForCourse(selectedCourse.id, formData.vatNumber);
          if (companyCount >= 2) {
            setSubmitError('Attenzione: La tua azienda ha già raggiunto il limite massimo di 2 partecipanti iscritti a questo corso.');
            return;
          }

          const newRegData = {
            course_id: selectedCourse.id,
            full_name: formData.fullName,
            company: formData.company,
            vat_number: formData.vatNumber,
            email: formData.email,
            phone: formData.phone,
            city: formData.city,
            course_title: selectedCourse.title,
            brand_name: selectedCourse.brandName,
            date: selectedCourse.date,
            timestamp: new Date().toLocaleString()
          };

          let insertedId = Date.now();
          if (supabaseClient) {
            const { data, error } = await supabaseClient.from('registrations').insert([newRegData]).select();
            if (error) {
              setSubmitError("Errore di connessione al database cloud: " + error.message);
              return;
            }
            if (data && data[0]) {
              insertedId = data[0].id;
            }
          }

          if (window.emailjs) {
            try {
              await emailjs.send("service_miwig8q", "template_vtbeauc", {
                to_name: formData.fullName,
                to_email: formData.email,
                course_title: selectedCourse.title,
                course_date: selectedCourse.date,
                company_name: companyName,
                message: `Grazie per esserti iscritto al corso:\n\nCorso: ${selectedCourse.title}\nData: ${selectedCourse.date}\nLivello: ${selectedCourse.level || 'Base'}\nRelatore: ${selectedCourse.speaker || 'Ermanno Zanardi'}\n\nTi aspettiamo!`
              });

              if (adminEmail) {
                await emailjs.send("service_miwig8q", "template_vtbeauc", {
                  to_name: "Amministratore",
                  to_email: adminEmail,
                  course_title: selectedCourse.title,
                  course_date: selectedCourse.date,
                  company_name: companyName,
                  message: `Nuova iscrizione ricevuta!\n\nPartecipante: ${formData.fullName}\nAzienda: ${formData.company} \n(P.IVA: ${formData.vatNumber})\nEmail: ${formData.email}\nTelefono: ${formData.phone}`
                });
              }
            } catch (err) {
              console.error("Errore durante l'invio dell'email:", err);
            }
          }

          const localReg = {
            id: insertedId,
            courseId: selectedCourse.id,
            ...formData,
            courseTitle: selectedCourse.title,
            brandName: selectedCourse.brandName,
            date: selectedCourse.date,
            timestamp: newRegData.timestamp
          };

          setRegistrations([localReg, ...registrations]);
          setSubmitted(true);
        };

        const handleDeleteRegistration = async (regId) => {
          if (confirm('Vuoi davvero eliminare questa iscrizione?')) {
            if (supabaseClient) {
              const { error } = await supabaseClient.from('registrations').delete().eq('id', regId);
              if (error) {
                alert("Errore durante l'eliminazione dell'iscrizione: " + error.message);
                return;
              }
            }
            setRegistrations(registrations.filter(r => r.id !== regId));
          }
        };

        const handleStartEditRegistration = (reg) => {
          setEditingRegistrationId(reg.id);
          setEditRegData({
            fullName: reg.fullName || '',
            company: reg.company || '',
            vatNumber: reg.vatNumber || '',
            email: reg.email || '',
            phone: reg.phone || '',
            city: reg.city || ''
          });
        };

        const handleSaveRegistrationEdit = async (regId) => {
          const updatePayload = {
            full_name: editRegData.fullName,
            company: editRegData.company,
            vat_number: editRegData.vatNumber,
            email: editRegData.email,
            phone: editRegData.phone,
            city: editRegData.city
          };

          if (supabaseClient) {
            const { error } = await supabaseClient.from('registrations').update(updatePayload).eq('id', regId);
            if (error) {
              alert("Errore durante l'aggiornamento dell'iscrizione: " + error.message);
              return;
            }
          }

          setRegistrations(registrations.map(r => r.id === regId ? {
            ...r,
            fullName: editRegData.fullName,
            company: editRegData.company,
            vatNumber: editRegData.vatNumber,
            email: editRegData.email,
            phone: editRegData.phone,
            city: editRegData.city
          } : r));

          setEditingRegistrationId(null);
          alert('Iscrizione aggiornata con successo!');
        };

        const handleAdminLogin = (e) => {
          e.preventDefault();
          if (adminPin === 'admin123') {
            setAdminError(false);
            setView('admin-dashboard');
            setAdminPin('');
          } else {
            setAdminError(true);
          }
        };

        const handleSaveSettings = async (e) => {
          e.preventDefault();
          setCompanyName(tempCompanyName);
          setCompanyLogo(tempCompanyLogo);
          setHeaderTitle(tempHeaderTitle);
          setCopyrightText(tempCopyrightText);
          setAdminEmail(tempAdminEmail);

          await saveSettingToSupabase('company_name', tempCompanyName);
          await saveSettingToSupabase('company_logo', tempCompanyLogo);
          await saveSettingToSupabase('header_title', tempHeaderTitle);
          await saveSettingToSupabase('copyright_text', tempCopyrightText);
          await saveSettingToSupabase('admin_email', tempAdminEmail);

          setSettingsSavedMsg(true);
          setTimeout(() => setSettingsSavedMsg(false), 3000);
        };

        const handleAddBrandSubmit = async (e) => {
          e.preventDefault();
          if (!newBrandData.name.trim()) return;
          const id = newBrandData.name.toLowerCase().replace(/[^a-z0-9]/g, '_');
          if (brands.some(b => b.id === id)) {
            alert('Questo marchio esiste già.');
            return;
          }
          const updatedBrands = [...brands, { 
            id, 
            name: newBrandData.name.toUpperCase(), 
            logoUrl: newBrandData.logoUrl, 
            color: newBrandData.color,
            posterBgUrl: newBrandData.posterBgUrl || '',
            certificateBgUrl: newBrandData.certificateBgUrl || ''
          }];
          setBrands(updatedBrands);
          await saveSettingToSupabase('brands_list', JSON.stringify(updatedBrands));
          setNewBrandData({ name: '', logoUrl: '', color: '#1b365d', posterBgUrl: '', certificateBgUrl: '' });
          alert('Marchio aggiunto e salvato su Supabase!');
        };

        const handleDeleteBrand = async (brandId) => {
          if (confirm('Vuoi davvero rimuovere questo marchio?')) {
            const updatedBrands = brands.filter(b => b.id !== brandId);
            setBrands(updatedBrands);
            await saveSettingToSupabase('brands_list', JSON.stringify(updatedBrands));
          }
        };

        const handleBrandUpdate = async (brandId, field, value) => {
          const updatedBrands = brands.map(b => b.id === brandId ? { ...b, [field]: value } : b);
          setBrands(updatedBrands);
          await saveSettingToSupabase('brands_list', JSON.stringify(updatedBrands));
        };

        const handleNewCourseChange = (e) => {
          const { name, value, type, checked } = e.target;
          if (name === 'brand') {
            const foundBrand = brands.find(b => b.id === value);
            setNewCourseData({ ...newCourseData, brand: value, brandName: foundBrand ? foundBrand.name : value.toUpperCase() });
          } else if (name === 'modality' && value === 'Google Meet') {
            setNewCourseData({ ...newCourseData, modality: value, location: 'Google Meet (Link online)' });
          } else {
            setNewCourseData({ ...newCourseData, [name]: type === 'checkbox' ? checked : value });
          }
        };

        const formatTextCommand = (command, value = null) => {
          if (command === 'insertUnorderedList') {
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            const range = selection.getRangeAt(0);
            
            let parent = range.commonAncestorContainer;
            while (parent && parent !== editorRef.current) {
              if (parent.nodeName === 'UL' || parent.nodeName === 'OL') {
                document.execCommand('insertUnorderedList', false, null);
                if (editorRef.current) {
                  setNewCourseData({ ...newCourseData, description: editorRef.current.innerHTML });
                }
                return;
              }
              parent = parent.parentNode;
            }

            const ul = document.createElement('ul');
            ul.style.listStyleType = 'disc';
            ul.style.paddingLeft = '20px';
            
            if (range.collapsed) {
              const li = document.createElement('li');
              li.innerHTML = '<br>';
              ul.appendChild(li);
              range.insertNode(ul);
              range.setStart(li, 0);
              range.collapse(true);
              selection.removeAllRanges();
              selection.addRange(range);
            } else {
              document.execCommand('insertUnorderedList', false, null);
            }
          } else {
            document.execCommand(command, false, value);
          }

          if (editorRef.current) {
            setNewCourseData({ ...newCourseData, description: editorRef.current.innerHTML });
          }
        };

        const handleEditorInput = () => {
          if (editorRef.current) {
            setNewCourseData({ ...newCourseData, description: editorRef.current.innerHTML });
          }
        };

        const handleAddCourseSubmit = async (e) => {
          e.preventDefault();

          const coursePayload = {
            brand: newCourseData.brand,
            brand_name: newCourseData.brandName,
            title: newCourseData.title,
            code: newCourseData.code || '',
            date: newCourseData.date,
            time: newCourseData.time,
            modality: newCourseData.modality,
            location: newCourseData.location,
            max_participants: parseInt(newCourseData.maxParticipants) || 12,
            duration: newCourseData.duration,
            description: newCourseData.description,
            level: newCourseData.level || 'Base',
            price: newCourseData.price || 'Gratuito',
            speaker: newCourseData.speaker || 'Ermanno Zanardi',
            is_new: newCourseData.isNew,
            is_active: newCourseData.isActive
          };

          if (editingCourseId) {
            if (supabaseClient) {
              const { error } = await supabaseClient.from('courses').update(coursePayload).eq('id', editingCourseId);
              if (error) {
                alert("Errore durante l'aggiornamento su Supabase: " + error.message);
                return;
              }
            }

            setCourses(courses.map(c => c.id === editingCourseId ? { ...c, ...newCourseData, maxParticipants: parseInt(newCourseData.maxParticipants) || 12 } : c));
            alert('Corso modificato con successo!');
            setEditingCourseId(null);
          } else {
            let newId = Date.now();
            if (supabaseClient) {
              const { data, error } = await supabaseClient.from('courses').insert([coursePayload]).select();
              if (error) {
                alert("Errore durante il salvataggio su Supabase: " + error.message);
                return;
              }
              if (data && data[0]) {
                newId = data[0].id;
              }
            }

            const createdCourse = {
              id: newId,
              ...newCourseData,
              maxParticipants: parseInt(newCourseData.maxParticipants) || 12
            };
            setCourses([...courses, createdCourse]);
            alert('Nuovo corso aggiunto con successo sul database!');
          }

          setNewCourseData({
            brand: brands[0]?.id || 'tecnoalarm',
            brandName: brands[0]?.name || 'TECNOALARM',
            title: '',
            code: '',
            date: '',
            time: '09:00 – 13:00',
            modality: 'In presenza',
            location: '',
            maxParticipants: 12,
            duration: '4 Ore',
            description: '',
            level: 'Base',
            price: 'Gratuito',
            speaker: 'Ermanno Zanardi',
            isNew: true,
            isActive: true
          });
          if (editorRef.current) editorRef.current.innerHTML = '';
          setAdminTab('registrations');
        };

        const handleEditCourseClick = (course) => {
          setEditingCourseId(course.id);
          setNewCourseData({
            brand: course.brand,
            brandName: course.brandName,
            title: course.title,
            code: course.code || '',
            date: course.date,
            time: course.time,
            modality: course.modality,
            location: course.location,
            maxParticipants: course.maxParticipants,
            duration: course.duration,
            description: course.description,
            level: course.level || 'Base',
            price: course.price || 'Gratuito',
            speaker: course.speaker || 'Ermanno Zanardi',
            isNew: course.isNew || false,
            isActive: course.isActive !== false
          });
          if (editorRef.current) {
            editorRef.current.innerHTML = course.description || '';
          }
          setAdminTab('add-course');
        };

        const handleToggleCourseActive = async (course) => {
          const newStatus = !course.isActive;
          if (supabaseClient) {
            const { error } = await supabaseClient.from('courses').update({ is_active: newStatus }).eq('id', course.id);
            if (error) {
              alert("Errore durante l'aggiornamento dello stato: " + error.message);
              return;
            }
          }
          setCourses(courses.map(c => c.id === course.id ? { ...c, isActive: newStatus } : c));
        };

        const handleDeleteCourse = async (id) => {
          if (confirm('Vuoi davvero eliminare questo corso?')) {
            if (supabaseClient) {
              const { error } = await supabaseClient.from('courses').delete().eq('id', id);
              if (error) {
                alert("Errore durante l'eliminazione: " + error.message);
                return;
              }
            }
            setCourses(courses.filter(c => c.id !== id));
            if (editingCourseId === id) setEditingCourseId(null);
            alert('Corso eliminato con successo.');
          }
        };

        const handleDownloadLocandina = (course) => {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF();

          const brandObj = brands.find(b => b.id === course.brand || b.name === course.brandName);
          const brandColorHex = brandObj?.color || '#1b365d';
          const brandPosterBg = brandObj?.posterBgUrl || '';

          const hexToRgb = (hex) => {
            let c = hex.replace('#','');
            if(c.length === 3) c = c.split('').map(x => x + x).join('');
            const num = parseInt(c, 16);
            return [num >> 16, (num >> 8) & 255, num & 255];
          };
          const [r, g, b] = hexToRgb(brandColorHex);

          const generatePdfContent = (bgImgData, logoImgData) => {
            if (bgImgData) {
              try {
                doc.addImage(bgImgData, 'JPEG', 0, 0, 210, 297);
              } catch (e) {
                console.error("Errore nell'inserimento dello sfondo personalizzato del brand:", e);
              }
            } else {
              doc.setFillColor(r, g, b);
              doc.rect(0, 0, 210, 45, 'F');
            }

                            <input type="url" value={newBrandData.posterBgUrl} onChange={(e) => setNewBrandData({ ...newBrandData, posterBgUrl: e.target.value })} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl bg-white font-mono" placeholder="https://tuosito.it/sfondo-locandina.jpg" />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">URL Sfondo PDF Attestato (A4 Orizzontale)</label>
                            <input type="url" value={newBrandData.certificateBgUrl} onChange={(e) => setNewBrandData({ ...newBrandData, certificateBgUrl: e.target.value })} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl bg-white font-mono" placeholder="https://tuosito.it/sfondo-attestato.jpg" />
                          </div>
                        </div>
                        <button type="submit" className="bg-[#1b365d] hover:bg-[#162d4f] text-white font-bold py-2.5 px-4 rounded-xl text-xs transition-colors">+ Aggiungi Marchio</button>
                      </form>

                      <h4 className="text-sm font-bold text-slate-900 mb-3">Marchi Attivi e Sfondi PDF</h4>
                      <div className="space-y-4">
                        {brands.map(b => (
                          <div key={b.id} className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                              <div className="flex items-center gap-3">
                                <input type="color" value={b.color || '#8b1e1e'} onChange={(e) => handleBrandUpdate(b.id, 'color', e.target.value)} className="h-9 w-9 p-0.5 border border-slate-300 rounded-lg cursor-pointer" title="Cambia colore" />
                                <div>
                                  <span className="font-bold uppercase text-sm" style={{ color: b.color || '#8b1e1e' }}>{b.name}</span>
                                  <span className="text-xs text-slate-400 block font-mono">Colore: {b.color || '#8b1e1e'}</span>
                                </div>
                              </div>
                              <div className="flex items-center gap-2 w-full sm:w-auto">
                                <button onClick={() => handleDeleteBrand(b.id)} className="text-red-600 hover:text-red-800 font-bold px-3.5 py-2 bg-white border border-red-200 rounded-xl text-xs">Elimina Marchio</button>
                              </div>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2 border-t border-slate-200">
                              <div>
                                <label className="block text-[11px] font-semibold text-slate-600 mb-1">URL Logo Marchio</label>
                                <input type="url" defaultValue={b.logoUrl || ''} onBlur={(e) => handleBrandUpdate(b.id, 'logoUrl', e.target.value)} placeholder="https://..." className="text-xs px-3 py-2 border border-slate-300 rounded-xl w-full bg-white" />
                              </div>
                              <div>
                                <label className="block text-[11px] font-semibold text-slate-600 mb-1">URL Sfondo Locandina (A4 Vert.)</label>
                                <input type="url" defaultValue={b.posterBgUrl || ''} onBlur={(e) => handleBrandUpdate(b.id, 'posterBgUrl', e.target.value)} placeholder="https://.../locandina.jpg" className="text-xs px-3 py-2 border border-slate-300 rounded-xl w-full bg-white font-mono" />
                              </div>
                              <div>
                                <label className="block text-[11px] font-semibold text-slate-600 mb-1">URL Sfondo Attestato (A4 Oriz.)</label>
                                <input type="url" defaultValue={b.certificateBgUrl || ''} onBlur={(e) => handleBrandUpdate(b.id, 'certificateBgUrl', e.target.value)} placeholder="https://.../attestato.jpg" className="text-xs px-3 py-2 border border-slate-300 rounded-xl w-full bg-white font-mono" />
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {adminTab === 'settings' && (
                    <div className="max-w-xl mx-auto bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
                      <h3 className="text-lg font-bold text-slate-900 mb-1">Configurazione Email Amministratore</h3>
                      <p className="text-xs text-slate-500 mb-6">Indirizzo email di {companyName} che riceverà le notifiche di iscrizione.</p>
                      {settingsSavedMsg && (
                        <div className="mb-4 bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs p-3 rounded-xl font-semibold">✓ Impostazioni salvate sul database!</div>
                      )}
                      <form onSubmit={handleSaveSettings} className="space-y-4">
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Email Riferimento Admin *</label>
                          <input type="email" required value={tempAdminEmail} onChange={(e) => setTempAdminEmail(e.target.value)} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="es. ermanno.zanardi69@gmail.com" />
                        </div>
                        <div className="pt-2">
                          <button type="submit" className="w-full bg-[#1b365d] hover:bg-[#162d4f] text-white font-bold py-3 px-4 rounded-xl text-sm transition-colors shadow-md">Salva Impostazioni sul Cloud</button>
                        </div>
                      </form>
                    </div>
                  )}

                  {adminTab === 'branding' && (
                    <div className="max-w-xl mx-auto bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
                      <h3 className="text-lg font-bold text-slate-900 mb-1">Personalizzazione Azienda e Logo</h3>
                      <p className="text-xs text-slate-500 mb-6">Modifica nome azienda, logo, titolo calendario e copyright.</p>
                      {settingsSavedMsg && (
                        <div className="mb-4 bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs p-3 rounded-xl font-semibold">✓ Personalizzazioni salvate sul database!</div>
                      )}
                      <form onSubmit={handleSaveSettings} className="space-y-4">
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Nome Azienda Erogatrice *</label>
                          <input type="text" required value={tempCompanyName} onChange={(e) => setTempCompanyName(e.target.value)} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Es. Azienda di prova" />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">URL Logo Aziendale (Header e PDF)</label>
                          <input type="url" value={tempCompanyLogo} onChange={(e) => setTempCompanyLogo(e.target.value)} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="https://..." />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Titolo Principale Calendario (Banner) *</label>
                          <input type="text" required value={tempHeaderTitle} onChange={(e) => setTempHeaderTitle(e.target.value)} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Es. CALENDARIO CORSI 2026" />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Testo Copyright Footer *</label>
                          <input type="text" required value={tempCopyrightText} onChange={(e) => setTempCopyrightText(e.target.value)} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Es. © 2026 Nome Azienda..." />
                        </div>
                        <div className="pt-2">
                          <button type="submit" className="w-full bg-[#1b365d] hover:bg-[#162d4f] text-white font-bold py-3 px-4 rounded-xl text-sm transition-colors shadow-md">Salva Personalizzazioni sul Cloud</button>
                        </div>
                      </form>
                    </div>
                  )}

                  {adminTab === 'add-course' && (
                    <div className="max-w-2xl mx-auto bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
                      <div className="flex justify-between items-center mb-2">
                        <h3 className="text-lg font-bold text-slate-900">{editingCourseId ? '✏ Modifica Corso Esistente' : '➕ Crea Nuovo Corso'}</h3>
                        {editingCourseId && (
                          <button onClick={() => { setEditingCourseId(null); setNewCourseData({ brand: brands[0]?.id || 'tecnoalarm', brandName: brands[0]?.name || 'TECNOALARM', title: '', code: '', date: '', time: '09:00 – 13:00', modality: 'In presenza', location: '', maxParticipants: 12, duration: '4 Ore', description: '', level: 'Base', price: 'Gratuito', speaker: 'Ermanno Zanardi', isNew: true, isActive: true }); if(editorRef.current) editorRef.current.innerHTML=''; }} className="text-xs text-blue-600 hover:underline font-semibold">Passa a Nuovo Corso</button>
                        )}
                      </div>
                      <p className="text-xs text-slate-500 mb-6">{companyName} • Gestione catalogo corsi su Supabase.</p>

                      <form onSubmit={handleAddCourseSubmit} className="space-y-4">
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Marchio di Riferimento *</label>
                            <select name="brand" value={newCourseData.brand} onChange={handleNewCourseChange} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d] bg-white">
                              {brands.map(b => (<option key={b.id} value={b.id}>{b.name}</option>))}
                            </select>
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Livello del Corso</label>
                            <select name="level" value={newCourseData.level} onChange={handleNewCourseChange} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d] bg-white">
                              <option value="Base">Base</option>
                              <option value="Intermedio">Intermedio</option>
                              <option value="Avanzato">Avanzato</option>
                              <option value="Professionale">Professionale</option>
                            </select>
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Relatore del Corso *</label>
                            <input type="text" name="speaker" required value={newCourseData.speaker} onChange={handleNewCourseChange} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Es. Ermanno Zanardi" />
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Titolo del Corso *</label>
                          <input type="text" name="title" required value={newCourseData.title} onChange={handleNewCourseChange} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Es. CORSO TECNICO AVANZATO" />
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Modalità *</label>
                            <select name="modality" value={newCourseData.modality} onChange={handleNewCourseChange} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d] bg-white">
                              <option value="In presenza">In presenza</option>
                              <option value="Google Meet">Google Meet</option>
                            </select>
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Max Partecipanti *</label>
                            <input type="number" name="maxParticipants" min="1" max="200" required value={newCourseData.maxParticipants} onChange={handleNewCourseChange} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Costo Corso *</label>
                            <input type="text" name="price" required value={newCourseData.price} onChange={handleNewCourseChange} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Es. Gratuito o € 150 + IVA" />
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Data *</label>
                            <input type="text" name="date" required value={newCourseData.date} onChange={handleNewCourseChange} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Es. giovedì 15 nov 2026" />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Orario *</label>
                            <input type="text" name="time" required value={newCourseData.time} onChange={handleNewCourseChange} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Es. 09:00 – 13:00" />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Durata *</label>
                            <input type="text" name="duration" required value={newCourseData.duration} onChange={handleNewCourseChange} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Es. 4 Ore" />
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Sede o Link Piattaforma *</label>
                            <input type="text" name="location" required value={newCourseData.location} onChange={handleNewCourseChange} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Es. Via Bergamo,20 - Mornico al Serio (BG)" />
                          </div>
                          <div className="flex flex-col justify-center pt-2 gap-2">
                            <label className="flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer">
                              <input type="checkbox" name="isNew" checked={newCourseData.isNew} onChange={handleNewCourseChange} className="rounded border-slate-300 h-4 w-4 text-[#1b365d]" /> Etichetta Novità sulla Card
                            </label>
                            <label className="flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer">
                              <input type="checkbox" name="isActive" checked={newCourseData.isActive} onChange={handleNewCourseChange} className="rounded border-slate-300 h-4 w-4 text-emerald-600" /> Corso Attivo e Visibile nel Front-End
                            </label>
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Descrizione Dettagliata (Formattabile) *</label>
                          <div className="border border-slate-300 rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-[#1b365d] bg-white">
                            <div className="bg-slate-100 border-b border-slate-300 px-3 py-2 flex items-center gap-1.5 flex-wrap">
                              <button type="button" onClick={() => formatTextCommand('bold')} className="px-2.5 py-1 bg-white hover:bg-slate-200 border border-slate-300 rounded font-bold text-xs text-slate-700 shadow-2xs" title="Grassetto">B</button>
                              <button type="button" onClick={() => formatTextCommand('italic')} className="px-2.5 py-1 bg-white hover:bg-slate-200 border border-slate-300 rounded italic text-xs text-slate-700 shadow-2xs" title="Corsivo">I</button>
                              <button type="button" onClick={() => formatTextCommand('underline')} className="px-2.5 py-1 bg-white hover:bg-slate-200 border border-slate-300 rounded underline text-xs text-slate-700 shadow-2xs" title="Sottolineato">U</button>
                              <span className="w-px h-4 bg-slate-300 mx-1"></span>
                              <button type="button" onClick={() => formatTextCommand('insertUnorderedList')} className="px-2.5 py-1 bg-white hover:bg-slate-200 border border-slate-300 rounded text-xs text-slate-700 shadow-2xs font-bold" title="Elenco puntato">• Elenco</button>
                              <button type="button" onClick={() => formatTextCommand('removeFormat')} className="px-2.5 py-1 bg-white hover:bg-slate-200 border border-slate-300 rounded text-xs text-slate-500 shadow-2xs" title="Pulisci formattazione">✕ Pulisci</button>
                            </div>
                            <div
                              ref={editorRef}
                              contentEditable={true}
                              onInput={handleEditorInput}
                              className="w-full px-3.5 py-2.5 text-sm min-h-[120px] max-h-[250px] overflow-y-auto focus:outline-none prose max-w-none text-slate-800"
                              placeholder="Inserisci la descrizione del corso..."
                            ></div>
                          </div>
                          <span className="text-[10px] text-slate-400 mt-1 block">Puoi evidenziare il testo in grassetto, corsivo o inserire elenchi puntati come in Word.</span>
                        </div>

                        <div className="pt-2 flex gap-3">
                          <button type="submit" className="flex-1 bg-[#1b365d] hover:bg-[#162d4f] text-white font-bold py-3 px-4 rounded-xl text-sm transition-colors shadow-md">{editingCourseId ? 'Salva Modifiche Corso' : 'Pubblica Corso nel Catalogo'}</button>
                          <button type="button" onClick={() => { setEditingCourseId(null); setAdminTab('registrations'); }} className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-4 rounded-xl text-sm transition-colors">Annulla</button>
                        </div>
                      </form>

                      <div className="mt-8 border-t border-slate-200 pt-6">
                        <h4 className="text-sm font-bold text-slate-900 mb-3">Corsi in Catalogo (Attiva / Disattiva Rapida)</h4>
                        <div className="space-y-2 max-h-60 overflow-y-auto">
                          {courses.map(c => {
                            const bObj = brands.find(b => b.id === c.id || b.name === c.brandName);
                            const isActive = c.isActive !== false;
                            return (
                              <div key={c.id} className="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs gap-2">
                                <div className="truncate pr-2">
                                  <span className="font-bold uppercase" style={{color: bObj?.color || '#8b1e1e'}}>{bObj?.name || c.brandName}:</span> <span className="font-semibold text-slate-900">{c.title}</span> <span className="text-slate-500 font-normal">({c.level || 'Base'})</span>
                                </div>
                                <div className="flex items-center gap-2 flex-shrink-0">
                                  <button
                                    onClick={() => handleToggleCourseActive(c)}
                                    className={`px-3 py-1 rounded-lg font-bold text-xs transition-colors shadow-sm ${isActive ? 'bg-emerald-600 text-white hover:bg-emerald-700' : 'bg-slate-300 text-slate-700 hover:bg-slate-400'}`}
                                  >
                                    {isActive ? '✓ Attivo' : '✕ Disattivo'}
                                  </button>
                                  <button onClick={() => handleEditCourseClick(c)} className="text-blue-600 hover:text-blue-800 font-bold px-2.5 py-1 bg-white border border-blue-200 rounded-lg text-xs">Modifica</button>
                                  <button onClick={() => handleDeleteCourse(c.id)} className="text-red-600 hover:text-red-800 font-bold px-2.5 py-1 bg-white border border-red-200 rounded-lg text-xs">Elimina</button>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </main>

            <footer className="bg-[#1b365d] text-white border-t border-blue-900/50 py-6 text-center text-xs text-slate-300 mt-12">
              <p>{copyrightText}</p>
            </footer>
          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById('root'));
    </script>
  </body>
</html>
