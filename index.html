<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portale Formazione</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        // Configurazione Iniziale / Valori di default
        const DEFAULT_SUPABASE_URL = "https://iltuoprestatoredidatabase.supabase.co";
        const DEFAULT_SUPABASE_KEY = "tua-chiave-anon-pubblica";
        
        // Brand predefiniti con colori e sfondi personalizzati per i PDF
        const DEFAULT_BRANDS = [
            { id: 'tecnoalarm', name: 'Tecnoalarm', color: '#dc2626', bgFlyer: '', bgCert: '' },
            { id: 'tecnofire', name: 'Tecnofire', color: '#ea580c', bgFlyer: '', bgCert: '' },
            { id: 'nice', name: 'Nice', color: '#0284c7', bgFlyer: '', bgCert: '' },
            { id: 'dahua', name: 'Dahua', color: '#005f73', bgFlyer: '', bgCert: '' },
            { id: 'altro', name: 'Altro / Generico', color: '#4b5563', bgFlyer: '', bgCert: '' }
        ];

        function App() {
            // Stati dell'applicazione
            const [supabaseUrl, setSupabaseUrl] = useState(() => localStorage.getItem('sb_url') || DEFAULT_SUPABASE_URL);
            const [supabaseKey, setSupabaseKey] = useState(() => localStorage.getItem('sb_key') || DEFAULT_SUPABASE_KEY);
            const [supabaseClient, setSupabaseClient] = useState(null);

            const [courses, setCourses] = useState([]);
            const [registrations, setRegistrations] = useState([]);
            const [brands, setBrands] = useState(DEFAULT_BRANDS);
            const [settings, setSettings] = useState({
                adminEmail: 'formazione@azienda.it',
                companyName: 'La Mia Azienda Formazione',
                logoUrl: '',
                calendarTitle: 'Calendario Corsi di Formazione',
                footerText: 'Tutti i diritti riservati - Formazione Professionale'
            });

            const [loading, setLoading] = useState(false);
            const [activeTab, setActiveTab] = useState('catalog'); // catalog, admin, my-registrations
            const [selectedBrandFilter, setSelectedBrandFilter] = useState('ALL');
            
            // Stato Modale Iscrizione
            const [selectedCourse, setSelectedCourse] = useState(null);
            const [regForm, setRegForm] = useState({
                name: '', surname: '', email: '', phone: '', company: '', vat: '', role: ''
            });
            const [regSuccess, setRegSuccess] = useState(false);
            const [regError, setRegError] = useState('');

            // Stato Admin Login
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
            const [adminPin, setAdminPin] = useState('');
            const [adminSubTab, setAdminSubTab] = useState('registrations'); // registrations, courses, brands, settings

            // Stato Modifica / Creazione Corso da parte dell'Admin
            const [editingCourse, setEditingCourse] = useState(null);
            const [courseForm, setCourseForm] = useState({
                title: '', brand: 'tecnoalarm', date: '', time: '09:00 - 13:00', 
                location: 'In presenza', max_seats: 20, description: '', speaker: '', active: true
            });

            // Inizializzazione Client Supabase
            useEffect(() => {
                try {
                    if (supabaseUrl && supabaseKey && supabaseUrl !== DEFAULT_SUPABASE_URL) {
                        const client = window.supabase.createClient(supabaseUrl, supabaseKey);
                        setSupabaseClient(client);
                    }
                } catch (e) {
                    console.error("Errore connessione Supabase:", e);
                }
            }, [supabaseUrl, supabaseKey]);

            // Caricamento Dati
            useEffect(() => {
                if (supabaseClient) {
                    fetchData();
                } else {
                    // Dati di fallback/demo se Supabase non è configurato
                    setCourses([
                        { id: 1, title: 'Corso Base Sistemi Antintrusione', brand: 'tecnoalarm', date: '2026-05-10', time: '09:00 - 17:00', location: 'In presenza - Sede Centrale', max_seats: 15, description: 'Introduzione ai sistemi avanzati di sicurezza.', speaker: 'Mario Rossi', active: true },
                        { id: 2, title: 'Programmazione Avanzata Videosorveglianza', brand: 'dahua', date: '2026-05-15', time: '14:00 - 18:00', location: 'Google Meet', max_seats: 30, description: 'Analisi video e configurazioni IP.', speaker: 'Luca Bianchi', active: true }
                    ]);
                }
            }, [supabaseClient]);

            const fetchData = async () => {
                setLoading(true);
                try {
                    const { data: coursesData } = await supabaseClient.from('courses').select('*');
                    if (coursesData) setCourses(coursesData);

                    const { data: regData } = await supabaseClient.from('registrations').select('*');
                    if (regData) setRegistrations(regData);

                    const { data: brandsData } = await supabaseClient.from('brands').select('*');
                    if (brandsData && brandsData.length > 0) setBrands(brandsData);

                    const { data: settingsData } = await supabaseClient.from('settings').select('*').single();
                    if (settingsData) setSettings(settingsData);
                } catch (err) {
                    console.error("Errore recupero dati da Supabase:", err);
                } finally {
                    setLoading(false);
                }
            };

            // Gestione Iscrizione Corso
            const handleRegisterSubmit = async (e) => {
                e.preventDefault();
                setRegError('');

                // Controllo limite 2 iscritti per Partita IVA sullo stesso corso
                const existingForCompany = registrations.filter(
                    r => r.course_id === selectedCourse.id && r.vat.trim().toLowerCase() === regForm.vat.trim().toLowerCase()
                );

                if (existingForCompany.length >= 2) {
                    setRegError('È stato raggiunto il limite massimo di 2 iscrizioni per la stessa azienda (Partita IVA) per questo corso.');
                    return;
                }

                // Controllo posti disponibili
                const courseRegs = registrations.filter(r => r.course_id === selectedCourse.id);
                if (courseRegs.length >= selectedCourse.max_seats) {
                    setRegError('Ci dispiace, il corso è al completo.');
                    return;
                }

                const newReg = {
                    course_id: selectedCourse.id,
                    ...regForm,
                    created_at: new Date().toISOString()
                };

                if (supabaseClient) {
                    const { error } = await supabaseClient.from('registrations').insert([newReg]);
                    if (error) {
                        setRegError('Errore durante la registrazione: ' + error.message);
                        return;
                    }
                    fetchData();
                } else {
                    setRegistrations([...registrations, { id: Date.now(), ...newReg }]);
                }

                setRegSuccess(true);
                // Invio Email di Conferma tramite EmailJS (se configurato)
                try {
                    emailjs.send("service_default", "template_default", {
                        to_email: regForm.email,
                        to_name: `${regForm.name} ${regForm.surname}`,
                        course_title: selectedCourse.title,
                        course_date: selectedCourse.date,
                        course_time: selectedCourse.time,
                        course_location: selectedCourse.location,
                        speaker: selectedCourse.speaker || 'Non specificato'
                    }, "public_key_default");
                } catch (err) {
                    console.log("EmailJS non configurato o errore invio:", err);
                }
            };

            // Generazione Locandina PDF con jsPDF
            const generateFlyerPdf = (course) => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const brandObj = brands.find(b => b.id === course.brand) || { name: course.brand, color: '#0ea5e9' };

                // Intestazione / Box Colore Brand
                doc.setFillColor(14, 165, 233);
                doc.rect(0, 0, 210, 40, 'F');

                doc.setTextColor(255, 255, 255);
                doc.setFontSize(22);
                doc.text("SCHEDA CORSO DI FORMAZIONE", 105, 25, { align: 'center' });

                // Contenuto
                doc.setTextColor(30, 41, 59);
                doc.setFontSize(26);
                doc.text(course.title, 20, 60, { maxWidth: 170 });

                doc.setFontSize(14);
                doc.setTextColor(100, 116, 139);
                doc.text(`Brand / Marchio: ${brandObj.name.toUpperCase()}`, 20, 75);

                doc.setDrawColor(203, 213, 225);
                doc.line(20, 85, 190, 85);

                doc.setFontSize(12);
                doc.setTextColor(51, 65, 85);
                let startY = 100;
                doc.text(`Data: ${course.date}`, 20, startY);
                doc.text(`Orario: ${course.time}`, 20, startY + 10);
                doc.text(`Modalità / Luogo: ${course.location}`, 20, startY + 20);
                doc.text(`Relatore: ${course.speaker || 'N.D.'}`, 20, startY + 30);
                doc.text(`Posti Disponibili: ${course.max_seats}`, 20, startY + 40);

                doc.setFontSize(14);
                doc.text("Descrizione del Corso:", 20, startY + 60);
                doc.setFontSize(11);
                doc.setTextColor(100, 116, 139);
                doc.text(course.description || 'Nessuna descrizione aggiuntiva.', 20, startY + 70, { maxWidth: 170 });

                // Footer
                doc.setFontSize(10);
                doc.setTextColor(150, 150, 150);
                doc.text(settings.companyName, 105, 285, { align: 'center' });

                doc.save(`Locandina_${course.title.replace(/[^a-zA-Z0-9]/g, '_')}.pdf`);
            };

            // Generazione Attestato PDF con jsPDF
            const generateCertificatePdf = (reg, course) => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'landscape' });

                // Cornice Decorativa
                doc.setLineWidth(1.5);
                doc.setDrawColor(14, 165, 233);
                doc.rect(10, 10, 277, 190);

                doc.setLineWidth(0.5);
                doc.rect(14, 14, 269, 182);

                // Intestazione Attestato
                doc.setFont("helvetica", "bold");
                doc.setFontSize(28);
                doc.setTextColor(15, 23, 42);
                doc.text("ATTESTATO DI PARTECIPAZIONE", 140, 40, { align: 'center' });

                doc.setFont("helvetica", "normal");
                doc.setFontSize(14);
                doc.setTextColor(100, 116, 139);
                doc.text("Si attesta che", 140, 55, { align: 'center' });

                // Nome Partecipante
                doc.setFont("helvetica", "bold");
                doc.setFontSize(24);
                doc.setTextColor(2, 132, 199);
                doc.text(`${reg.name} ${reg.surname}`, 140, 75, { align: 'center' });

                if (reg.company) {
                    doc.setFont("helvetica", "normal");
                    doc.setFontSize(12);
                    doc.setTextColor(71, 85, 105);
                    doc.text(`Azienda: ${reg.company} (P.IVA: ${reg.vat})`, 140, 85, { align: 'center' });
                }

                // Dettagli Corso e Relatore
                doc.setFont("helvetica", "normal");
                doc.setFontSize(14);
                doc.setTextColor(51, 65, 85);
                doc.text("ha partecipato con successo al corso di formazione professionale:", 140, 105, { align: 'center' });

                doc.setFont("helvetica", "bold");
                doc.setFontSize(18);
                doc.setTextColor(15, 23, 42);
                doc.text(course.title, 140, 120, { align: 'center' });

                doc.setFont("helvetica", "normal");
                doc.setFontSize(12);
                doc.setTextColor(71, 85, 105);
                doc.text(`Tenutosi in data ${course.date} | Relatore: ${course.speaker || 'N.D.'}`, 140, 132, { align: 'center' });

                // Firma / Footer
                doc.line(180, 165, 250, 165);
                doc.setFontSize(10);
                doc.text("Il Docente / Responsabile Formazione", 215, 172, { align: 'center' });

                doc.text(settings.companyName, 40, 172, { align: 'left' });

                doc.save(`Attestato_${reg.surname}_${course.title.replace(/[^a-zA-Z0-9]/g, '_')}.pdf`);
            };

            // Salvataggio Corso (Admin)
            const handleSaveCourse = async (e) => {
                e.preventDefault();
                if (supabaseClient) {
                    if (editingCourse) {
                        await supabaseClient.from('courses').update(courseForm).eq('id', editingCourse.id);
                    } else {
                        await supabaseClient.from('courses').insert([courseForm]);
                    }
                    fetchData();
                } else {
                    if (editingCourse) {
                        setCourses(courses.map(c => c.id === editingCourse.id ? { ...c, ...courseForm } : c));
                    } else {
                        setCourses([...courses, { id: Date.now(), ...courseForm }]);
                    }
                }
                setEditingCourse(null);
                setCourseForm({
                    title: '', brand: 'tecnoalarm', date: '', time: '09:00 - 13:00', 
                    location: 'In presenza', max_seats: 20, description: '', speaker: '', active: true
                });
            };

            const handleDeleteCourse = async (id) => {
                if (confirm("Sei sicuro di voler eliminare questo corso?")) {
                    if (supabaseClient) {
                        await supabaseClient.from('courses').delete().eq('id', id);
                        fetchData();
                    } else {
                        setCourses(courses.filter(c => c.id !== id));
                    }
                }
            };

            const handleDeleteRegistration = async (id) => {
                if (confirm("Vuoi rimuovere questa iscrizione?")) {
                    if (supabaseClient) {
                        await supabaseClient.from('registrations').delete().eq('id', id);
                        fetchData();
                    } else {
                        setRegistrations(registrations.filter(r => r.id !== id));
                    }
                }
            };

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    <div>
                        {/* Header Principale */}
                        <header className="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-40">
                            <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                                <div className="flex items-center gap-3">
                                    {settings.logoUrl ? (
                                        <img src={settings.logoUrl} alt="Logo" className="h-10 object-contain" />
                                    ) : (
                                        <div className="bg-brand-600 text-white p-2.5 rounded-lg font-bold text-xl">
                                            <i className="fa-solid fa-graduation-cap"></i>
                                        </div>
                                    )}
                                    <div>
                                        <h1 className="text-xl font-bold text-gray-900">{settings.calendarTitle}</h1>
                                        <p className="text-xs text-gray-500">{settings.companyName}</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button 
                                        onClick={() => setActiveTab('catalog')}
                                        className={`px-4 py-2 rounded-lg text-sm font-medium transition ${activeTab === 'catalog' ? 'bg-brand-600 text-white shadow' : 'text-gray-600 hover:bg-gray-100'}`}
                                    >
                                        <i className="fa-solid fa-book-open mr-2"></i> Catalogo Corsi
                                    </button>
                                    <button 
                                        onClick={() => setActiveTab('admin')}
                                        className={`px-4 py-2 rounded-lg text-sm font-medium transition ${activeTab === 'admin' ? 'bg-brand-600 text-white shadow' : 'text-gray-600 hover:bg-gray-100'}`}
                                    >
                                        <i className="fa-solid fa-lock mr-2"></i> Area Riservata Admin
                                    </button>
                                </div>
                            </div>
                        </header>

                        {/* Corpo Principale */}
                        <main className="max-w-7xl mx-auto px-4 py-8">
                            {activeTab === 'catalog' && (
                                <div>
                                    {/* Filtri Brand */}
                                    <div className="flex flex-wrap items-center gap-2 mb-8 pb-4 border-b border-gray-200">
                                        <span className="text-sm font-semibold text-gray-700 mr-2"><i className="fa-solid fa-filter mr-1"></i> Filtra per Brand:</span>
                                        <button 
                                            onClick={() => setSelectedBrandFilter('ALL')}
                                            className={`px-3 py-1.5 rounded-full text-xs font-medium transition ${selectedBrandFilter === 'ALL' ? 'bg-gray-900 text-white' : 'bg-white text-gray-700 border border-gray-300 hover:bg-gray-50'}`}
                                        >
                                            Tutti i Brand
                                        </button>
                                        {brands.map(b => (
                                            <button 
                                                key={b.id}
                                                onClick={() => setSelectedBrandFilter(b.id)}
                                                className={`px-3 py-1.5 rounded-full text-xs font-medium transition ${selectedBrandFilter === b.id ? 'bg-brand-600 text-white' : 'bg-white text-gray-700 border border-gray-300 hover:bg-gray-50'}`}
                                            >
                                                {b.name}
                                            </button>
                                        ))}
                                    </div>

                                    {/* Griglia Corsi */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {courses
                                            .filter(c => c.active !== false && (selectedBrandFilter === 'ALL' || c.brand === selectedBrandFilter))
                                            .map(course => {
                                                const brandObj = brands.find(b => b.id === course.brand) || { name: course.brand, color: '#0ea5e9' };
                                                const courseRegs = registrations.filter(r => r.course_id === course.id);
                                                const isFull = courseRegs.length >= course.max_seats;

                                                return (
                                                    <div key={course.id} className="bg-white rounded-xl border border-gray-200 shadow-sm hover:shadow-md transition flex flex-col justify-between overflow-hidden">
                                                        <div className="p-6">
                                                            <div className="flex justify-between items-center mb-3">
                                                                <span className="text-xs px-2.5 py-1 rounded-full font-semibold uppercase tracking-wider" style={{ backgroundColor: `${brandObj.color}15`, color: brandObj.color }}>
                                                                    {brandObj.name}
                                                                </span>
                                                                <span className={`text-xs font-semibold px-2 py-0.5 rounded ${isFull ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>
                                                                    {isFull ? 'Completo' : `${course.max_seats - courseRegs.length} posti liberi`}
                                                                </span>
                                                            </div>

                                                            <h3 className="text-lg font-bold text-gray-900 mb-2">{course.title}</h3>
                                                            <p className="text-sm text-gray-600 line-clamp-3 mb-4">{course.description}</p>

                                                            <div className="space-y-2 text-sm text-gray-700 border-t border-gray-100 pt-4">
                                                                <div className="flex items-center gap-2">
                                                                    <i className="fa-regular fa-calendar text-gray-400 w-5"></i>
                                                                    <span>{course.date}</span>
                                                                </div>
                                                                <div className="flex items-center gap-2">
                                                                    <i className="fa-regular fa-clock text-gray-400 w-5"></i>
                                                                    <span>{course.time}</span>
                                                                </div>
                                                                <div className="flex items-center gap-2">
                                                                    <i className="fa-solid fa-location-dot text-gray-400 w-5"></i>
                                                                    <span className="truncate">{course.location}</span>
                                                                </div>
                                                                <div className="flex items-center gap-2">
                                                                    <i className="fa-solid fa-chalkboard-user text-gray-400 w-5"></i>
                                                                    <span className="font-medium text-gray-800">Relatore: {course.speaker || 'Non specificato'}</span>
                                                                </div>
                                                            </div>
                                                        </div>

                                                        <div className="bg-gray-50 px-6 py-3 border-t border-gray-100 flex items-center justify-between gap-2">
                                                            <button 
                                                                onClick={() => generateFlyerPdf(course)}
                                                                className="text-xs text-gray-600 hover:text-brand-600 font-medium py-2 px-3 rounded border border-gray-300 bg-white hover:bg-gray-50 transition"
                                                            >
                                                                <i className="fa-solid fa-file-arrow-down mr-1"></i> Locandina PDF
                                                            </button>

                                                            <button 
                                                                disabled={isFull}
                                                                onClick={() => {
                                                                    setSelectedCourse(course);
                                                                    setRegSuccess(false);
                                                                    setRegError('');
                                                                    setRegForm({ name: '', surname: '', email: '', phone: '', company: '', vat: '', role: '' });
                                                                }}
                                                                className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${isFull ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-brand-600 text-white hover:bg-brand-700 shadow-sm'}`}
                                                            >
                                                                Iscriviti Subito
                                                            </button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                    </div>
                                </div>
                            )}

                            {activeTab === 'admin' && (
                                <div>
                                    {!isAdminLoggedIn ? (
                                        <div className="max-w-md mx-auto bg-white p-8 rounded-xl border border-gray-200 shadow-sm mt-12">
                                            <div className="text-center mb-6">
                                                <div className="bg-brand-100 text-brand-600 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
                                                    <i className="fa-solid fa-lock"></i>
                                                </div>
                                                <h2 className="text-xl font-bold text-gray-900">Accesso Area Riservata</h2>
                                                <p className="text-xs text-gray-500">Inserisci il PIN amministratore (default: admin123)</p>
                                            </div>

                                            <form onSubmit={(e) => {
                                                e.preventDefault();
                                                if (adminPin === 'admin123' || adminPin === 'admin') {
                                                    setIsAdminLoggedIn(true);
                                                } else {
                                                    alert("PIN errato!");
                                                }
                                            }}>
                                                <input 
                                                    type="password" 
                                                    placeholder="Inserisci PIN"
                                                    value={adminPin}
                                                    onChange={(e) => setAdminPin(e.target.value)}
                                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg mb-4 focus:ring-2 focus:ring-brand-500 focus:outline-none"
                                                />
                                                <button type="submit" className="w-full bg-brand-600 text-white py-2 rounded-lg font-semibold hover:bg-brand-700 transition">
                                                    Accedi
                                                </button>
                                            </form>
                                        </div>
                                    ) : (
                                        <div>
                                            <div className="flex flex-wrap justify-between items-center mb-6 pb-4 border-b border-gray-200 gap-4">
                                                <div className="flex gap-2">
                                                    <button 
                                                        onClick={() => setAdminSubTab('registrations')}
                                                        className={`px-4 py-2 rounded-lg text-sm font-medium ${adminSubTab === 'registrations' ? 'bg-gray-900 text-white' : 'bg-white text-gray-700 border border-gray-300'}`}
                                                    >
                                                        <i className="fa-solid fa-users mr-2"></i> Iscrizioni ({registrations.length})
                                                    </button>
                                                    <button 
                                                        onClick={() => setAdminSubTab('courses')}
                                                        className={`px-4 py-2 rounded-lg text-sm font-medium ${adminSubTab === 'courses' ? 'bg-gray-900 text-white' : 'bg-white text-gray-700 border border-gray-300'}`}
                                                    >
                                                        <i className="fa-solid fa-list-check mr-2"></i> Gestione Corsi ({courses.length})
                                                    </button>
                                                </div>
                                                <button 
                                                    onClick={() => setIsAdminLoggedIn(false)}
                                                    className="text-red-600 text-sm font-medium hover:underline"
                                                >
                                                    <i className="fa-solid fa-right-from-bracket mr-1"></i> Esci dall'Admin
                                                </button>
                                            </div>

                                            {/* Sotto-tab Iscrizioni */}
                                            {adminSubTab === 'registrations' && (
                                                <div className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                                                    <div className="p-4 bg-gray-50 border-b border-gray-200 font-semibold text-sm text-gray-700">
                                                        Elenco Completo Partecipanti Registrati
                                                    </div>
                                                    <div className="overflow-x-auto">
                                                        <table className="w-full text-left border-collapse text-sm">
                                                            <thead>
                                                                <tr className="bg-gray-100 border-b border-gray-200 text-gray-600 text-xs uppercase">
                                                                    <th className="p-3">Data Iscr.</th>
                                                                    <th className="p-3">Partecipante</th>
                                                                    <th className="p-3">Contatti</th>
                                                                    <th className="p-3">Azienda (P.IVA)</th>
                                                                    <th className="p-3">Corso</th>
                                                                    <th className="p-3 text-center">Attestato</th>
                                                                    <th className="p-3 text-right">Azioni</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody className="divide-y divide-gray-200">
                                                                {registrations.map(reg => {
                                                                    const course = courses.find(c => c.id === reg.course_id) || { title: 'Corso Sconosciuto', speaker: '' };
                                                                    return (
                                                                        <tr key={reg.id} className="hover:bg-gray-50">
                                                                            <td className="p-3 text-xs text-gray-500">{new Date(reg.created_at || Date.now()).toLocaleDateString()}</td>
                                                                            <td className="p-3 font-medium text-gray-900">{reg.name} {reg.surname}</td>
                                                                            <td className="p-3 text-xs text-gray-600">{reg.email}<br/>{reg.phone}</td>
                                                                            <td className="p-3 text-xs text-gray-600">{reg.company}<br/><span className="text-gray-400">P.IVA: {reg.vat}</span></td>
                                                                            <td className="p-3 text-xs font-semibold text-brand-700">{course.title}</td>
                                                                            <td className="p-3 text-center">
                                                                                <button 
                                                                                    onClick={() => generateCertificatePdf(reg, course)}
                                                                                    className="bg-green-100 text-green-700 hover:bg-green-200 p-1.5 rounded text-xs font-medium"
                                                                                    title="Scarica Attestato PDF"
                                                                                >
                                                                                    <i className="fa-solid fa-award"></i> Attestato
                                                                                </button>
                                                                            </td>
                                                                            <td className="p-3 text-right">
                                                                                <button 
                                                                                    onClick={() => handleDeleteRegistration(reg.id)}
                                                                                    className="text-red-500 hover:text-red-700 p-1"
                                                                                    title="Elimina"
                                                                                >
                                                                                    <i className="fa-solid fa-trash"></i>
                                                                                </button>
                                                                            </td>
                                                                        </tr>
                                                                    );
                                                                })}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                            )}

                                            {/* Sotto-tab Corsi */}
                                            {adminSubTab === 'courses' && (
                                                <div>
                                                    <div className="flex justify-between items-center mb-4">
                                                        <h3 className="text-lg font-bold text-gray-800">Elenco Corsi</h3>
                                                        <button 
                                                            onClick={() => {
                                                                setEditingCourse(null);
                                                                setCourseForm({ title: '', brand: 'tecnoalarm', date: '', time: '09:00 - 13:00', location: 'In presenza', max_seats: 20, description: '', speaker: '', active: true });
                                                            }}
                                                            className="bg-brand-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-brand-700"
                                                        >
                                                            <i className="fa-solid fa-plus mr-1"></i> Nuovo Corso
                                                        </button>
                                                    </div>

                                                    {/* Form Modifica / Creazione Corso */}
                                                    <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm mb-6">
                                                        <h4 className="font-bold text-gray-900 mb-4">{editingCourse ? 'Modifica Corso' : 'Crea Nuovo Corso'}</h4>
                                                        <form onSubmit={handleSaveCourse} className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                            <div className="md:col-span-2">
                                                                <label className="block text-xs font-medium text-gray-700 mb-1">Titolo Corso</label>
                                                                <input 
                                                                    type="text" required 
                                                                    value={courseForm.title} 
                                                                    onChange={e => setCourseForm({...courseForm, title: e.target.value})}
                                                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"
                                                                />
                                                            </div>
                                                            <div>
                                                                <label className="block text-xs font-medium text-gray-700 mb-1">Brand / Marchio</label>
                                                                <select 
                                                                    value={courseForm.brand} 
                                                                    onChange={e => setCourseForm({...courseForm, brand: e.target.value})}
                                                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"
                                                                >
                                                                    {brands.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                                                                </select>
                                                            </div>
                                                            <div>
                                                                <label className="block text-xs font-medium text-gray-700 mb-1">Data</label>
                                                                <input 
                                                                    type="date" required 
                                                                    value={courseForm.date} 
                                                                    onChange={e => setCourseForm({...courseForm, date: e.target.value})}
                                                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"
                                                                />
                                                            </div>
                                                            <div>
                                                                <label className="block text-xs font-medium text-gray-700 mb-1">Orario</label>
                                                                <input 
                                                                    type="text" required 
                                                                    value={courseForm.time} 
                                                                    onChange={e => setCourseForm({...courseForm, time: e.target.value})}
                                                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"
                                                                />
                                                            </div>
                                                            <div>
                                                                <label className="block text-xs font-medium text-gray-700 mb-1">Luogo / Modalità (es. In presenza / Meet)</label>
                                                                <input 
                                                                    type="text" required 
                                                                    value={courseForm.location} 
                                                                    onChange={e => setCourseForm({...courseForm, location: e.target.value})}
                                                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"
                                                                />
                                                            </div>
                                                            <div>
                                                                <label className="block text-xs font-medium text-gray-700 mb-1">Relatore</label>
                                                                <input 
                                                                    type="text" 
                                                                    placeholder="Nome e Cognome del relatore"
                                                                    value={courseForm.speaker} 
                                                                    onChange={e => setCourseForm({...courseForm, speaker: e.target.value})}
                                                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"
                                                                />
                                                            </div>
                                                            <div>
                                                                <label className="block text-xs font-medium text-gray-700 mb-1">Posti Massimi</label>
                                                                <input 
                                                                    type="number" required 
                                                                    value={courseForm.max_seats} 
                                                                    onChange={e => setCourseForm({...courseForm, max_seats: parseInt(e.target.value)})}
                                                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"
                                                                />
                                                            </div>
                                                            <div className="md:col-span-3">
                                                                <label className="block text-xs font-medium text-gray-700 mb-1">Descrizione</label>
                                                                <textarea 
                                                                    rows="3" 
                                                                    value={courseForm.description} 
                                                                    onChange={e => setCourseForm({...courseForm, description: e.target.value})}
                                                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"
                                                                ></textarea>
                                                            </div>
                                                            <div className="md:col-span-3 flex justify-end gap-2">
                                                                {editingCourse && (
                                                                    <button 
                                                                        type="button" 
                                                                        onClick={() => {
                                                                            setEditingCourse(null);
                                                                            setCourseForm({ title: '', brand: 'tecnoalarm', date: '', time: '09:00 - 13:00', location: 'In presenza', max_seats: 20, description: '', speaker: '', active: true });
                                                                        }}
                                                                        className="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700"
                                                                    >
                                                                        Annulla
                                                                    </button>
                                                                )}
                                                                <button type="submit" className="bg-brand-600 text-white px-6 py-2 rounded-lg text-sm font-semibold hover:bg-brand-700">
                                                                    Salva Corso
                                                                </button>
                                                            </div>
                                                        </form>
                                                    </div>

                                                    {/* Lista Corsi Admin */}
                                                    <div className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                                                        <table className="w-full text-left border-collapse text-sm">
                                                            <thead>
                                                                <tr className="bg-gray-100 border-b border-gray-200 text-gray-600 text-xs uppercase">
                                                                    <th className="p-3">Corso</th>
                                                                    <th className="p-3">Data / Orario</th>
                                                                    <th className="p-3">Luogo / Modalità</th>
                                                                    <th className="p-3">Relatore</th>
                                                                    <th className="p-3">Posti</th>
                                                                    <th className="p-3 text-right">Azioni</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody className="divide-y divide-gray-200">
                                                                {courses.map(course => (
                                                                    <tr key={course.id} className="hover:bg-gray-50">
                                                                        <td className="p-3 font-medium text-gray-900">{course.title}<br/><span className="text-xs text-brand-600 uppercase">{course.brand}</span></td>
                                                                        <td className="p-3 text-xs text-gray-600">{course.date}<br/>{course.time}</td>
                                                                        <td className="p-3 text-xs text-gray-600">{course.location}</td>
                                                                        <td className="p-3 text-xs text-gray-800 font-medium">{course.speaker || '-'}</td>
                                                                        <td className="p-3 text-xs text-gray-600">{course.max_seats}</td>
                                                                        <td className="p-3 text-right space-x-2">
                                                                            <button 
                                                                                onClick={() => {
                                                                                    setEditingCourse(course);
                                                                                    setCourseForm(course);
                                                                                }}
                                                                                className="text-blue-600 hover:text-blue-800 text-xs font-semibold"
                                                                            >
                                                                                Modifica
                                                                            </button>
                                                                            <button 
                                                                                onClick={() => handleDeleteCourse(course.id)}
                                                                                className="text-red-500 hover:text-red-700 text-xs font-semibold"
                                                                            >
                                                                                Elimina
                                                                            </button>
                                                                        </td>
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            )}
                        </main>
                    </div>

                    {/* Modale Iscrizione Utente */}
                    {selectedCourse && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
                            <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl relative max-h-[90vh] overflow-y-auto">
                                <button 
                                    onClick={() => setSelectedCourse(null)}
                                    className="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-lg"
                                >
                                    <i className="fa-solid fa-xmark"></i>
                                </button>

                                <h3 className="text-xl font-bold text-gray-900 mb-1">Iscriviti al Corso</h3>
                                <p className="text-sm font-semibold text-brand-600 mb-4">{selectedCourse.title}</p>

                                {regSuccess ? (
                                    <div className="text-center py-8">
                                        <div className="bg-green-100 text-green-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                                            <i className="fa-solid fa-check"></i>
                                        </div>
                                        <h4 className="text-lg font-bold text-gray-900 mb-2">Iscrizione completata con successo!</h4>
                                        <p className="text-sm text-gray-600 mb-6">Ti è stata inviata un'email di conferma con i dettagli del corso.</p>
                                        <button 
                                            onClick={() => setSelectedCourse(null)}
                                            className="bg-brand-600 text-white px-6 py-2 rounded-lg text-sm font-semibold hover:bg-brand-700"
                                        >
                                            Chiudi
                                        </button>
                                    </div>
                                ) : (
                                    <form onSubmit={handleRegisterSubmit} className="space-y-4">
                                        {regError && (
                                            <div className="bg-red-50 border border-red-200 text-red-700 text-xs p-3 rounded-lg">
                                                {regError}
                                            </div>
                                        )}

                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-medium text-gray-700 mb-1">Nome *</label>
                                                <input 
                                                    type="text" required 
                                                    value={regForm.name} 
                                                    onChange={e => setRegForm({...regForm, name: e.target.value})}
                                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-medium text-gray-700 mb-1">Cognome *</label>
                                                <input 
                                                    type="text" required 
                                                    value={regForm.surname} 
                                                    onChange={e => setRegForm({...regForm, surname: e.target.value})}
                                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"
                                                />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-medium text-gray-700 mb-1">Email *</label>
                                                <input 
                                                    type="email" required 
                                                    value={regForm.email} 
                                                    onChange={e => setRegForm({...regForm, email: e.target.value})}
                                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-medium text-gray-700 mb-1">Telefono *</label>
                                                <input 
                                                    type="tel" required 
                                                    value={regForm.phone} 
                                                    onChange={e => setRegForm({...regForm, phone: e.target.value})}
                                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"
                                                />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-medium text-gray-700 mb-1">Azienda *</label>
                                                <input 
                                                    type="text" required 
                                                    value={regForm.company} 
                                                    onChange={e => setRegForm({...regForm, company: e.target.value})}
                                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-medium text-gray-700 mb-1">Partita IVA *</label>
                                                <input 
                                                    type="text" required 
                                                    value={regForm.vat} 
                                                    onChange={e => setRegForm({...regForm, vat: e.target.value})}
                                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"
                                                    placeholder="Max 2 iscritti per P.IVA"
                                                />
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-medium text-gray-700 mb-1">Ruolo Professionale</label>
                                            <input 
                                                type="text" 
                                                value={regForm.role} 
                                                onChange={e => setRegForm({...regForm, role: e.target.value})}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"
                                                placeholder="es. Installatore, Tecnico, Titolare"
                                            />
                                        </div>

                                        <div className="pt-2">
                                            <button type="submit" className="w-full bg-brand-600 text-white py-2.5 rounded-lg font-semibold hover:bg-brand-700 transition shadow">
                                                Conferma Iscrizione
                                            </button>
                                        </div>
                                    </form>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="bg-white border-t border-gray-200 mt-12 py-6">
                        <div className="max-w-7xl mx-auto px-4 text-center text-xs text-gray-500">
                            <p>{settings.footerText}</p>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
