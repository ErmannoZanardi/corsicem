<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portale Iscrizione Corsi Tecnici | Installatori Professionisti</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React e ReactDOM da CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel per JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      function App() {
        const [view, setView] = useState('courses'); // 'courses', 'register', 'admin-login', 'admin-dashboard'
        const [selectedBrand, setSelectedBrand] = useState('all');
        const [selectedCourse, setSelectedCourse] = useState(null);
        const [submitted, setSubmitted] = useState(false);
        const [submitError, setSubmitError] = useState('');
        const [adminPin, setAdminPin] = useState('');
        const [adminError, setAdminError] = useState(false);
        const [adminTab, setAdminTab] = useState('registrations'); // 'registrations', 'add-course'

        // Stato per i corsi (salvato in localStorage)
        const [courses, setCourses] = useState(() => {
          const saved = localStorage.getItem('system_courses_v2');
          return saved ? JSON.parse(saved) : [
            {
              id: 1,
              brand: 'tecnoalarm',
              brandName: 'Tecnoalarm',
              title: 'Corso Avanzato Sistemi Antintrusione e Cloud',
              code: 'TEC-ANT-01',
              date: '15-16 Ottobre 2026',
              modality: 'Google Meet', // 'In presenza', 'Google Meet', 'Ibrido'
              location: 'Link Google Meet (inviato via email)',
              maxParticipants: 20,
              duration: '2 Giorni',
              description: 'Programmazione avanzata centrali serie TP, gestione tracciati Cloud e integrazione domotica.',
              level: 'Avanzato'
            },
            {
              id: 2,
              brand: 'tecnofire',
              brandName: 'Tecnofire',
              title: 'Progettazione e Normativa Impianti Rivelazione Incendio',
              code: 'TFIRE-NOR-02',
              date: '22 Ottobre 2026',
              modality: 'In presenza',
              location: 'Sala Corsi Roma / Via Ostiense 150',
              maxParticipants: 15,
              duration: '1 Giorno',
              description: 'Normativa UNI 9795, configurazione centrali analogiche e indirizzamento dispositivi.',
              level: 'Professionale'
            },
            {
              id: 3,
              brand: 'nice',
              brandName: 'Nice',
              title: 'Automazioni Smart e Integrazione Ecosystem',
              code: 'NICE-AUT-03',
              date: '5 Novembre 2026',
              modality: 'In presenza',
              location: 'Centro Tecnico Bologna',
              maxParticipants: 12,
              duration: '1 Giorno',
              description: 'Installazione e programmazione centrali per cancelli, barriere e protocolli radio bidirezionali.',
              level: 'Base / Intermedio'
            },
            {
              id: 4,
              brand: 'dahua',
              brandName: 'Dahua',
              title: 'Sistemi di Videosorveglianza IP e Videoanalisi AI',
              code: 'DAH-AI-04',
              date: '12-13 Novembre 2026',
              modality: 'Google Meet',
              location: 'Aula Virtuale Google Meet',
              maxParticipants: 30,
              duration: '2 Giorni',
              description: 'Configurazione telecamere termiche, WizSense, riconoscimento facciale e NVR di ultima generazione.',
              level: 'Avanzato'
            }
          ];
        });
        
        // Stato per le iscrizioni (salvato in localStorage)
        const [registrations, setRegistrations] = useState(() => {
          const saved = localStorage.getItem('course_registrations_v2');
          return saved ? JSON.parse(saved) : [
            {
              id: 1,
              courseId: 1,
              fullName: 'Mario Rossi',
              company: 'Rossi Impianti Srl',
              vatNumber: '01234567890',
              email: 'mario@rossiimpianti.it',
              phone: '3331234567',
              city: 'Milano (MI)',
              courseTitle: 'Corso Avanzato Sistemi Antintrusione e Cloud',
              brandName: 'Tecnoalarm',
              date: '15-16 Ottobre 2026',
              timestamp: '02/10/2026 10:30'
            }
          ];
        });

        const [formData, setFormData] = useState({
          fullName: '',
          company: '',
          vatNumber: '',
          email: '',
          phone: '',
          city: ''
        });

        // Form nuovo corso per admin
        const [newCourseData, setNewCourseData] = useState({
          brand: 'tecnoalarm',
          brandName: 'Tecnoalarm',
          title: '',
          code: '',
          date: '',
          modality: 'In presenza',
          location: '',
          maxParticipants: 15,
          duration: '',
          description: '',
          level: 'Base'
        });

        useEffect(() => {
          localStorage.setItem('course_registrations_v2', JSON.stringify(registrations));
        }, [registrations]);

        useEffect(() => {
          localStorage.setItem('system_courses_v2', JSON.stringify(courses));
        }, [courses]);

        const filteredCourses = selectedBrand === 'all' 
          ? courses 
          : courses.filter(c => c.brand === selectedBrand);

        const handleInputChange = (e) => {
          setFormData({ ...formData, [e.target.name]: e.target.value });
        };

        // Calcola quanti iscritti ci sono già per un determinato corso
        const getCourseEnrollmentCount = (courseId) => {
          return registrations.filter(r => r.courseId === courseId).length;
        };

        // Calcola quanti iscritti ha già una determinata azienda (P.IVA) per un determinato corso
        const getCompanyEnrollmentCountForCourse = (courseId, vatNumber) => {
          const cleanVat = vatNumber.trim().toLowerCase();
          return registrations.filter(r => r.courseId === courseId && r.vatNumber.trim().toLowerCase() === cleanVat).length;
        };

        const handleSubmit = (e) => {
          e.preventDefault();
          setSubmitError('');

          const currentCount = getCourseEnrollmentCount(selectedCourse.id);
          const maxAllowed = selectedCourse.maxParticipants || 15;

          // Controllo disponibilità posti
          if (currentCount >= maxAllowed) {
            setSubmitError('Spiacenti, questo corso ha raggiunto il numero massimo di partecipanti ed è completo (Sold Out).');
            return;
          }

          // Controllo limite massimo di 2 iscritti per azienda per lo stesso corso
          const companyCount = getCompanyEnrollmentCountForCourse(selectedCourse.id, formData.vatNumber);
          if (companyCount >= 2) {
            setSubmitError('Attenzione: La tua azienda (Partita IVA inserita) ha già raggiunto il limite massimo di 2 partecipanti iscritti a questo corso.');
            return;
          }

          const newReg = {
            id: Date.now(),
            courseId: selectedCourse.id,
            ...formData,
            courseTitle: selectedCourse.title,
            brandName: selectedCourse.brandName,
            date: selectedCourse.date,
            timestamp: new Date().toLocaleString()
          };

          setRegistrations([newReg, ...registrations]);
          setSubmitted(true);
        };

        const handleAdminLogin = (e) => {
          e.preventDefault();
          if (adminPin === 'admin123') {
            setAdminError(false);
            setView('admin-dashboard');
            setAdminPin('');
          } else {
            setAdminError(true);
          }
        };

        const handleNewCourseChange = (e) => {
          const { name, value } = e.target;
          if (name === 'brand') {
            let bName = 'Tecnoalarm';
            if (value === 'tecnofire') bName = 'Tecnofire';
            if (value === 'nice') bName = 'Nice';
            if (value === 'dahua') bName = 'Dahua';
            if (value === 'altro') bName = 'Altro Marchio';
            setNewCourseData({ ...newCourseData, brand: value, brandName: bName });
          } else if (name === 'modality' && value === 'Google Meet') {
            setNewCourseData({ ...newCourseData, modality: value, location: 'Google Meet (Link online)' });
          } else {
            setNewCourseData({ ...newCourseData, [name]: value });
          }
        };

        const handleAddCourseSubmit = (e) => {
          e.preventDefault();
          const createdCourse = {
            id: Date.now(),
            ...newCourseData,
            maxParticipants: parseInt(newCourseData.maxParticipants) || 15
          };
          setCourses([...courses, createdCourse]);
          alert('Nuovo corso aggiunto con successo!');
          setNewCourseData({
            brand: 'tecnoalarm',
            brandName: 'Tecnoalarm',
            title: '',
            code: '',
            date: '',
            modality: 'In presenza',
            location: '',
            maxParticipants: 15,
            duration: '',
            description: '',
            level: 'Base'
          });
          setAdminTab('registrations');
        };

        const handleDeleteCourse = (id) => {
          if (confirm('Vuoi davvero eliminare questo corso?')) {
            setCourses(courses.filter(c => c.id !== id));
          }
        };

        const totalRegistrations = registrations.length;
        const registrationsByBrand = registrations.reduce((acc, reg) => {
          acc[reg.brandName] = (acc[reg.brandName] || 0) + 1;
          return acc;
        }, {});

        return (
          <div className="min-h-screen flex flex-col bg-slate-50">
            {/* Header */}
            <header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-50 shadow-md">
              <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div className="flex items-center space-x-3 cursor-pointer" onClick={() => { setView('courses'); setSelectedCourse(null); setSubmitted(false); }}>
                  <div className="bg-blue-600 p-2.5 rounded-xl text-white font-bold shadow-md shadow-blue-600/30">
                    🎓
                  </div>
                  <div>
                    <h1 className="text-xl font-bold tracking-tight">Portale Formazione Installatori</h1>
                    <p className="text-xs text-slate-400">In presenza & Google Meet • Max 2 iscritti per azienda</p>
                  </div>
                </div>
                <div className="flex items-center gap-3">
                  <button
                    onClick={() => { setView('courses'); setSelectedCourse(null); setSubmitted(false); }}
                    className={`text-xs px-3 py-2 rounded-lg font-medium transition-colors ${view === 'courses' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                  >
                    Catalogo Corsi
                  </button>
                  <button
                    onClick={() => { setView('admin-login'); setAdminError(false); }}
                    className={`text-xs px-3 py-2 rounded-lg font-medium transition-colors border border-slate-700 ${view.includes('admin') ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                  >
                    🔒 Area Admin
                  </button>
                </div>
              </div>
            </header>

            {/* Main Content */}
            <main className="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
              
              {/* VISTA CATALOGO CORSI */}
              {view === 'courses' && !selectedCourse && (
                <div>
                  <div className="text-center max-w-2xl mx-auto mb-10">
                    <h2 className="text-3xl font-extrabold text-slate-900 tracking-tight mb-3">
                      Corsi Tecnici in Presenza e su Google Meet
                    </h2>
                    <p className="text-slate-600 text-sm leading-relaxed">
                      Scegli il marchio, verifica i posti disponibili e prenota la tua sessione formativa. È consentito un massimo di 2 partecipanti per azienda su ciascun corso.
                    </p>
                  </div>

                  <div className="flex flex-wrap justify-center gap-2 mb-8">
                    {[
                      { id: 'all', label: 'Tutti i Marchi' },
                      { id: 'tecnoalarm', label: 'Tecnoalarm' },
                      { id: 'tecnofire', label: 'Tecnofire' },
                      { id: 'nice', label: 'Nice' },
                      { id: 'dahua', label: 'Dahua' },
                    ].map(brand => (
                      <button
                        key={brand.id}
                        onClick={() => setSelectedBrand(brand.id)}
                        className={`px-4 py-2 rounded-xl text-sm font-medium transition-all duration-200 shadow-sm ${
                          selectedBrand === brand.id
                            ? 'bg-blue-600 text-white shadow-blue-600/20 shadow-md'
                            : 'bg-white text-slate-700 hover:bg-slate-100 border border-slate-200'
                        }`}
                      >
                        {brand.label}
                      </button>
                    ))}
                  </div>

                  {filteredCourses.length === 0 ? (
                    <div className="bg-white rounded-2xl border border-slate-200 p-12 text-center text-slate-500 text-sm">
                      Nessun corso disponibile al momento per questo marchio.
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      {filteredCourses.map(course => {
                        const enrolled = getCourseEnrollmentCount(course.id);
                        const maxLimit = course.maxParticipants || 15;
                        const isFull = enrolled >= maxLimit;

                        return (
                          <div 
                            key={course.id}
                            className="bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-all duration-200 flex flex-col justify-between overflow-hidden relative"
                          >
                            <div className="p-6">
                              <div className="flex justify-between items-start gap-4 mb-3">
                                <span className="inline-block bg-blue-50 text-blue-700 text-xs font-semibold px-2.5 py-1 rounded-md uppercase tracking-wider border border-blue-100">
                                  {course.brandName}
                                </span>
                                <div className="flex items-center gap-2">
                                  <span className={`text-xs font-semibold px-2.5 py-1 rounded-md ${course.modality === 'Google Meet' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-amber-50 text-amber-700 border border-amber-200'}`}>
                                    {course.modality === 'Google Meet' ? '💻 Google Meet' : '🏢 In Presenza'}
                                  </span>
                                  <span className="text-xs font-medium text-slate-500 bg-slate-100 px-2.5 py-1 rounded-md">
                                    {course.level}
                                  </span>
                                </div>
                              </div>
                              
                              <h3 className="text-lg font-bold text-slate-900 mb-2">{course.title}</h3>
                              <p className="text-slate-600 text-sm mb-4 leading-relaxed">{course.description}</p>
                              
                              <div className="space-y-2 text-xs text-slate-600 border-t border-slate-100 pt-4">
                                <div className="flex items-center gap-2">
                                  <span className="font-semibold text-slate-700">📅 Data:</span> {course.date}
                                </div>
                                <div className="flex items-center gap-2">
                                  <span className="font-semibold text-slate-700">📍 {course.modality === 'Google Meet' ? 'Piattaforma' : 'Sede'}:</span> {course.location}
                                </div>
                                <div className="flex items-center justify-between">
                                  <div className="flex items-center gap-2">
                                    <span className="font-semibold text-slate-700">⏱️ Durata:</span> {course.duration}
                                  </div>
                                  <div className={`font-semibold ${isFull ? 'text-red-600' : 'text-emerald-600'}`}>
                                    {isFull ? '🔴 Corso Sold Out' : `🟢 Posti: ${enrolled} / ${maxLimit} occupati`}
                                  </div>
                                </div>
                              </div>
                            </div>

                            <div className="px-6 pb-6 pt-0">
                              <button
                                onClick={() => { setSelectedCourse(course); setSubmitted(false); setSubmitError(''); }}
                                disabled={isFull}
                                className={`w-full font-medium py-2.5 px-4 rounded-xl text-sm transition-colors duration-200 shadow-sm flex items-center justify-center gap-2 ${
                                  isFull 
                                    ? 'bg-slate-200 text-slate-400 cursor-not-allowed' 
                                    : 'bg-slate-900 hover:bg-blue-600 text-white'
                                }`}
                              >
                                {isFull ? 'Esaurito (Sold Out)' : 'Iscriviti al Corso'}
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}

              {/* VISTA MODULO ISCRIZIONE */}
              {view === 'courses' && selectedCourse && (
                <div className="max-w-xl mx-auto bg-white rounded-2xl border border-slate-200 shadow-lg p-6 sm:p-8">
                  {!submitted ? (
                    <div>
                      <button
                        onClick={() => setSelectedCourse(null)}
                        className="text-xs font-medium text-blue-600 hover:text-blue-800 mb-6 inline-flex items-center gap-1"
                      >
                        ← Torna all'elenco corsi
                      </button>

                      <div className="mb-6 bg-slate-50 p-4 rounded-xl border border-slate-100">
                        <div className="flex justify-between items-center mb-1">
                          <span className="text-xs font-bold text-blue-600 uppercase tracking-wider">{selectedCourse.brandName}</span>
                          <span className="text-xs font-semibold px-2 py-0.5 rounded bg-blue-100 text-blue-800">
                            {selectedCourse.modality}
                          </span>
                        </div>
                        <h3 className="text-base font-bold text-slate-900">{selectedCourse.title}</h3>
                        <p className="text-xs text-slate-500 mt-1">📅 {selectedCourse.date} | 📍 {selectedCourse.location}</p>
                        <p className="text-xs text-blue-700 font-medium mt-2">ℹ️ Regola aziendale: Massimo 2 partecipanti per azienda (P.IVA) a questo corso.</p>
                      </div>

                      <h2 className="text-xl font-bold text-slate-900 mb-4">Modulo di Registrazione Installatore</h2>
                      
                      {submitError && (
                        <div className="mb-4 bg-red-50 border border-red-200 text-red-700 text-xs p-3 rounded-lg font-medium">
                          {submitError}
                        </div>
                      )}

                      <form onSubmit={handleSubmit} className="space-y-4">
                        <div>
                          <label className="block text-xs font-medium text-slate-700 mb-1">Nome e Cognome del Partecipante *</label>
                          <input
                            type="text"
                            name="fullName"
                            required
                            value={formData.fullName}
                            onChange={handleInputChange}
                            className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="Mario Rossi"
                          />
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-xs font-medium text-slate-700 mb-1">Ragione Sociale Azienda *</label>
                            <input
                              type="text"
                              name="company"
                              required
                              value={formData.company}
                              onChange={handleInputChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                              placeholder="Impianti Elettrici Srl"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-medium text-slate-700 mb-1">Partita IVA (per controllo limite 2) *</label>
                            <input
                              type="text"
                              name="vatNumber"
                              required
                              value={formData.vatNumber}
                              onChange={handleInputChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono"
                              placeholder="01234567890"
                            />
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-xs font-medium text-slate-700 mb-1">Email Aziendale *</label>
                            <input
                              type="email"
                              name="email"
                              required
                              value={formData.email}
                              onChange={handleInputChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                              placeholder="mario@impianti.it"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-medium text-slate-700 mb-1">Telefono / Cellulare *</label>
                            <input
                              type="tel"
                              name="phone"
                              required
                              value={formData.phone}
                              onChange={handleInputChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                              placeholder="333 1234567"
                            />
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-medium text-slate-700 mb-1">Città sede lavorativa *</label>
                          <input
                            type="text"
                            name="city"
                            required
                            value={formData.city}
                            onChange={handleInputChange}
                            className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="Milano (MI)"
                          />
                        </div>

                        <button
                          type="submit"
                          className="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl text-sm transition-colors duration-200 shadow-md shadow-blue-600/20"
                        >
                          Conferma Iscrizione al Corso
                        </button>
                      </form>
                    </div>
                  ) : (
                    <div className="text-center py-6">
                      <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
                        ✓
                      </div>
                      <h3 className="text-xl font-bold text-slate-900 mb-2">Iscrizione Effettuata con Successo!</h3>
                      <p className="text-slate-600 text-sm mb-6 leading-relaxed">
                        Grazie <strong>{formData.fullName}</strong> ({formData.company}). Abbiamo registrato la tua richiesta per il corso <strong>{selectedCourse.title}</strong> in modalità <strong>{selectedCourse.modality}</strong>. 
                        {selectedCourse.modality === 'Google Meet' && ' Riceverai il link di collegamento Google Meet all\'email indicata.'}
                      </p>
                      <button
                        onClick={() => { setSubmitted(false); setSelectedCourse(null); }}
                        className="bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 px-6 rounded-xl text-sm transition-colors"
                      >
                        Torna alla Home Corsi
                      </button>
                    </div>
                  )}
                </div>
              )}

              {/* VISTA LOGIN ADMIN */}
              {view === 'admin-login' && (
                <div className="max-w-md mx-auto bg-white rounded-2xl border border-slate-200 shadow-lg p-8 mt-10">
                  <div className="text-center mb-6">
                    <div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center mx-auto mb-3 text-xl font-bold">
                      🔒
                    </div>
                    <h2 className="text-xl font-bold text-slate-900">Accesso Riservato Admin</h2>
                    <p className="text-xs text-slate-500 mt-1">Inserisci il PIN per visualizzare il pannello</p>
                  </div>

                  <form onSubmit={handleAdminLogin} className="space-y-4">
                    <div>
                      <label className="block text-xs font-medium text-slate-700 mb-1">PIN di Accesso (Usa: admin123)</label>
                      <input
                        type="password"
                        required
                        value={adminPin}
                        onChange={(e) => setAdminPin(e.target.value)}
                        className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-center tracking-widest text-lg"
                        placeholder="••••••••"
                      />
                    </div>
                    {adminError && (
                      <p className="text-xs text-red-600 text-center font-medium">PIN errato. Riprova (prova con admin123)</p>
                    )}
                    <button
                      type="submit"
                      className="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-xl text-sm transition-colors shadow-md shadow-blue-600/20"
                    >
                      Accedi al Pannello
                    </button>
                  </form>
                </div>
              )}

              {/* VISTA PANNELLO DASHBOARD ADMIN */}
              {view === 'admin-dashboard' && (
                <div>
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                    <div>
                      <h2 className="text-2xl font-bold text-slate-900">Pannello di Controllo Admin</h2>
                      <p className="text-xs text-slate-500">Gestione corsi (Meet / In presenza), limiti di posti e reportistica</p>
                    </div>
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => setAdminTab('registrations')}
                        className={`text-xs px-4 py-2 rounded-xl font-medium transition-colors ${adminTab === 'registrations' ? 'bg-blue-600 text-white shadow-sm' : 'bg-white text-slate-700 border border-slate-200'}`}
                      >
                        📊 Report Iscritti ({registrations.length})
                      </button>
                      <button
                        onClick={() => setAdminTab('add-course')}
                        className={`text-xs px-4 py-2 rounded-xl font-medium transition-colors ${adminTab === 'add-course' ? 'bg-blue-600 text-white shadow-sm' : 'bg-white text-slate-700 border border-slate-200'}`}
                      >
                        ➕ Inserisci Nuovo Corso
                      </button>
                    </div>
                  </div>

                  {/* SEZIONE REPORT ISCRITTI */}
                  {adminTab === 'registrations' && (
                    <div>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                          <p className="text-xs font-medium text-slate-500 uppercase tracking-wider">Totale Iscrizioni</p>
                          <p className="text-2xl font-extrabold text-slate-900 mt-1">{totalRegistrations}</p>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm sm:col-span-2">
                          <p className="text-xs font-medium text-slate-500 uppercase tracking-wider mb-2">Iscritti per Marchio</p>
                          <div className="flex flex-wrap gap-2">
                            {Object.keys(registrationsByBrand).length === 0 ? (
                              <span className="text-xs text-slate-400">Nessun dato disponibile</span>
                            ) : (
                              Object.entries(registrationsByBrand).map(([brand, count]) => (
                                <span key={brand} className="bg-blue-50 text-blue-700 text-xs font-semibold px-3 py-1.5 rounded-lg border border-blue-100">
                                  {brand}: <strong>{count}</strong>
                                </span>
                              ))
                            )}
                          </div>
                        </div>
                      </div>

                      <div className="flex justify-between items-center mb-4">
                        <h3 className="text-lg font-bold text-slate-900">Elenco Dettagliato Installatori</h3>
                        {registrations.length > 0 && (
                          <button
                            onClick={() => {
                              if (confirm('Vuoi davvero cancellare tutte le iscrizioni?')) {
                                setRegistrations([]);
                              }
                            }}
                            className="text-xs text-red-600 hover:text-red-800 font-medium bg-red-50 px-3 py-1.5 rounded-lg border border-red-200"
                          >
                            Svuota Storico Iscrizioni
                          </button>
                        )}
                      </div>

                      {registrations.length === 0 ? (
                        <div className="bg-white rounded-2xl border border-slate-200 p-12 text-center">
                          <p className="text-slate-500 text-sm">Nessuna iscrizione registrata al momento.</p>
                        </div>
                      ) : (
                        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                          <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                              <thead>
                                <tr className="bg-slate-50 border-b border-slate-200 text-xs text-slate-600 uppercase tracking-wider">
                                  <th className="p-4 font-semibold">Data & Ora</th>
                                  <th className="p-4 font-semibold">Installatore</th>
                                  <th className="p-4 font-semibold">Azienda / P.IVA</th>
                                  <th className="p-4 font-semibold">Contatti</th>
                                  <th className="p-4 font-semibold">Corso Scelto</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-100 text-sm text-slate-700">
                                {registrations.map((reg) => (
                                  <tr key={reg.id} className="hover:bg-slate-50/80 transition-colors">
                                    <td className="p-4 text-xs text-slate-500 whitespace-nowrap">{reg.timestamp}</td>
                                    <td className="p-4 font-medium text-slate-900">
                                      {reg.fullName}
                                      <div className="text-xs text-slate-500 font-normal">{reg.city}</div>
                                    </td>
                                    <td className="p-4">
                                      {reg.company}
                                      <div className="text-xs text-slate-500 font-mono">P.IVA: {reg.vatNumber}</div>
                                    </td>
                                    <td className="p-4 text-xs">
                                      <div>✉️ {reg.email}</div>
                                      <div className="mt-0.5">📞 {reg.phone}</div>
                                    </td>
                                    <td className="p-4">
                                      <div className="flex items-center gap-1.5 mb-1">
                                        <span className="inline-block bg-blue-50 text-blue-700 text-xs font-semibold px-2 py-0.5 rounded border border-blue-100">
                                          {reg.brandName}
                                        </span>
                                      </div>
                                      <div className="text-xs font-medium text-slate-900">{reg.courseTitle}</div>
                                      <div className="text-xs text-slate-500">📅 {reg.date}</div>
                                    </td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  {/* SEZIONE INSERISCI NUOVO CORSO */}
                  {adminTab === 'add-course' && (
                    <div className="max-w-2xl mx-auto bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
                      <h3 className="text-lg font-bold text-slate-900 mb-1">Crea Nuovo Corso di Formazione</h3>
                      <p className="text-xs text-slate-500 mb-6">Imposta la modalità di erogazione (Meet o In presenza) e il numero massimo di posti.</p>

                      <form onSubmit={handleAddCourseSubmit} className="space-y-4">
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-xs font-medium text-slate-700 mb-1">Marchio di Riferimento *</label>
                            <select
                              name="brand"
                              value={newCourseData.brand}
                              onChange={handleNewCourseChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                            >
                              <option value="tecnoalarm">Tecnoalarm</option>
                              <option value="tecnofire">Tecnofire</option>
                              <option value="nice">Nice</option>
                              <option value="dahua">Dahua</option>
                              <option value="altro">Altro Marchio</option>
                            </select>
                          </div>
                          <div>
                            <label className="block text-xs font-medium text-slate-700 mb-1">Livello del Corso</label>
                            <select
                              name="level"
                              value={newCourseData.level}
                              onChange={handleNewCourseChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                            >
                              <option value="Base">Base</option>
                              <option value="Intermedio">Intermedio</option>
                              <option value="Avanzato">Avanzato</option>
                              <option value="Professionale">Professionale</option>
                            </select>
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-medium text-slate-700 mb-1">Titolo del Corso *</label>
                          <input
                            type="text"
                            name="title"
                            required
                            value={newCourseData.title}
                            onChange={handleNewCourseChange}
                            className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="Es. Programmazione Avanzata Centrali IP"
                          />
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                          <div>
                            <label className="block text-xs font-medium text-slate-700 mb-1">Codice Corso</label>
                            <input
                              type="text"
                              name="code"
                              value={newCourseData.code}
                              onChange={handleNewCourseChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                              placeholder="Es. TEC-99"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-medium text-slate-700 mb-1">Modalità Erogazione *</label>
                            <select
                              name="modality"
                              value={newCourseData.modality}
                              onChange={handleNewCourseChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                            >
                              <option value="In presenza">In presenza</option>
                              <option value="Google Meet">Google Meet</option>
                            </select>
                          </div>
                          <div>
                            <label className="block text-xs font-medium text-slate-700 mb-1">Max Partecipanti *</label>
                            <input
                              type="number"
                              name="maxParticipants"
                              min="1"
                              max="200"
                              required
                              value={newCourseData.maxParticipants}
                              onChange={handleNewCourseChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                            />
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-xs font-medium text-slate-700 mb-1">Sede o Link Piattaforma *</label>
                            <input
                              type="text"
                              name="location"
                              required
                              value={newCourseData.location}
                              onChange={handleNewCourseChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                              placeholder="Es. Sala Corsi Milano oppure Google Meet"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-medium text-slate-700 mb-1">Date Corso *</label>
                            <input
                              type="text"
                              name="date"
                              required
                              value={newCourseData.date}
                              onChange={handleNewCourseChange}
                              className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                              placeholder="Es. 10-11 Dicembre 2026"
                            />
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-medium text-slate-700 mb-1">Durata *</label>
                          <input
                            type="text"
                            name="duration"
                            required
                            value={newCourseData.duration}
                            onChange={handleNewCourseChange}
                            className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="Es. 2 Giorni"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-medium text-slate-700 mb-1">Descrizione Dettagliata *</label>
                          <textarea
                            name="description"
                            required
                            rows="3"
                            value={newCourseData.description}
                            onChange={handleNewCourseChange}
                            className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="Descrivi gli argomenti trattati durante la sessione formativa..."
                          ></textarea>
                        </div>

                        <div className="pt-2 flex gap-3">
                          <button
                            type="submit"
                            className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl text-sm transition-colors shadow-md shadow-blue-600/20"
                          >
                            Pubblica Corso nel Catalogo
                          </button>
                          <button
                            type="button"
                            onClick={() => setAdminTab('registrations')}
                            className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-3 px-4 rounded-xl text-sm transition-colors"
                          >
                            Annulla
                          </button>
                        </div>
                      </form>

                      {/* Lista corsi esistenti con opzione di eliminazione */}
                      <div className="mt-10 border-t border-slate-200 pt-6">
                        <h4 className="text-sm font-bold text-slate-900 mb-3">Corsi Attualmente in Catalogo (Gestione Rapida)</h4>
                        <div className="space-y-2 max-h-60 overflow-y-auto">
                          {courses.map(c => (
                            <div key={c.id} className="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs">
                              <div>
                                <span className="font-bold text-blue-600 uppercase">{c.brandName}:</span> {c.title} <span className="text-slate-400">({c.modality} - Max {c.maxParticipants})</span>
                              </div>
                              <button
                                onClick={() => handleDeleteCourse(c.id)}
                                className="text-red-600 hover:text-red-800 font-semibold px-2 py-1 bg-white border border-red-200 rounded"
                              >
                                Elimina
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>

                    </div>
                  )}

                </div>
              )}

            </main>

            {/* Footer */}
            <footer className="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 mt-12">
              <p>© 2026 Portale Formazione Installatori Tecnici. Tutti i diritti riservati.</p>
            </footer>
          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById('root'));
    </script>
  </body>
</html>
