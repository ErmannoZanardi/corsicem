  <body class="bg-slate-100 text-slate-800 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // ==========================================
      // CONFIGURAZIONE SUPABASE (Database Cloud)
      // ==========================================
      const SUPABASE_URL = "https://nsfqltisjpjirqoadjnh.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zZnFsdGlzanBqaXJxb2Fkam5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4ODk5NDgsImV4cCI6MjEwNjQ2NTk0OH0.uWIC4REeMSmFC1LbYt7kpZP40CQ4GXbmH_Ct7AkkGFE";

      let supabaseClient = null;
      if (SUPABASE_URL && SUPABASE_URL !== "YOUR_SUPABASE_URL" && window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }

      // ==========================================
      // CODICI TICKET SICURI
      // 12 caratteri casuali (alfabeto senza simboli ambigui 0/O/1/I/L)
      // generati con il generatore crittografico del browser.
      // Formato: TICKET-XXXX-XXXX-XXXX (circa 8 x 10^17 combinazioni)
      // ==========================================
      const TICKET_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';

      function generateSecureTicketCode() {
        const limit = 256 - (256 % TICKET_ALPHABET.length); // evita distorsioni statistiche
        let chars = '';
        while (chars.length < 12) {
          const bytes = new Uint8Array(24);
          window.crypto.getRandomValues(bytes);
          for (const b of bytes) {
            if (b < limit && chars.length < 12) chars += TICKET_ALPHABET[b % TICKET_ALPHABET.length];
          }
        }
        return 'TICKET-' + chars.slice(0, 4) + '-' + chars.slice(4, 8) + '-' + chars.slice(8, 12);
      }

      async function ticketCodeExists(code) {
        if (!supabaseClient) return false;
        try {
          const { data, error } = await supabaseClient.from('registrations').select('id').eq('ticket_code', code).limit(1);
          return !error && data && data.length > 0;
        } catch (err) {
          return false;
        }
      }

      // ==========================================
      // PAGINA PUBBLICA DI VERIFICA AUTENTICITÀ ATTESTATO
      // Si apre scansionando il QR dell'attestato: index.html?verifica=CODICE
      // Interroga il database e mostra solo i dati minimi necessari.
      // ==========================================
      function VerifyPage({ code }) {
        const [state, setState] = useState({ status: 'loading', data: null });
        const [footerText, setFooterText] = useState('');

        // Testo copyright del footer, lo stesso impostato in "Personalizzazione Azienda e Logo"
        useEffect(() => {
          const loadFooter = async () => {
            if (!supabaseClient) return;
            try {
              const { data, error } = await supabaseClient.from('settings').select('value').eq('key', 'copyright_text').limit(1);
              if (!error && data && data[0] && data[0].value) setFooterText(data[0].value);
            } catch (err) {
              console.error('Errore caricamento copyright:', err);
            }
          };
          loadFooter();
        }, []);

        useEffect(() => {
          const run = async () => {
            if (!supabaseClient) {
              setState({ status: 'error', data: null });
              return;
            }
            try {
              const { data: foundReg, error } = await supabaseClient.rpc('get_registration_public', { p_code: code });
              const data = foundReg ? [foundReg] : [];
              if (error) throw error;
              if (!data || data.length === 0) {
                setState({ status: 'invalid', data: null });
              } else {
                setState({ status: 'found', data: data[0] });
              }
            } catch (err) {
              console.error('Errore verifica attestato:', err);
              setState({ status: 'error', data: null });
            }
          };
          run();
        }, [code]);

        const { status, data } = state;
        const authentic = status === 'found' && data.is_present;

        return (
          <div className="min-h-screen bg-slate-100 flex flex-col font-sans">
            <div className="flex-1 flex items-center justify-center p-4">
            <div className="w-full max-w-md bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
              <div className="bg-[#1b365d] text-white px-6 py-4">
                <p className="text-xs uppercase tracking-wider text-amber-300 font-bold">Verifica attestato</p>
                <h1 className="text-lg font-black">Controllo di autenticità</h1>
              </div>
              <div className="p-6 space-y-4">
                <p className="text-xs text-slate-500">Codice verificato: <span className="font-mono font-bold text-slate-800">{code}</span></p>

                {status === 'loading' && (
                  <p className="text-sm text-slate-600">Verifica in corso, attendere...</p>
                )}

                {status === 'invalid' && (
                  <div className="bg-red-50 border border-red-200 rounded-xl p-4">
                    <p className="text-sm font-black text-red-700">❌ Attestato NON valido</p>
                    <p className="text-xs text-red-600 mt-1">Il codice non corrisponde ad alcuna iscrizione registrata nel nostro database.</p>
                  </div>
                )}

                {status === 'error' && (
                  <div className="bg-amber-50 border border-amber-200 rounded-xl p-4">
                    <p className="text-sm font-black text-amber-700">⚠ Verifica non disponibile</p>
                    <p className="text-xs text-amber-700 mt-1">Impossibile contattare il database. Riprova più tardi.</p>
                  </div>
                )}

                {status === 'found' && (
                  <>
                    {authentic ? (
                      <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4">
                        <p className="text-sm font-black text-emerald-700">✅ Attestato AUTENTICO</p>
                        <p className="text-xs text-emerald-700 mt-1">Partecipazione al corso registrata nel database{data.checkin_time ? ` (check-in ore ${data.checkin_time})` : ''}.</p>
                      </div>
                    ) : (
                      <div className="bg-amber-50 border border-amber-200 rounded-xl p-4">
                        <p className="text-sm font-black text-amber-700">⚠ Iscrizione trovata, presenza non registrata</p>
                        <p className="text-xs text-amber-700 mt-1">Il codice esiste ma la partecipazione al corso non risulta confermata dalla segreteria.</p>
                      </div>
                    )}
                    <dl className="text-sm divide-y divide-slate-100 border border-slate-200 rounded-xl">
                      <div className="p-3"><dt className="text-[11px] uppercase text-slate-400 font-bold">Partecipante</dt><dd className="font-bold text-slate-900">{data.full_name}</dd></div>
                      <div className="p-3"><dt className="text-[11px] uppercase text-slate-400 font-bold">Azienda</dt><dd className="text-slate-800">{data.company}</dd></div>
                      <div className="p-3"><dt className="text-[11px] uppercase text-slate-400 font-bold">Corso</dt><dd className="text-slate-800">{data.course_title} {data.brand_name ? `(${data.brand_name})` : ''}</dd></div>
                      <div className="p-3"><dt className="text-[11px] uppercase text-slate-400 font-bold">Data del corso</dt><dd className="text-slate-800">{data.date}</dd></div>
                    </dl>
                  </>
                )}
              </div>
            </div>
            </div>
            <footer className="bg-[#1b365d] text-white border-t border-blue-900/50 py-6 text-center text-xs text-slate-300">
              <p>{footerText || '© 2026 Portale Formazione Installatori Tecnici. Tutti i diritti riservati.'}</p>
            </footer>
          </div>
        );
      }

      // ==========================================
      // ATTESTATO: costanti, generatore PDF e pagina pubblica di download
      // ==========================================
      const DEFAULT_BRANDS = [
        { id: 'tecnoalarm', name: 'TECNOALARM', logoUrl: '', color: '#8b1e1e', posterBgUrl: '', certificateBgUrl: '' },
        { id: 'tecnofire', name: 'TECNOFIRE', logoUrl: '', color: '#b91c1c', posterBgUrl: '', certificateBgUrl: '' },
        { id: 'nice', name: 'NICE', logoUrl: '', color: '#0369a1', posterBgUrl: '', certificateBgUrl: '' },
        { id: 'dahua', name: 'DAHUA', logoUrl: '', color: '#4338ca', posterBgUrl: '', certificateBgUrl: '' }
      ];

      // Template EmailJS dedicato all'invio dell'attestato (da creare nella dashboard EmailJS)
      const EMAILJS_SERVICE_ID = "service_miwig8q";
      const EMAILJS_ATTESTATO_TEMPLATE_ID = "template_attestato";

      function buildAttestatoPdf(reg, { brands, courses, companyName, signatures = null, mode = 'open' }) {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

          const brandObj = brands.find(b => b.name === reg.brandName);
          const brandColorHex = brandObj?.color || '#1b365d';
          const brandCertBg = brandObj?.certificateBgUrl || '';

          const matchedCourse = courses.find(c => c.id === reg.courseId || c.title === reg.courseTitle);
          const courseSpeaker = matchedCourse?.speaker || 'Ermanno Zanardi';
          const courseLevel = matchedCourse?.level || reg.level || 'N/D';

          const hexToRgb = (hex) => {
            let c = hex.replace('#','');
            if(c.length === 3) c = c.split('').map(x => x + x).join('');
            const num = parseInt(c, 16);
            return [num >> 16, (num >> 8) & 255, num & 255];
          };
          const [r, g, b] = hexToRgb(brandColorHex);

          const generateCertPdfContent = (bgImgData, qrImgDataUrl) => {
            if (bgImgData) {
              try {
                doc.addImage(bgImgData, 'JPEG', 0, 0, 297, 210);
              } catch (e) {}
            } else {
              doc.setFillColor(255, 255, 255);
              doc.rect(0, 0, 297, 210, 'F');

              doc.setDrawColor(r, g, b);
              doc.setLineWidth(1.5);
              doc.rect(12, 12, 273, 186);

              doc.setDrawColor(210, 215, 220);
              doc.setLineWidth(0.5);
              doc.rect(15, 15, 267, 180);
            }

            doc.setFont("helvetica", "bold");
            doc.setFontSize(14);
            doc.setTextColor(r, g, b);
            doc.text((companyName || "PORTALE FORMAZIONE").toUpperCase(), 148.5, 28, { align: 'center' });

            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            doc.setTextColor(100, 110, 120);
            doc.text(`Attestato Ufficiale di Partecipazione - Marchio: ${reg.brandName || 'N/D'}`, 148.5, 35, { align: 'center' });

            doc.setFont("helvetica", "bold");
            doc.setFontSize(26);
            doc.setTextColor(30, 41, 59);
            doc.text("ATTESTATO DI PARTECIPAZIONE", 148.5, 62, { align: 'center' });

            doc.setFont("helvetica", "italic");
            doc.setFontSize(12);
            doc.setTextColor(100, 110, 120);
            doc.text("Si certifica con la presente che il professionista / installatore", 148.5, 76, { align: 'center' });

            doc.setFont("helvetica", "bold");
            doc.setFontSize(24);
            doc.setTextColor(r, g, b);
            doc.text(reg.fullName || 'Mario Rossi', 148.5, 93, { align: 'center' });

            doc.setFont("helvetica", "normal");
            doc.setFontSize(12);
            doc.setTextColor(50, 60, 75);
            doc.text(`in rappresentanza dell'azienda ${reg.company || 'Azienda'} (P.IVA: ${reg.vatNumber || 'N/D'}) - Città: ${reg.city || 'N/D'}`, 148.5, 103, { align: 'center' });

            doc.setFont("helvetica", "bold");
            doc.setFontSize(12);
            doc.setTextColor(50, 60, 75);
            doc.text("10/10", 253, 129, { align: 'center' });
            doc.setFont("helvetica", "bold");
            doc.setFontSize(8.5);
            doc.text("Class.", 253, 124, { align: 'center' });

            doc.setFont("helvetica", "bold");
            doc.setTextColor(r, g, b);
            doc.setFontSize(12);
            doc.text(`Livello: ${courseLevel}`, 148.5, 142, { align: 'center' });              

            doc.setFont("helvetica", "normal");
            doc.setFontSize(12);
            doc.setTextColor(100, 110, 120);
            doc.text("ha frequentato con profitto il percorso formativo:", 148.5, 122, { align: 'center' });

            doc.setFont("helvetica", "bold");
            doc.setFontSize(18);
            doc.setTextColor(30, 41, 59);
            const splitCourseTitle = doc.splitTextToSize(reg.courseTitle || 'Corso Tecnico', 240);
            doc.text(splitCourseTitle, 148.5, 135, { align: 'center' });

            doc.setFont("helvetica", "normal");
            doc.setFontSize(11);
            doc.setTextColor(80, 90, 105);
            doc.text(`Data di svolgimento: ${reg.date || 'N/D'}`, 148.5, 155, { align: 'center' });

            if (qrImgDataUrl) {
              try {
                doc.addImage(qrImgDataUrl, 'PNG', 22, 169, 22, 22);
                doc.setFont("helvetica", "bold");
                doc.setFontSize(7.5);
                doc.setTextColor(100, 110, 120);
                doc.text("QR Autenticità", 33, 194, { align: 'center' });
                doc.setFont("helvetica", "normal");
                doc.setFontSize(6.0);
                doc.text(reg.ticketCode || ('REG-' + reg.id), 33, 197, { align: 'center' });
              } catch(err) { console.error('Errore inserimento QR nel PDF:', err); }
            }

            doc.setDrawColor(200, 205, 215);
            doc.setLineWidth(0.5);
            doc.line(60, 180, 115, 180);
            doc.line(182, 180, 237, 180);

            // Firme (immagini caricate dal backend) sopra le linee di firma
            const drawSignature = (dataUrl, centerX) => {
              if (!dataUrl) return;
              try {
                const props = doc.getImageProperties(dataUrl);
                const maxW = 50, maxH = 16;
                const ratio = Math.min(maxW / props.width, maxH / props.height);
                const w = props.width * ratio;
                const h = props.height * ratio;
                doc.addImage(dataUrl, 'PNG', centerX - w / 2, 179 - h, w, h);
              } catch (err) { console.error('Errore inserimento firma:', err); }
            };
            const speakerSigKey = Object.keys((signatures && signatures.speakers) || {}).find(k => k.trim().toLowerCase() === String(courseSpeaker).trim().toLowerCase());
            drawSignature(speakerSigKey ? signatures.speakers[speakerSigKey] : null, 87.5);
            drawSignature(signatures && signatures.company, 209.5);
            
            doc.setFont("helvetica", "normal");
            doc.setFontSize(8.5);
            doc.setTextColor(80, 90, 105);
            doc.text("Il Relatore", 87.5, 185, { align: 'center' });
            doc.text("Azienda erogatrice del corso:", 209.5, 185, { align: 'center' });

            doc.setFont("helvetica", "bold");
            doc.setFontSize(10);
            doc.setTextColor(r, g, b);
            doc.text(courseSpeaker, 87.5, 190, { align: 'center' });
            doc.text(companyName, 209.5, 190, { align: 'center' });

            if (mode === 'save') {
              const safeName = (reg.fullName || 'partecipante').replace(/[^A-Za-z0-9]+/g, '_');
              doc.save('Attestato_' + safeName + '.pdf');
            } else {
              const pdfOutput = doc.output('bloburl');
              window.open(pdfOutput, '_blank');
            }
          };

          // QR generato localmente (niente rete, niente problemi CORS)
          // Il QR rimanda alla pagina di verifica che controlla l'iscrizione nel database
          const baseUrl = window.location.href.split(/[?#]/)[0];
          const qrText = `${baseUrl}?verifica=${encodeURIComponent(reg.ticketCode || ('REG-' + reg.id))}`;
          let qrDataUrl = null;
          try {
            const qr = qrcode(0, 'M');
            qr.addData(qrText);
            qr.make();
            const count = qr.getModuleCount();
            const cell = 8, margin = 4;
            const size = (count + margin * 2) * cell;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, size, size);
            ctx.fillStyle = '#000000';
            for (let row = 0; row < count; row++) {
              for (let col = 0; col < count; col++) {
                if (qr.isDark(row, col)) ctx.fillRect((col + margin) * cell, (row + margin) * cell, cell, cell);
              }
            }
            qrDataUrl = canvas.toDataURL('image/png');
          } catch (err) {
            console.error('Errore generazione QR attestato:', err);
          }

          if (brandCertBg) {
            const certImg = new Image();
            certImg.crossOrigin = 'Anonymous';
            certImg.src = brandCertBg;
            certImg.onload = () => {
              try {
                const canvasBg = document.createElement('canvas');
                canvasBg.width = certImg.width;
                canvasBg.height = certImg.height;
                canvasBg.getContext('2d').drawImage(certImg, 0, 0);
                generateCertPdfContent(canvasBg.toDataURL('image/jpeg'), qrDataUrl);
              } catch (err) {
                console.error('Errore sfondo attestato:', err);
                generateCertPdfContent(null, qrDataUrl);
              }
            };
            certImg.onerror = () => generateCertPdfContent(null, qrDataUrl);
          } else {
            generateCertPdfContent(null, qrDataUrl);
          }
        }

      // Campo per firmare con il mouse (o con il dito / penna su tablet e telefono).
      // Salva la firma come PNG trasparente, ritagliato sul tratto e ridimensionato (max 500x200 px).
      function SignaturePad({ onSave, onCancel }) {
        const canvasRef = useRef(null);
        const drawingRef = useRef(false);
        const lastRef = useRef(null);
        const midRef = useRef(null);
        const [hasInk, setHasInk] = useState(false);

        useEffect(() => {
          const ctx = canvasRef.current.getContext('2d');
          ctx.lineWidth = 4;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = '#0b1f4d';
        }, []);

        const getPoint = (e) => {
          const canvas = canvasRef.current;
          const rect = canvas.getBoundingClientRect();
          return {
            x: (e.clientX - rect.left) * (canvas.width / rect.width),
            y: (e.clientY - rect.top) * (canvas.height / rect.height)
          };
        };

        const handleDown = (e) => {
          e.preventDefault();
          const canvas = canvasRef.current;
          canvas.setPointerCapture(e.pointerId);
          drawingRef.current = true;
          const pt = getPoint(e);
          lastRef.current = pt;
          midRef.current = pt;
          const ctx = canvas.getContext('2d');
          ctx.beginPath();
          ctx.moveTo(pt.x, pt.y);
          ctx.lineTo(pt.x + 0.01, pt.y);
          ctx.stroke();
          setHasInk(true);
        };

        const handleMove = (e) => {
          if (!drawingRef.current) return;
          e.preventDefault();
          const ctx = canvasRef.current.getContext('2d');
          const pt = getPoint(e);
          const last = lastRef.current;
          const mid = { x: (last.x + pt.x) / 2, y: (last.y + pt.y) / 2 };
          ctx.beginPath();
          ctx.moveTo(midRef.current.x, midRef.current.y);
          ctx.quadraticCurveTo(last.x, last.y, mid.x, mid.y);
          ctx.stroke();
          lastRef.current = pt;
          midRef.current = mid;
        };

        const handleUp = () => { drawingRef.current = false; };

        const handleClear = () => {
          const canvas = canvasRef.current;
          canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
          setHasInk(false);
        };

        const handleSave = () => {
          const canvas = canvasRef.current;
          const w = canvas.width, h = canvas.height;
          const data = canvas.getContext('2d').getImageData(0, 0, w, h).data;
          let minX = w, minY = h, maxX = 0, maxY = 0;
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              if (data[(y * w + x) * 4 + 3] > 10) {
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
              }
            }
          }
          if (maxX <= minX && maxY <= minY) return;
          const margin = 12;
          minX = Math.max(0, minX - margin);
          minY = Math.max(0, minY - margin);
          maxX = Math.min(w - 1, maxX + margin);
          maxY = Math.min(h - 1, maxY + margin);
          const cw = maxX - minX + 1;
          const ch = maxY - minY + 1;
          const ratio = Math.min(1, 500 / cw, 200 / ch);
          const out = document.createElement('canvas');
          out.width = Math.max(1, Math.round(cw * ratio));
          out.height = Math.max(1, Math.round(ch * ratio));
          out.getContext('2d').drawImage(canvas, minX, minY, cw, ch, 0, 0, out.width, out.height);
          onSave(out.toDataURL('image/png'));
        };

        return (
          <div className="mt-3 space-y-2 max-w-xl">
            <div className="relative">
              <canvas
                ref={canvasRef}
                width={1000}
                height={400}
                onPointerDown={handleDown}
                onPointerMove={handleMove}
                onPointerUp={handleUp}
                onPointerCancel={handleUp}
                style={{ touchAction: 'none' }}
                className="w-full h-auto bg-white border-2 border-dashed border-slate-300 rounded-xl cursor-crosshair"
              />
              <div className="absolute left-4 right-4 bottom-[22%] border-t border-slate-200 pointer-events-none"></div>
              {!hasInk && (
                <span className="absolute inset-0 flex items-center justify-center text-xs text-slate-300 font-semibold pointer-events-none">Firma qui con il mouse o con il dito</span>
              )}
            </div>
            <div className="flex gap-2 flex-wrap">
              <button type="button" onClick={handleSave} disabled={!hasInk} className="bg-emerald-600 hover:bg-emerald-700 disabled:opacity-40 text-white font-bold px-4 py-1.5 rounded-lg text-xs">✓ Salva firma</button>
              <button type="button" onClick={handleClear} className="bg-white hover:bg-slate-100 border border-slate-300 text-slate-700 font-bold px-3 py-1.5 rounded-lg text-xs">Cancella</button>
              <button type="button" onClick={onCancel} className="text-xs font-bold text-slate-500 hover:underline px-2">Annulla</button>
            </div>
          </div>
        );
      }

      // ==========================================
      // BADGE PARTECIPANTE con QR code vCard
      // Il QR contiene il contatto (nome, azienda, telefono, email, città, P.IVA):
      // inquadrandolo con la fotocamera dello smartphone si salva in rubrica.
      // ==========================================
      // Foglio A4 orizzontale diviso in 4 quadranti da 148,5 x 105 mm (un quarto di A4 = formato A6 orizzontale):
      // il badge occupa un quadrante, gli altri riportano retro e argomenti del corso.
      // Orizzontale: quadranti 148,5 x 105 mm su A4 orizzontale. Verticale: quadranti 105 x 148,5 mm su A4 verticale.
      const BADGE_LONG_MM = 148.5;
      const BADGE_SHORT_MM = 105;
      // Margine di sicurezza dai bordi esterni del foglio A4 (la stampante non stampa fino al bordo)
      const BADGE_SAFE_MARGIN_MM = 7;

      function vCardEscape(value) {
        return String(value || '')
          .replace(/\\/g, '\\\\')
          .replace(/\r?\n/g, '\\n')
          .replace(/;/g, '\\;')
          .replace(/,/g, '\\,');
      }

      const SURNAME_PARTICLES = ['de','di','del','della','dello','dei','degli','delle','da','dal','dalla','dai','lo','la','le','li','van','von','der','den','mc','mac','d','dell','dall','san','santa','ben','el','al'];
      // Solo per le vecchie iscrizioni senza campi separati: divisione "a intuito"
      function splitFullName(fullName) {
        const parts = (fullName || '').trim().replace(/\s+/g, ' ').split(' ').filter(Boolean);
        if (parts.length <= 1) return { firstName: '', lastName: parts[0] || '' };
        let i = parts.length - 1;
        while (i > 1 && SURNAME_PARTICLES.includes(parts[i - 1].toLowerCase().replace(/['’]$/, ''))) i--;
        return { firstName: parts.slice(0, i).join(' '), lastName: parts.slice(i).join(' ') };
      }
      // Nome/cognome reali se presenti, altrimenti divisione automatica
      function regNames(r) {
        if (r && (r.lastName || r.firstName)) return { firstName: r.firstName || '', lastName: r.lastName || '' };
        return splitFullName(r && r.fullName);
      }

      function buildVCard(reg) {
        const fullName = (reg.fullName || '').trim().replace(/\s+/g, ' ');
        const nm = regNames(reg);
        const family = nm.lastName;
        const given = nm.firstName;
        const phone = (reg.phone || '').replace(/[^\d+]/g, '');
        const lines = [
          'BEGIN:VCARD',
          'VERSION:3.0',
          `N:${vCardEscape(family)};${vCardEscape(given)};;;`,
          `FN:${vCardEscape(fullName)}`
        ];
        if (reg.company) lines.push(`ORG:${vCardEscape(reg.company)}`);
        if (phone) lines.push(`TEL;TYPE=CELL:${phone}`);
        if (reg.email) lines.push(`EMAIL;TYPE=WORK:${vCardEscape(reg.email)}`);
        if (reg.city) lines.push(`ADR;TYPE=WORK:;;;${vCardEscape(reg.city)};;;`);
        if (reg.vatNumber) lines.push(`NOTE:P.IVA ${vCardEscape(reg.vatNumber)}`);
        lines.push('END:VCARD');
        return lines.join('\n');
      }

      // QR come immagine PNG (matrice disegnata su canvas). Testo codificato in UTF-8 (accenti corretti).
      function qrPngDataUrl(text, rotate180 = false) {
        if (window.qrcode) {
          try { window.qrcode.stringToBytes = (str) => Array.from(new TextEncoder().encode(str)); } catch (e) {}
        }
        const qr = qrcode(0, 'M');
        qr.addData(text);
        qr.make();
        const count = qr.getModuleCount();
        const cell = 8, margin = 3;
        const size = (count + margin * 2) * cell;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        if (rotate180) { ctx.translate(size, size); ctx.rotate(Math.PI); }
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = '#000000';
        for (let row = 0; row < count; row++) {
          for (let col = 0; col < count; col++) {
            if (qr.isDark(row, col)) ctx.fillRect((col + margin) * cell, (row + margin) * cell, cell, cell);
          }
        }
        return canvas.toDataURL('image/png');
      }

      // Argomenti del corso: converte la descrizione (HTML) in righe di testo
      function courseDescriptionToLines(html) {
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = html || '';
        const lines = [];
        const walk = (node) => {
          if (node.nodeType === Node.TEXT_NODE) {
            const text = node.textContent.trim();
            if (text) lines.push(text);
          } else if (node.nodeType === Node.ELEMENT_NODE) {
            if (node.nodeName === 'LI') {
              const t = node.textContent.trim();
              if (t) lines.push('• ' + t);
            } else if (node.nodeName !== 'BR') {
              node.childNodes.forEach(walk);
            }
          }
        };
        tempDiv.childNodes.forEach(walk);
        return lines;
      }

      // Luogo dell'evento oppure, se è un link, "Online · Google Meet"
      function badgeLocationText(course) {
        const raw = String((course && course.location) || '').trim();
        if (!raw) return '';
        if (/^https?:\/\//i.test(raw)) {
          try {
            const host = new URL(raw).hostname.replace(/^www\./, '');
            return host.includes('meet.google') ? 'Online · Google Meet' : 'Online · ' + host;
          } catch (e) {
            return 'Online';
          }
        }
        return 'Sede: ' + raw;
      }

      // ==========================================
      // MAPPA E INDICAZIONI STRADALI (solo corsi in presenza)
      // Mappa: OpenStreetMap (nessuna chiave necessaria). QR: apre Google Maps con il percorso fino alla sede.
      // ==========================================
      function isInPersonCourse(course) {
        if (!course) return false;
        const loc = String(course.location || '').trim();
        if (!loc || /^https?:\/\//i.test(loc)) return false;
        return !String(course.modality || '').toLowerCase().includes('meet');
      }

      // "CEM Security Center SRL Via Bergamo,20 | 24050 Mornico al Serio | (BG)" -> "..., Via Bergamo, 20, 24050 Mornico al Serio, BG"
      function cleanAddressText(raw) {
        return String(raw || '')
          .replace(/\|/g, ',')
          .replace(/[()]/g, '')
          .replace(/\s*,\s*/g, ', ')
          .replace(/(,\s*)+/g, ', ')
          .replace(/\s+/g, ' ')
          .replace(/^,\s*|,\s*$/g, '')
          .trim();
      }

      // Toglie il nome dell'azienda davanti all'indirizzo (parte da "Via", "Viale", "Piazza"...)
      function streetPartOf(raw) {
        const cleaned = cleanAddressText(raw);
        const m = cleaned.match(/\b(via|viale|piazza|piazzale|corso|strada|largo|vicolo|loc\.|località)\b.*/i);
        return m ? m[0] : cleaned;
      }

      function mapsDirectionsUrl(raw) {
        return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(streetPartOf(raw));
      }

      async function geocodeAddress(raw) {
        const queries = Array.from(new Set([streetPartOf(raw), cleanAddressText(raw)])).filter(Boolean);
        for (const q of queries) {
          const key = 'geo:' + q;
          try {
            const cached = window.localStorage.getItem(key);
            if (cached) return JSON.parse(cached);
          } catch (e) {}
          try {
            const ctl = new AbortController();
            const timer = setTimeout(() => ctl.abort(), 6000);
            const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q), {
              headers: { 'Accept-Language': 'it' },
              signal: ctl.signal
            });
            clearTimeout(timer);
            if (!res.ok) continue;
            const data = await res.json();
            if (data && data[0]) {
              const point = { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
              try { window.localStorage.setItem(key, JSON.stringify(point)); } catch (e) {}
              return point;
            }
          } catch (e) {
            console.error('Errore geocodifica indirizzo:', e);
          }
        }
        return null;
      }

      function loadImageCors(src) {
        return new Promise((resolve) => {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => resolve(img);
          img.onerror = () => resolve(null);
          img.src = src;
        });
      }

      // Mappa come immagine PNG di wMm x hMm (zoom 16, con segnaposto); null se non disponibile
      async function buildMapImage(raw, wMm, hMm, rotate180) {
        try {
          const point = await geocodeAddress(raw);
          if (!point) return null;
          const zoom = 16;
          const n = Math.pow(2, zoom);
          const latRad = (point.lat * Math.PI) / 180;
          const worldX = ((point.lon + 180) / 360) * n * 256;
          const worldY = ((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2) * n * 256;
          const scale = 6; // pixel per mm
          const cw = Math.min(768, Math.round(wMm * scale));
          const ch = Math.min(768, Math.round(hMm * scale));
          const left = worldX - cw / 2;
          const top = worldY - ch / 2;
          const tx0 = Math.floor(left / 256), tx1 = Math.floor((left + cw) / 256);
          const ty0 = Math.floor(top / 256), ty1 = Math.floor((top + ch) / 256);

          const canvas = document.createElement('canvas');
          canvas.width = cw;
          canvas.height = ch;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#e5e7eb';
          ctx.fillRect(0, 0, cw, ch);

          const jobs = [];
          for (let ty = ty0; ty <= ty1; ty++) {
            for (let tx = tx0; tx <= tx1; tx++) {
              jobs.push(loadImageCors(`https://tile.openstreetmap.org/${zoom}/${tx}/${ty}.png`).then(img => ({ img, tx, ty })));
            }
          }
          const tiles = await Promise.all(jobs);
          let loaded = 0;
          tiles.forEach(({ img, tx, ty }) => {
            if (img) { ctx.drawImage(img, tx * 256 - left, ty * 256 - top); loaded++; }
          });
          if (!loaded) return null;

          // Segnaposto sulla sede
          const cx = cw / 2, cy = ch / 2;
          ctx.fillStyle = '#dc2626';
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(cx, cy - 17, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(cx - 7, cy - 9); ctx.lineTo(cx, cy); ctx.lineTo(cx + 7, cy - 9); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.arc(cx, cy - 17, 4, 0, Math.PI * 2); ctx.fill();

          // Attribuzione obbligatoria OpenStreetMap
          ctx.font = '11px Arial';
          const attr = '© OpenStreetMap contributors';
          const aw = ctx.measureText(attr).width + 8;
          ctx.fillStyle = 'rgba(255,255,255,0.85)';
          ctx.fillRect(cw - aw, ch - 16, aw, 16);
          ctx.fillStyle = '#374151';
          ctx.fillText(attr, cw - aw + 4, ch - 4);

          let out = canvas;
          if (rotate180) {
            out = document.createElement('canvas');
            out.width = cw;
            out.height = ch;
            const octx = out.getContext('2d');
            octx.translate(cw, ch);
            octx.rotate(Math.PI);
            octx.drawImage(canvas, 0, 0);
          }
          return out.toDataURL('image/png');
        } catch (err) {
          console.error('Errore creazione mappa:', err);
          return null;
        }
      }

      async function buildBadgePdf(reg, { brands, companyName, course, mode = 'open', orientation = 'landscape', targetWin = null }) {
        const { jsPDF } = window.jspdf;
        const portrait = orientation === 'portrait';
        const QW = portrait ? BADGE_SHORT_MM : BADGE_LONG_MM;
        const QH = portrait ? BADGE_LONG_MM : BADGE_SHORT_MM;
        const SAFE = BADGE_SAFE_MARGIN_MM;
        const PT = 0.3528; // 1 punto tipografico in mm
        const doc = new jsPDF({ orientation: portrait ? 'portrait' : 'landscape', unit: 'mm', format: 'a4' });

        const c = course || {};
        const courseTitle = c.title || reg.courseTitle || '';
        const courseDate = c.date || reg.date || '';
        const speaker = c.speaker || (course ? 'Ermanno Zanardi' : '');
        const locationText = badgeLocationText(c);

        const brandObj = (brands || []).find(b => b.name === reg.brandName);
        const hex = (brandObj && brandObj.color) || '#1b365d';
        const rgb = /^#[0-9a-f]{6}$/i.test(hex) ? hex.replace('#', '').match(/.{2}/g).map(h => parseInt(h, 16)) : [27, 54, 93];

        // Quadrante = zona del foglio con il proprio "sistema di lettura" (u verso destra, v verso il basso).
        // I lati che coincidono con il bordo esterno dell'A4 vengono rientrati di SAFE mm:
        // fasce colorate e testi restano dentro l'area stampabile.
        const mkQuad = (x, y, rot) => {
          const pl = x === 0 ? SAFE : 0;
          const pr = x + QW >= QW * 2 ? SAFE : 0;
          const pt = y === 0 ? SAFE : 0;
          const pb = y + QH >= QH * 2 ? SAFE : 0;
          const l = rot ? pr : pl;
          const r = rot ? pl : pr;
          const t = rot ? pb : pt;
          const b = rot ? pt : pb;
          return { x, y, rot, l, t, w: QW - l - r, h: QH - t - b };
        };
        // Badge in alto a destra, retro in alto a sinistra.
        // Le due pagine interne (in basso) sono ruotate di 180° così, piegando il foglio, si leggono dritte.
        const Q = {
          badge:   mkQuad(QW, 0, false),
          back:    mkQuad(0, 0, false),
          inLeft:  mkQuad(QW, QH, true),
          inRight: mkQuad(0, QH, true)
        };
        const px = (q, U) => (q.rot ? q.x + QW - U : q.x + U);
        const py = (q, V) => (q.rot ? q.y + QH - V : q.y + V);

        const txt = (q, str, u, v, o = {}) => {
          const { size = 10, style = 'normal', color = [20, 30, 50], align = 'left', font = 'helvetica' } = o;
          doc.setFont(font, style);
          doc.setFontSize(size);
          doc.setTextColor(color[0], color[1], color[2]);
          let uu = u;
          if (align === 'right') uu = u - doc.getTextWidth(str);
          else if (align === 'center') uu = u - doc.getTextWidth(str) / 2;
          if (q.rot) doc.text(str, px(q, q.l + uu), py(q, q.t + v), { angle: 180 });
          else doc.text(str, px(q, q.l + uu), py(q, q.t + v));
        };
        const rect = (q, u, v, w, h, fill) => {
          doc.setFillColor(fill[0], fill[1], fill[2]);
          const x1 = px(q, q.l + u), x2 = px(q, q.l + u + w);
          const y1 = py(q, q.t + v), y2 = py(q, q.t + v + h);
          doc.rect(Math.min(x1, x2), Math.min(y1, y2), w, h, 'F');
        };
        const line = (q, u1, v1, u2, v2, color) => {
          doc.setDrawColor(color[0], color[1], color[2]);
          doc.setLineWidth(0.2);
          doc.line(px(q, q.l + u1), py(q, q.t + v1), px(q, q.l + u2), py(q, q.t + v2));
        };

        // Linee tratteggiate di piegatura
        doc.setDrawColor(185, 190, 200);
        doc.setLineWidth(0.2);
        doc.setLineDashPattern([1.5, 1.5], 0);
        doc.line(QW, 0, QW, QH * 2);
        doc.line(0, QH, QW * 2, QH);
        doc.setLineDashPattern([], 0);

        const M = 8;
        const GRAY = [90, 100, 115];
        const DARK = [20, 30, 50];

        // ================= BADGE (quadrante in alto a destra) =================
        const qb = Q.badge;
        const BW = qb.w;
        const BH = qb.h;
        rect(qb, 0, 0, BW, 17, rgb);
        txt(qb, String(reg.brandName || 'CORSO').toUpperCase(), M, 11.2, { size: 15, style: 'bold', color: [255, 255, 255] });
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8);
        const orgShort = doc.splitTextToSize(String(companyName || ''), 70)[0] || '';
        txt(qb, orgShort, BW - M, 10.8, { size: 8, color: [255, 255, 255], align: 'right' });

        const hasQr = !!reg.shareContact; // QR contatto solo se il partecipante ha dato il consenso
        const qrSize = 34;
        // Orizzontale: QR a destra del testo. Verticale: QR sotto il testo, centrato.
        const qrX = portrait ? (BW - qrSize) / 2 : BW - M - qrSize;
        const leftW = (hasQr && !portrait) ? qrX - M - 5 : BW - 2 * M;

        // Piè di pagina: luogo dell'evento o Meet
        let footLines = [];
        if (locationText) {
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(9);
          footLines = doc.splitTextToSize(locationText, BW - 2 * M).slice(0, 2);
        }
        const footLH = 4;
        const footLineV = footLines.length ? BH - 6 - (footLines.length - 1) * footLH - 5 : BH - 8;
        if (footLines.length) {
          line(qb, M, footLineV, BW - M, footLineV, [215, 220, 228]);
          footLines.forEach((l, i) => {
            txt(qb, l, M, BH - 6 - (footLines.length - 1 - i) * footLH, { size: 9, color: GRAY });
          });
        }

        // Testi a sinistra: nome, azienda, data + titolo (grassetto), relatore
        const topV = 22;
        const qrBlockH = (hasQr && portrait) ? qrSize + 9 : 0;
        const qrPortraitV = footLineV - 3 - qrBlockH;
        const avail = (qrBlockH ? qrPortraitV - 3 : footLineV - 3) - topV;

        const buildBlocks = (nameSize) => {
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(nameSize);
          const nameLines = doc.splitTextToSize((reg.fullName || '').trim(), leftW);
          const nameTooWide = nameLines.some(l => doc.getTextWidth(l) > leftW);
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(14);
          const compLines = doc.splitTextToSize(String(reg.company || ''), leftW).slice(0, 2);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(11);
          const titleLines = doc.splitTextToSize(`${courseDate}${courseDate && courseTitle ? ' · ' : ''}${courseTitle}`, leftW).slice(0, 3);
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(10);
          const speakerLines = speaker ? doc.splitTextToSize(`Relatore: ${speaker}`, leftW).slice(0, 2) : [];
          const lhName = nameSize * PT * 1.15;
          const total =
            nameLines.length * lhName + 3 +
            compLines.length * 14 * PT * 1.2 + 4 +
            titleLines.length * 11 * PT * 1.2 + (speakerLines.length ? 2.5 + speakerLines.length * 10 * PT * 1.25 : 0);
          return { nameLines, nameTooWide, compLines, titleLines, speakerLines, lhName, total };
        };

        let nameSize = 30;
        let blk = buildBlocks(nameSize);
        while ((blk.nameLines.length > 2 || blk.nameTooWide || blk.total > avail) && nameSize > 14) {
          nameSize -= 1;
          blk = buildBlocks(nameSize);
        }

        let v = topV + Math.max(0, (avail - blk.total) / 2);
        blk.nameLines.forEach(l => {
          txt(qb, l, M, v + nameSize * PT * 0.82, { size: nameSize, style: 'bold', color: DARK });
          v += blk.lhName;
        });
        v += 3;
        blk.compLines.forEach(l => {
          txt(qb, l, M, v + 14 * PT * 0.82, { size: 14, color: GRAY });
          v += 14 * PT * 1.2;
        });
        v += 4;
        blk.titleLines.forEach(l => {
          txt(qb, l, M, v + 11 * PT * 0.82, { size: 11, style: 'bold', color: DARK });
          v += 11 * PT * 1.2;
        });
        if (blk.speakerLines.length) {
          v += 2.5;
          blk.speakerLines.forEach(l => {
            txt(qb, l, M, v + 10 * PT * 0.82, { size: 10, color: GRAY });
            v += 10 * PT * 1.25;
          });
        }

        // QR code contatto (solo con consenso)
        if (hasQr) try {
          const qrUrl = qrPngDataUrl(buildVCard(reg));
          const qrV = portrait ? qrPortraitV : 24;
          doc.addImage(qrUrl, 'PNG', qb.x + qb.l + qrX, qb.y + qb.t + qrV, qrSize, qrSize);
          txt(qb, 'Inquadra con la fotocamera', qrX + qrSize / 2, qrV + qrSize + 4, { size: 6.5, style: 'bold', color: GRAY, align: 'center' });
          txt(qb, 'per salvare il contatto', qrX + qrSize / 2, qrV + qrSize + 7, { size: 6.5, style: 'bold', color: GRAY, align: 'center' });
        } catch (err) {
          console.error('Errore QR badge:', err);
        }

        // ================= RETRO (quadrante in alto a sinistra): informazioni sul corso =================
        const qk = Q.back;
        const KW = qk.w;
        const KH = qk.h;
        rect(qk, 0, 0, KW, 10, rgb);
        txt(qk, 'INFORMAZIONI SUL CORSO', M, 6.9, { size: 10, style: 'bold', color: [255, 255, 255] });

        // QR con il codice ticket per il check-in in segreteria
        const ticketCode = reg.ticketCode || ('REG-' + reg.id);
        const ckSize = 36;
        // Orizzontale: QR in alto a destra. Verticale: QR in basso, centrato.
        const ckX = portrait ? (KW - ckSize) / 2 : KW - M - ckSize;
        const ckV = portrait ? KH - 16 - 8.2 - ckSize : 15;
        const infoW = portrait ? KW - 2 * M : ckX - M - 5;
        try {
          const ckUrl = qrPngDataUrl(ticketCode);
          doc.addImage(ckUrl, 'PNG', qk.x + qk.l + ckX, qk.y + qk.t + ckV, ckSize, ckSize);
          txt(qk, 'CHECK-IN SEGRETERIA', ckX + ckSize / 2, ckV + ckSize + 4, { size: 7, style: 'bold', color: DARK, align: 'center' });
          txt(qk, ticketCode, ckX + ckSize / 2, ckV + ckSize + 8.2, { size: 7, style: 'bold', color: GRAY, align: 'center', font: 'courier' });
        } catch (err) {
          console.error('Errore QR check-in:', err);
        }

        let kv = 17;
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(13);
        doc.splitTextToSize(courseTitle, infoW).slice(0, 3).forEach(l => {
          txt(qk, l, M, kv + 13 * PT * 0.82, { size: 13, style: 'bold', color: DARK });
          kv += 13 * PT * 1.2;
        });
        kv += 3;
        const infoRows = [
          courseDate ? `Data: ${courseDate}${c.time ? '  ·  Orario: ' + c.time : ''}` : '',
          c.duration ? `Durata: ${c.duration}` : '',
          c.modality ? `Modalità: ${c.modality}` : '',
          locationText,
          speaker ? `Relatore: ${speaker}` : '',
          `Organizzato da: ${companyName || ''}`
        ].filter(Boolean);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);
        infoRows.forEach(r => {
          doc.splitTextToSize(r, infoW).slice(0, 2).forEach(l => {
            txt(qk, l, M, kv + 10 * PT * 0.82, { size: 10, color: DARK });
            kv += 10 * PT * 1.35;
          });
          kv += 1.2;
        });
        txt(qk, 'Argomenti del corso all\'interno', M, KH - 6, { size: 8, style: 'bold', color: GRAY });

        // ================= PAGINE INTERNE (in basso, ruotate): argomenti del corso + mappa =================
        const showMap = isInPersonCourse(c);
        const topicsRaw = courseDescriptionToLines(c.description);
        const topics = topicsRaw.length ? topicsRaw : ['Argomenti del corso non ancora disponibili.'];
        const IM = 10;
        const IW = Q.inLeft.w;
        const IH = Q.inLeft.h;
        const contentTop = 17;
        const contentH = IH - contentTop - 9;
        // Se c'è la mappa, gli argomenti stanno tutti nella prima pagina interna
        const topicPages = showMap ? 1 : 2;
        let topicSize = 10;
        let wrapped = [];
        let perPage = 1;
        for (; topicSize >= 6.5; topicSize -= 0.5) {
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(topicSize);
          wrapped = [];
          topics.forEach(t => { wrapped = wrapped.concat(doc.splitTextToSize(t, IW - 2 * IM)); });
          perPage = Math.floor(contentH / (topicSize * PT * 1.3));
          if (wrapped.length <= perPage * topicPages) break;
        }
        if (wrapped.length > perPage * topicPages) {
          wrapped = wrapped.slice(0, perPage * topicPages);
          wrapped[wrapped.length - 1] = wrapped[wrapped.length - 1].replace(/\s*$/, '') + ' …';
        }
        const topicLH = topicSize * PT * 1.3;

        const drawTopicPage = (q, lines, title) => {
          rect(q, 0, 0, q.w, 10, rgb);
          txt(q, title, IM, 6.9, { size: 10, style: 'bold', color: [255, 255, 255] });
          lines.forEach((l, i) => {
            txt(q, l, IM, contentTop + i * topicLH + topicSize * PT * 0.82, { size: topicSize, color: DARK });
          });
          txt(q, String(companyName || ''), IM, q.h - 4, { size: 7, color: GRAY });
        };
        drawTopicPage(Q.inLeft, wrapped.slice(0, perPage), 'ARGOMENTI DEL CORSO');
        if (!showMap && wrapped.length > perPage) {
          drawTopicPage(Q.inRight, wrapped.slice(perPage), 'ARGOMENTI DEL CORSO (segue)');
        }

        // Pagina "Come raggiungerci": mappa + QR Google Maps + indicazioni (pagina interna di destra)
        if (showMap) {
          const qm = Q.inRight;
          const MW = qm.w;
          const MH = qm.h;
          // Immagine in coordinate pagina: le pagine interne sono ruotate di 180°, quindi anche le immagini lo sono
          const putImage = (dataUrl, u, v, w, h) => {
            const x1 = px(qm, qm.l + u), x2 = px(qm, qm.l + u + w);
            const y1 = py(qm, qm.t + v), y2 = py(qm, qm.t + v + h);
            doc.addImage(dataUrl, 'PNG', Math.min(x1, x2), Math.min(y1, y2), w, h);
          };

          rect(qm, 0, 0, MW, 10, rgb);
          txt(qm, 'COME RAGGIUNGERCI', IM, 6.9, { size: 10, style: 'bold', color: [255, 255, 255] });

          const qrM = 34;
          let mapU = IM, mapV = 16, mapW, mapH, qrU, qrV, textV;
          if (portrait) {
            mapW = MW - 2 * IM; mapH = 56;
            qrU = IM; qrV = mapV + mapH + 5;
            textV = qrV + qrM + 5;
          } else {
            mapW = MW - 2 * IM - qrM - 6; mapH = 52;
            qrU = MW - IM - qrM; qrV = mapV;
            textV = mapV + mapH + 5;
          }

          const mapDataUrl = await buildMapImage(c.location, mapW, mapH, true);
          if (mapDataUrl) {
            try { putImage(mapDataUrl, mapU, mapV, mapW, mapH); } catch (err) { console.error('Errore mappa nel PDF:', err); }
          } else {
            rect(qm, mapU, mapV, mapW, mapH, [236, 238, 242]);
            txt(qm, 'Mappa non disponibile: usa il QR code', mapU + mapW / 2, mapV + mapH / 2, { size: 8, color: GRAY, align: 'center' });
          }

          try {
            putImage(qrPngDataUrl(mapsDirectionsUrl(c.location), true), qrU, qrV, qrM, qrM);
          } catch (err) { console.error('Errore QR mappe:', err); }

          // Didascalia del QR
          if (portrait) {
            const capW = MW - IM - (qrU + qrM + 4) ;
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(8);
            const cap = doc.splitTextToSize('Inquadra il QR con la fotocamera: Google Maps ti guida fino alla sede', capW);
            cap.forEach((l, i) => txt(qm, l, qrU + qrM + 4, qrV + 6 + i * 3.8, { size: 8, style: 'bold', color: DARK }));
          } else {
            txt(qm, 'Inquadra con la fotocamera', qrU + qrM / 2, qrV + qrM + 4, { size: 6.5, style: 'bold', color: GRAY, align: 'center' });
            txt(qm, 'per aprire Google Maps', qrU + qrM / 2, qrV + qrM + 7, { size: 6.5, style: 'bold', color: GRAY, align: 'center' });
          }

          // Indirizzo e indicazioni
          const addr = cleanAddressText(c.location);
          const howTo = String(c.directions || '').trim() ||
            'Inquadra il QR code: Google Maps calcola il percorso dalla tua posizione, in auto, con i mezzi pubblici o a piedi.';
          const textW = MW - 2 * IM;
          const lhS = 8 * PT * 1.35;
          const room = Math.max(1, Math.floor((MH - 8 - textV) / lhS));
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(8);
          const addrLines = doc.splitTextToSize('Sede: ' + addr, textW).slice(0, 2);
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(8);
          const howLines = doc.splitTextToSize(howTo, textW);
          const maxHow = Math.max(0, room - addrLines.length);
          let shownHow = howLines.slice(0, maxHow);
          if (howLines.length > maxHow && shownHow.length) {
            shownHow[shownHow.length - 1] = shownHow[shownHow.length - 1].replace(/\s*$/, '') + ' …';
          }
          let tv = textV;
          addrLines.forEach(l => { txt(qm, l, IM, tv + 8 * PT * 0.82, { size: 8, style: 'bold', color: DARK }); tv += lhS; });
          shownHow.forEach(l => { txt(qm, l, IM, tv + 8 * PT * 0.82, { size: 8, color: GRAY }); tv += lhS; });
          txt(qm, String(companyName || ''), IM, MH - 4, { size: 7, color: GRAY });
        }

        if (mode === 'save') {
          // Download diretto (link pubblico / dopo l'iscrizione)
          const safeName = (reg.fullName || 'partecipante').replace(/[^A-Za-z0-9]+/g, '_');
          doc.save('Badge_' + safeName + '.pdf');
        } else {
          // Apre il PDF con la finestra di stampa (segreteria)
          doc.autoPrint();
          const blobUrl = doc.output('bloburl');
          if (targetWin && !targetWin.closed) targetWin.location.href = blobUrl;
          else window.open(blobUrl, '_blank');
        }
      }

        // Helper per verificare se la data del corso è antecedente a quella odierna
        // Converte il testo della data del corso in un oggetto Date (null se non riconosciuta)
        const parseCourseDate = (dateString) => {
          if (!dateString) return null;
          try {
            const months = {
              gen: 0, gennaio: 0,
              feb: 1, febbraio: 1,
              mar: 2, marzo: 2,
              apr: 3, aprile: 3,
              mag: 4, maggio: 4,
              giu: 5, giugno: 5,
              lug: 6, luglio: 6,
              ago: 7, agosto: 7,
              set: 8, settembre: 8,
              ott: 9, ottobre: 9,
              nov: 10, novembre: 10,
              dic: 11, dicembre: 11
            };

            const cleanStr = dateString.toLowerCase();

            // Formato numerico: 19/11/2026, 19-11-2026, 19.11.2026
            // (con più giorni, es. "19-20/11/2026", vale la prima data completa trovata)
            const numericMatch = cleanStr.match(/(?:^|\D)(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})(?!\d)/);
            if (numericMatch) {
              const nDay = parseInt(numericMatch[1], 10);
              const nMonth = parseInt(numericMatch[2], 10);
              const nYear = parseInt(numericMatch[3], 10);
              if (nMonth >= 1 && nMonth <= 12 && nDay >= 1 && nDay <= 31) {
                return new Date(nYear, nMonth - 1, nDay);
              }
            }

            const words = cleanStr.replace(/[^a-z0-9]/g, ' ').split(/\s+/).filter(Boolean);

            let day = null;
            let month = null;
            let year = 2026;

            for (let i = 0; i < words.length; i++) {
              const w = words[i];
              if (!isNaN(w)) {
                const num = parseInt(w, 10);
                if (num > 31 && num >= 2000) {
                  year = num;
                } else if (num >= 1 && num <= 31 && !day) {
                  day = num;
                }
              } else {
                for (let key in months) {
                  if (w.startsWith(key)) {
                    month = months[key];
                    break;
                  }
                }
              }
            }

            if (day !== null && month !== null) {
              return new Date(year, month, day);
            }
          } catch (e) {
            console.error("Errore parsing data corso:", e);
          }
          return null;
        };

          const mm = t ? t[2] : '00';
          const yy = String(d.getFullYear()).slice(-2);
          return `${yy}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}_${hh}${mm}`;

            let parent = range.commonAncestorContainer;
            while (parent && parent !== editorRef.current) {
              if (parent.nodeName === 'UL' || parent.nodeName === 'OL') {
                document.execCommand('insertUnorderedList', false, null);
                if (editorRef.current) {
                  setNewCourseData({ ...newCourseData, description: editorRef.current.innerHTML });
                }
                return;
              }
              parent = parent.parentNode;
            }

            const ul = document.createElement('ul');
            ul.style.listStyleType = 'disc';
            ul.style.paddingLeft = '20px';
            
            if (range.collapsed) {
              const li = document.createElement('li');
              li.innerHTML = '<br>';
              ul.appendChild(li);
              range.insertNode(ul);
              range.setStart(li, 0);
              range.collapse(true);
              selection.removeAllRanges();
              selection.addRange(range);
            } else {
              document.execCommand('insertUnorderedList', false, null);

        const handleDownloadLocandina = (course) => {
          const { jsPDF } = window.jspdf;

          const brandColorHex = brandObj?.color || '#1b365d';
          const brandPosterBg = brandObj?.posterBgUrl || '';

          const hexToRgb = (hex) => {
            let c = hex.replace('#','');
            if(c.length === 3) c = c.split('').map(x => x + x).join('');
            const num = parseInt(c, 16);
            return [num >> 16, (num >> 8) & 255, num & 255];
          };
          const [r, g, b] = hexToRgb(brandColorHex);

          const generatePdfContent = (bgImgData, logoImgData) => {
            if (bgImgData) {
              try {
                doc.addImage(bgImgData, 'JPEG', 0, 0, 210, 297);
              } catch (e) {}

            }

            if (logoImgData && !bgImgData) {
              try {
                doc.addImage(logoImgData, 'PNG', 155, 8, 40, 25);
              } catch (e) {}
            }

            if (bgImgData) {

              doc.text(course.modality || 'N/D', 130, 195);
              doc.text(course.level || 'Base', 130, 210);
              doc.text(course.price || 'Gratuito', 130, 225);

              const splitLocation = doc.splitTextToSize(course.location || 'N/D', 65);
              doc.text(splitLocation, 130, 140);
              
              doc.setFontSize(10);
              doc.setFont("helvetica", "bold");
              doc.setTextColor(r, g, b);
              doc.text("DESCRIZIONE DEL CORSO", 20, 134);
              
              doc.setFont("helvetica", "normal");
              doc.setTextColor(30, 41, 59);
              
              const tempDiv = document.createElement("div");
              tempDiv.innerHTML = course.description || 'Nessuna descrizione disponibile.';
              
              const parseHtmlToLines = (element) => {
                let lines = [];
                const walk = (node) => {
                  if (node.nodeType === Node.TEXT_NODE) {
                    const text = node.textContent.trim();
                    if (text) lines.push(text);
                  } else if (node.nodeType === Node.ELEMENT_NODE) {
                    if (node.nodeName === 'LI') {
                      let liText = node.textContent.trim();
                      if (liText) lines.push('• ' + liText);
                    } else if (node.nodeName === 'BR') {
                      lines.push('');
                    } else {
                      for (let child of node.childNodes) {
                        walk(child);
                      }
                    }
                  }
                };
                for (let child of element.childNodes) {
                  walk(child);
                }
                return lines;
              };

              const rawLines = parseHtmlToLines(tempDiv);
              let formattedTextArray = [];
              
              rawLines.forEach(line => {
                if (line === '') {
                  formattedTextArray.push('');
                } else {
                  const splitLine = doc.splitTextToSize(line, 95);
                  formattedTextArray = formattedTextArray.concat(splitLine);

              });

                doc.text(value || 'N/D', 65, y);
                y += 10;

              doc.text("Descrizione del Corso", 15, y);
              y += 7;

              doc.setFont("helvetica", "normal");
              doc.setFontSize(10);
              doc.setTextColor(71, 85, 105);
              
              const tempDiv = document.createElement("div");
              tempDiv.innerHTML = course.description || 'Nessuna descrizione disponibile.';
              const plainDescription = tempDiv.textContent || tempDiv.innerText || '';
              
              const splitDesc = doc.splitTextToSize(plainDescription, 180);
              doc.text(splitDesc, 15, y);
            }

            const pdfOutput = doc.output('bloburl');
            window.open(pdfOutput, '_blank');
          };

          let loadedBgData = null;
          let loadedLogoData = null;
          let pendingImages = 0;

          const checkAndGenerate = () => {
            if (pendingImages === 0) {
              generatePdfContent(loadedBgData, loadedLogoData);
            }
          };

          if (brandPosterBg) {
            pendingImages++;
            const bgImg = new Image();
            bgImg.crossOrigin = 'Anonymous';
            bgImg.src = brandPosterBg;
            bgImg.onload = () => {
              const canvas = document.createElement('canvas');

              canvas.height = bgImg.height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(bgImg, 0, 0);
              loadedBgData = canvas.toDataURL('image/jpeg');
              pendingImages--;

            bgImg.onerror = () => {

          }

          if (companyLogo) {

            logoImg.onload = () => {
              const canvas = document.createElement('canvas');

        const handleExportCourseAccoglienza = (course, courseRegs) => {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
          const rows = sortBySurname(courseRegs);
          const M = 10, rowH = 7, headH = 8;
          const cols = [
            { t: '#', w: 10 }, { t: 'Cognome', w: 48 }, { t: 'Nome', w: 40 },
            { t: 'Azienda', w: 76 }, { t: 'Telefono', w: 38 }, { t: 'Presenza', w: 30 }, { t: 'Note', w: 35 }
          ];
          const fit = (txt, w) => {
            let t = String(txt || '');
            if (doc.getTextWidth(t) <= w - 3) return t;
            while (t.length > 1 && doc.getTextWidth(t + '…') > w - 3) t = t.slice(0, -1);
            return t + '…';
          };
          const header = (page, pages) => {
            doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(27, 54, 93);
            doc.text(`Accoglienza - ${course.title}`, M, 14);
            doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90);
            const presenti = courseRegs.filter(r => r.isPresent).length;
            doc.text(`${course.date}${course.time ? ' - ' + course.time : ''}   |   Iscritti: ${courseRegs.length}   |   Presenti: ${presenti}   |   Pagina ${page}/${pages}`, M, 19);
            let x = M; const y = 23;
            doc.setFillColor(27, 54, 93); doc.rect(M, y, 277, headH, 'F');
            doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
            cols.forEach(c => { doc.text(c.t, x + 1.5, y + 5.3); x += c.w; });
            return y + headH;
          };
          const perPage = Math.floor((210 - 12 - 31) / rowH);
          const pages = Math.max(1, Math.ceil(rows.length / perPage));
          for (let pg = 0; pg < pages; pg++) {
            if (pg > 0) doc.addPage();
            let y = header(pg + 1, pages);
            rows.slice(pg * perPage, (pg + 1) * perPage).forEach((r, i) => {
              const n = regNames(r);
              if (i % 2 === 1) { doc.setFillColor(243, 246, 250); doc.rect(M, y, 277, rowH, 'F'); }
              doc.setDrawColor(210); doc.setLineWidth(0.1); doc.line(M, y + rowH, M + 277, y + rowH);
              doc.setTextColor(20); doc.setFontSize(9.5);
              let x = M;
              const vals = [String(pg * perPage + i + 1), n.lastName, n.firstName, r.company, r.phone];
              vals.forEach((v, k) => {
                doc.setFont('helvetica', k === 1 ? 'bold' : 'normal');
                doc.text(fit(v, cols[k].w), x + 1.5, y + 4.9);
                x += cols[k].w;
              });
              // casella presenza
              doc.setDrawColor(60); doc.setLineWidth(0.3); doc.rect(x + 2, y + 1.5, 4, 4);
              if (r.isPresent) {
                doc.setDrawColor(22, 120, 60); doc.setLineWidth(0.6);
                doc.line(x + 2.8, y + 3.6, x + 3.8, y + 4.8); doc.line(x + 3.8, y + 4.8, x + 5.6, y + 2.2);
                doc.setTextColor(22, 120, 60); doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5);
                doc.text('Presente' + (r.checkinTime ? '' : ''), x + 8, y + 4.7);

                doc.setTextColor(150); doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
                doc.text('Assente', x + 8, y + 4.7);
              }
              y += rowH;
            });
          }
          doc.save(`accoglienza_${course.title.toLowerCase().replace(/[^a-z0-9]/g, '_').substring(0, 30)}.pdf`);
