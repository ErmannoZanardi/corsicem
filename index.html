  <body class="bg-slate-100 text-slate-800 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // ==========================================
      // CONFIGURAZIONE SUPABASE (Database Cloud)
      // ==========================================
      const SUPABASE_URL = "https://nsfqltisjpjirqoadjnh.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zZnFsdGlzanBqaXJxb2Fkam5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4ODk5NDgsImV4cCI6MjEwNjQ2NTk0OH0.uWIC4REeMSmFC1LbYt7kpZP40CQ4GXbmH_Ct7AkkGFE";

      let supabaseClient = null;
      if (SUPABASE_URL && SUPABASE_URL !== "YOUR_SUPABASE_URL" && window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }

      // ==========================================
      // CODICI TICKET SICURI
      // 12 caratteri casuali (alfabeto senza simboli ambigui 0/O/1/I/L)
      // generati con il generatore crittografico del browser.
      // Formato: TICKET-XXXX-XXXX-XXXX (circa 8 x 10^17 combinazioni)
      // ==========================================
      const TICKET_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';

      function generateSecureTicketCode() {
        const limit = 256 - (256 % TICKET_ALPHABET.length); // evita distorsioni statistiche
        let chars = '';
        while (chars.length < 12) {
          const bytes = new Uint8Array(24);
          window.crypto.getRandomValues(bytes);
          for (const b of bytes) {
            if (b < limit && chars.length < 12) chars += TICKET_ALPHABET[b % TICKET_ALPHABET.length];
          }
        }
        return 'TICKET-' + chars.slice(0, 4) + '-' + chars.slice(4, 8) + '-' + chars.slice(8, 12);
      }

      async function ticketCodeExists(code) {
        if (!supabaseClient) return false;
        try {
          const { data, error } = await supabaseClient.from('registrations').select('id').eq('ticket_code', code).limit(1);
          return !error && data && data.length > 0;
        } catch (err) {
          return false;
        }
      }

      // ==========================================
      // PAGINA PUBBLICA DI VERIFICA AUTENTICITÀ ATTESTATO
      // Si apre scansionando il QR dell'attestato: index.html?verifica=CODICE
      // Interroga il database e mostra solo i dati minimi necessari.
      // ==========================================
      function VerifyPage({ code }) {
        const [state, setState] = useState({ status: 'loading', data: null });
        const [footerText, setFooterText] = useState('');

        // Testo copyright del footer, lo stesso impostato in "Personalizzazione Azienda e Logo"
        useEffect(() => {
          const loadFooter = async () => {
            if (!supabaseClient) return;
            try {
              const { data, error } = await supabaseClient.from('settings').select('value').eq('key', 'copyright_text').limit(1);
              if (!error && data && data[0] && data[0].value) setFooterText(data[0].value);
            } catch (err) {
              console.error('Errore caricamento copyright:', err);
            }
          };
          loadFooter();
        }, []);

        useEffect(() => {
          const run = async () => {
            if (!supabaseClient) {
              setState({ status: 'error', data: null });
              return;
            }
            try {
              const cols = 'full_name, company, course_title, brand_name, date, is_present, checkin_time, ticket_code';
              let query = supabaseClient.from('registrations').select(cols);
              if (/^REG-\d+$/.test(code)) {
                query = query.eq('id', Number(code.replace('REG-', '')));
              } else {
                query = query.eq('ticket_code', code);
              }
              const { data, error } = await query.limit(1);
              if (error) throw error;
              if (!data || data.length === 0) {
                setState({ status: 'invalid', data: null });
              } else {
                setState({ status: 'found', data: data[0] });
              }
            } catch (err) {
              console.error('Errore verifica attestato:', err);
              setState({ status: 'error', data: null });
            }
          };
          run();
        }, [code]);

        const { status, data } = state;
        const authentic = status === 'found' && data.is_present;

        return (
          <div className="min-h-screen bg-slate-100 flex flex-col font-sans">
            <div className="flex-1 flex items-center justify-center p-4">
            <div className="w-full max-w-md bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
              <div className="bg-[#1b365d] text-white px-6 py-4">
                <p className="text-xs uppercase tracking-wider text-amber-300 font-bold">Verifica attestato</p>
                <h1 className="text-lg font-black">Controllo di autenticità</h1>
              </div>
              <div className="p-6 space-y-4">
                <p className="text-xs text-slate-500">Codice verificato: <span className="font-mono font-bold text-slate-800">{code}</span></p>

                {status === 'loading' && (
                  <p className="text-sm text-slate-600">Verifica in corso, attendere...</p>
                )}

                {status === 'invalid' && (
                  <div className="bg-red-50 border border-red-200 rounded-xl p-4">
                    <p className="text-sm font-black text-red-700">❌ Attestato NON valido</p>
                    <p className="text-xs text-red-600 mt-1">Il codice non corrisponde ad alcuna iscrizione registrata nel nostro database.</p>
                  </div>
                )}

                {status === 'error' && (
                  <div className="bg-amber-50 border border-amber-200 rounded-xl p-4">
                    <p className="text-sm font-black text-amber-700">⚠ Verifica non disponibile</p>
                    <p className="text-xs text-amber-700 mt-1">Impossibile contattare il database. Riprova più tardi.</p>
                  </div>
                )}

                {status === 'found' && (
                  <>
                    {authentic ? (
                      <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4">
                        <p className="text-sm font-black text-emerald-700">✅ Attestato AUTENTICO</p>
                        <p className="text-xs text-emerald-700 mt-1">Partecipazione al corso registrata nel database{data.checkin_time ? ` (check-in ore ${data.checkin_time})` : ''}.</p>
                      </div>
                    ) : (
                      <div className="bg-amber-50 border border-amber-200 rounded-xl p-4">
                        <p className="text-sm font-black text-amber-700">⚠ Iscrizione trovata, presenza non registrata</p>
                        <p className="text-xs text-amber-700 mt-1">Il codice esiste ma la partecipazione al corso non risulta confermata dalla segreteria.</p>
                      </div>
                    )}
                    <dl className="text-sm divide-y divide-slate-100 border border-slate-200 rounded-xl">
                      <div className="p-3"><dt className="text-[11px] uppercase text-slate-400 font-bold">Partecipante</dt><dd className="font-bold text-slate-900">{data.full_name}</dd></div>
                      <div className="p-3"><dt className="text-[11px] uppercase text-slate-400 font-bold">Azienda</dt><dd className="text-slate-800">{data.company}</dd></div>
                      <div className="p-3"><dt className="text-[11px] uppercase text-slate-400 font-bold">Corso</dt><dd className="text-slate-800">{data.course_title} {data.brand_name ? `(${data.brand_name})` : ''}</dd></div>
                      <div className="p-3"><dt className="text-[11px] uppercase text-slate-400 font-bold">Data del corso</dt><dd className="text-slate-800">{data.date}</dd></div>
                    </dl>
                  </>
                )}
              </div>
            </div>
            </div>
            <footer className="bg-[#1b365d] text-white border-t border-blue-900/50 py-6 text-center text-xs text-slate-300">
              <p>{footerText || '© 2026 Portale Formazione Installatori Tecnici. Tutti i diritti riservati.'}</p>
            </footer>
          </div>
        );
      }

      // ==========================================
      // ATTESTATO: costanti, generatore PDF e pagina pubblica di download
      // ==========================================
      const DEFAULT_BRANDS = [
        { id: 'tecnoalarm', name: 'TECNOALARM', logoUrl: '', color: '#8b1e1e', posterBgUrl: '', certificateBgUrl: '' },
        { id: 'tecnofire', name: 'TECNOFIRE', logoUrl: '', color: '#b91c1c', posterBgUrl: '', certificateBgUrl: '' },
        { id: 'nice', name: 'NICE', logoUrl: '', color: '#0369a1', posterBgUrl: '', certificateBgUrl: '' },
        { id: 'dahua', name: 'DAHUA', logoUrl: '', color: '#4338ca', posterBgUrl: '', certificateBgUrl: '' }
      ];

      // Template EmailJS dedicato all'invio dell'attestato (da creare nella dashboard EmailJS)
      const EMAILJS_SERVICE_ID = "service_miwig8q";
      const EMAILJS_ATTESTATO_TEMPLATE_ID = "template_attestato";

      function buildAttestatoPdf(reg, { brands, courses, companyName, mode = 'open' }) {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

          const brandObj = brands.find(b => b.name === reg.brandName);
          const brandColorHex = brandObj?.color || '#1b365d';
          const brandCertBg = brandObj?.certificateBgUrl || '';

          const matchedCourse = courses.find(c => c.id === reg.courseId || c.title === reg.courseTitle);
          const courseSpeaker = matchedCourse?.speaker || 'Ermanno Zanardi';
          const courseLevel = matchedCourse?.level || reg.level || 'N/D';

          const hexToRgb = (hex) => {
            let c = hex.replace('#','');
            if(c.length === 3) c = c.split('').map(x => x + x).join('');
            const num = parseInt(c, 16);
            return [num >> 16, (num >> 8) & 255, num & 255];
          };
          const [r, g, b] = hexToRgb(brandColorHex);

          const generateCertPdfContent = (bgImgData, qrImgDataUrl) => {
            if (bgImgData) {
              try {
                doc.addImage(bgImgData, 'JPEG', 0, 0, 297, 210);
              } catch (e) {}
            } else {
              doc.setFillColor(255, 255, 255);
              doc.rect(0, 0, 297, 210, 'F');

              doc.setDrawColor(r, g, b);
              doc.setLineWidth(1.5);
              doc.rect(12, 12, 273, 186);

              doc.setDrawColor(210, 215, 220);
              doc.setLineWidth(0.5);
              doc.rect(15, 15, 267, 180);
            }

            doc.setFont("helvetica", "bold");
            doc.setFontSize(14);
            doc.setTextColor(r, g, b);
            doc.text((companyName || "PORTALE FORMAZIONE").toUpperCase(), 148.5, 28, { align: 'center' });

            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            doc.setTextColor(100, 110, 120);
            doc.text(`Attestato Ufficiale di Partecipazione - Marchio: ${reg.brandName || 'N/D'}`, 148.5, 35, { align: 'center' });

            doc.setFont("helvetica", "bold");
            doc.setFontSize(26);
            doc.setTextColor(30, 41, 59);
            doc.text("ATTESTATO DI PARTECIPAZIONE", 148.5, 62, { align: 'center' });

            doc.setFont("helvetica", "italic");
            doc.setFontSize(12);
            doc.setTextColor(100, 110, 120);
            doc.text("Si certifica con la presente che il professionista / installatore", 148.5, 76, { align: 'center' });

            doc.setFont("helvetica", "bold");
            doc.setFontSize(24);
            doc.setTextColor(r, g, b);
            doc.text(reg.fullName || 'Mario Rossi', 148.5, 93, { align: 'center' });

            doc.setFont("helvetica", "normal");
            doc.setFontSize(12);
            doc.setTextColor(50, 60, 75);
            doc.text(`in rappresentanza dell'azienda ${reg.company || 'Azienda'} (P.IVA: ${reg.vatNumber || 'N/D'}) - Città: ${reg.city || 'N/D'}`, 148.5, 103, { align: 'center' });

            doc.setFont("helvetica", "bold");
            doc.setFontSize(12);
            doc.setTextColor(50, 60, 75);
            doc.text("10/10", 253, 129, { align: 'center' });
            doc.setFont("helvetica", "bold");
            doc.setFontSize(8.5);
            doc.text("Class.", 253, 124, { align: 'center' });

            doc.setFont("helvetica", "bold");
            doc.setTextColor(r, g, b);
            doc.setFontSize(12);
            doc.text(`Livello: ${courseLevel}`, 148.5, 142, { align: 'center' });              

            doc.setFont("helvetica", "normal");
            doc.setFontSize(12);
            doc.setTextColor(100, 110, 120);
            doc.text("ha frequentato con profitto il percorso formativo:", 148.5, 122, { align: 'center' });

            doc.setFont("helvetica", "bold");
            doc.setFontSize(18);
            doc.setTextColor(30, 41, 59);
            const splitCourseTitle = doc.splitTextToSize(reg.courseTitle || 'Corso Tecnico', 240);
            doc.text(splitCourseTitle, 148.5, 135, { align: 'center' });

            doc.setFont("helvetica", "normal");
            doc.setFontSize(11);
            doc.setTextColor(80, 90, 105);
            doc.text(`Data di svolgimento: ${reg.date || 'N/D'}`, 148.5, 155, { align: 'center' });

            if (qrImgDataUrl) {
              try {
                doc.addImage(qrImgDataUrl, 'PNG', 22, 169, 22, 22);
                doc.setFont("helvetica", "bold");
                doc.setFontSize(7.5);
                doc.setTextColor(100, 110, 120);
                doc.text("QR Autenticità", 33, 194, { align: 'center' });
                doc.setFont("helvetica", "normal");
                doc.setFontSize(6.0);
                doc.text(reg.ticketCode || ('REG-' + reg.id), 33, 197, { align: 'center' });
              } catch(err) { console.error('Errore inserimento QR nel PDF:', err); }
            }

            doc.setDrawColor(200, 205, 215);
            doc.setLineWidth(0.5);
            doc.line(60, 180, 115, 180);
            doc.line(182, 180, 237, 180);
            
            doc.setFont("helvetica", "normal");
            doc.setFontSize(8.5);
            doc.setTextColor(80, 90, 105);
            doc.text("Il Relatore", 87.5, 185, { align: 'center' });
            doc.text("Azienda erogatrice del corso:", 209.5, 185, { align: 'center' });

            doc.setFont("helvetica", "bold");
            doc.setFontSize(10);
            doc.setTextColor(r, g, b);
            doc.text(courseSpeaker, 87.5, 190, { align: 'center' });
            doc.text(companyName, 209.5, 190, { align: 'center' });

            if (mode === 'save') {
              const safeName = (reg.fullName || 'partecipante').replace(/[^A-Za-z0-9]+/g, '_');
              doc.save('Attestato_' + safeName + '.pdf');
            } else {
              const pdfOutput = doc.output('bloburl');
              window.open(pdfOutput, '_blank');
            }
          };

          // QR generato localmente (niente rete, niente problemi CORS)
          // Il QR rimanda alla pagina di verifica che controlla l'iscrizione nel database
          const baseUrl = window.location.href.split(/[?#]/)[0];
          const qrText = `${baseUrl}?verifica=${encodeURIComponent(reg.ticketCode || ('REG-' + reg.id))}`;
          let qrDataUrl = null;
          try {
            const qr = qrcode(0, 'M');
            qr.addData(qrText);
            qr.make();
            const count = qr.getModuleCount();
            const cell = 8, margin = 4;
            const size = (count + margin * 2) * cell;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, size, size);
            ctx.fillStyle = '#000000';
            for (let row = 0; row < count; row++) {
              for (let col = 0; col < count; col++) {
                if (qr.isDark(row, col)) ctx.fillRect((col + margin) * cell, (row + margin) * cell, cell, cell);
              }
            }
            qrDataUrl = canvas.toDataURL('image/png');
          } catch (err) {
            console.error('Errore generazione QR attestato:', err);
          }

          if (brandCertBg) {
            const certImg = new Image();
            certImg.crossOrigin = 'Anonymous';
            certImg.src = brandCertBg;
            certImg.onload = () => {
              try {
                const canvasBg = document.createElement('canvas');
                canvasBg.width = certImg.width;
                canvasBg.height = certImg.height;
                canvasBg.getContext('2d').drawImage(certImg, 0, 0);
                generateCertPdfContent(canvasBg.toDataURL('image/jpeg'), qrDataUrl);
              } catch (err) {
                console.error('Errore sfondo attestato:', err);
                generateCertPdfContent(null, qrDataUrl);
              }
            };
            certImg.onerror = () => generateCertPdfContent(null, qrDataUrl);
          } else {
            generateCertPdfContent(null, qrDataUrl);
          }
        }

      // Pagina pubblica aperta dal link ricevuto via email: index.html?attestato=CODICE
      function AttestatoPage({ code }) {
        const [state, setState] = useState({ status: 'loading' });
        const [footerText, setFooterText] = useState('');
        const [downloading, setDownloading] = useState(false);

        useEffect(() => {
          const run = async () => {
            if (!supabaseClient) {
              setState({ status: 'error' });
              return;
            }
            try {
              const cols = 'id, course_id, full_name, company, vat_number, city, course_title, brand_name, date, is_present, ticket_code';
              let query = supabaseClient.from('registrations').select(cols);
              if (/^REG-\d+$/.test(code)) {
                query = query.eq('id', Number(code.replace('REG-', '')));
              } else {
                query = query.eq('ticket_code', code);
              }
              const { data, error } = await query.limit(1);
              if (error) throw error;
              if (!data || data.length === 0) {
                setState({ status: 'invalid' });
                return;
              }
              const r = data[0];
              const reg = {
                id: r.id,
                courseId: r.course_id,
                fullName: r.full_name,
                company: r.company,
                vatNumber: r.vat_number,
                city: r.city,
                courseTitle: r.course_title,
                brandName: r.brand_name,
                date: r.date,
                ticketCode: r.ticket_code || ('REG-' + r.id)
              };

              let companyName = 'Azienda di prova';
              let brands = DEFAULT_BRANDS;
              try {
                const { data: sData } = await supabaseClient.from('settings').select('key, value').in('key', ['company_name', 'brands_list', 'copyright_text']);
                (sData || []).forEach(item => {
                  if (item.key === 'company_name' && item.value) companyName = item.value;
                  if (item.key === 'copyright_text' && item.value) setFooterText(item.value);
                  if (item.key === 'brands_list') {
                    try { brands = JSON.parse(item.value); } catch (e) {}
                  }
                });
              } catch (e) { console.error('Errore impostazioni attestato:', e); }

              let courses = [];
              if (r.course_id) {
                try {
                  const { data: cData } = await supabaseClient.from('courses').select('id, title, speaker, level').eq('id', r.course_id).limit(1);
                  if (cData) courses = cData;
                } catch (e) { console.error('Errore corso attestato:', e); }
              }

              setState({ status: r.is_present ? 'ready' : 'notpresent', reg, companyName, brands, courses });
            } catch (err) {
              console.error('Errore caricamento attestato:', err);
              setState({ status: 'error' });
            }
          };
          run();
        }, [code]);

        const handleDownload = () => {
          setDownloading(true);
          try {
            buildAttestatoPdf(state.reg, { brands: state.brands, courses: state.courses, companyName: state.companyName, mode: 'save' });
          } catch (err) {
            console.error('Errore generazione attestato:', err);
            alert("Errore durante la creazione del PDF. Riprova.");
          }
          setTimeout(() => setDownloading(false), 2500);
        };

        const { status, reg } = state;

        return (
          <div className="min-h-screen bg-slate-100 flex flex-col font-sans">
            <div className="flex-1 flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
                <div className="bg-[#1b365d] text-white px-6 py-4">
                  <p className="text-xs uppercase tracking-wider text-amber-300 font-bold">{state.companyName || 'Portale Formazione'}</p>
                  <h1 className="text-lg font-black">Il tuo attestato di partecipazione</h1>
                </div>
                <div className="p-6 space-y-4">
                  {status === 'loading' && <p className="text-sm text-slate-600">Caricamento in corso, attendere...</p>}

                  {status === 'invalid' && (
                    <div className="bg-red-50 border border-red-200 rounded-xl p-4">
                      <p className="text-sm font-black text-red-700">❌ Link non valido</p>
                      <p className="text-xs text-red-600 mt-1">Il codice non corrisponde ad alcuna iscrizione. Controlla di aver aperto il link completo ricevuto via email.</p>
                    </div>
                  )}

                  {status === 'error' && (
                    <div className="bg-amber-50 border border-amber-200 rounded-xl p-4">
                      <p className="text-sm font-black text-amber-700">⚠ Servizio non disponibile</p>
                      <p className="text-xs text-amber-700 mt-1">Impossibile contattare il database. Riprova più tardi.</p>
                    </div>
                  )}

                  {status === 'notpresent' && (
                    <div className="bg-amber-50 border border-amber-200 rounded-xl p-4">
                      <p className="text-sm font-black text-amber-700">⚠ Attestato non ancora disponibile</p>
                      <p className="text-xs text-amber-700 mt-1">La partecipazione al corso non risulta ancora confermata dalla segreteria. Contatta l'organizzazione.</p>
                    </div>
                  )}

                  {status === 'ready' && (
                    <>
                      <dl className="text-sm divide-y divide-slate-100 border border-slate-200 rounded-xl">

        // Helper per verificare se la data del corso è antecedente a quella odierna
        // Converte il testo della data del corso in un oggetto Date (null se non riconosciuta)
        const parseCourseDate = (dateString) => {
          if (!dateString) return null;
          try {
            const months = {
              gen: 0, gennaio: 0,
              feb: 1, febbraio: 1,
              mar: 2, marzo: 2,
              apr: 3, aprile: 3,
              mag: 4, maggio: 4,
              giu: 5, giugno: 5,
              lug: 6, luglio: 6,
              ago: 7, agosto: 7,
              set: 8, settembre: 8,
              ott: 9, ottobre: 9,
              nov: 10, novembre: 10,
              dic: 11, dicembre: 11
            };

            const cleanStr = dateString.toLowerCase();

            // Formato numerico: 19/11/2026, 19-11-2026, 19.11.2026
            // (con più giorni, es. "19-20/11/2026", vale la prima data completa trovata)
            const numericMatch = cleanStr.match(/(?:^|\D)(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})(?!\d)/);
            if (numericMatch) {
              const nDay = parseInt(numericMatch[1], 10);
              const nMonth = parseInt(numericMatch[2], 10);
              const nYear = parseInt(numericMatch[3], 10);
              if (nMonth >= 1 && nMonth <= 12 && nDay >= 1 && nDay <= 31) {
                return new Date(nYear, nMonth - 1, nDay);
              }
            }

            const words = cleanStr.replace(/[^a-z0-9]/g, ' ').split(/\s+/).filter(Boolean);

            let day = null;
            let month = null;
            let year = 2026;

            for (let i = 0; i < words.length; i++) {
              const w = words[i];
              if (!isNaN(w)) {
                const num = parseInt(w, 10);
                if (num > 31 && num >= 2000) {
                  year = num;
                } else if (num >= 1 && num <= 31 && !day) {
                  day = num;
                }
              } else {
                for (let key in months) {
                  if (w.startsWith(key)) {
                    month = months[key];
                    break;
                  }
                }
              }
            }

            if (day !== null && month !== null) {
              return new Date(year, month, day);
            }
          } catch (e) {
            console.error("Errore parsing data corso:", e);
          }
          return null;
        };

if (window.emailjs) {

        const formatTextCommand = (command, value = null) => {
          if (command === 'insertUnorderedList') {
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            const range = selection.getRangeAt(0);
            
            let parent = range.commonAncestorContainer;
            while (parent && parent !== editorRef.current) {
              if (parent.nodeName === 'UL' || parent.nodeName === 'OL') {
                document.execCommand('insertUnorderedList', false, null);
                if (editorRef.current) {
                  setNewCourseData({ ...newCourseData, description: editorRef.current.innerHTML });
                }
                return;
              }
              parent = parent.parentNode;
            }

            const ul = document.createElement('ul');
            ul.style.listStyleType = 'disc';
            ul.style.paddingLeft = '20px';
            
            if (range.collapsed) {
              const li = document.createElement('li');
              li.innerHTML = '<br>';
              ul.appendChild(li);
              range.insertNode(ul);
              range.setStart(li, 0);
              range.collapse(true);
              selection.removeAllRanges();
              selection.addRange(range);
            } else {
              document.execCommand('insertUnorderedList', false, null);
            }
          } else {
            document.execCommand(command, false, value);
          }

          if (editorRef.current) {
            setNewCourseData({ ...newCourseData, description: editorRef.current.innerHTML });
          }

                  } else if (node.nodeType === Node.ELEMENT_NODE) {

                    } else {
                      for (let child of node.childNodes) {
                        walk(child);
                      }
                    }
                  }
                };
                for (let child of element.childNodes) {

                }
                return lines;

                              </div>
                              <div>
                                <label className="block text-[11px] font-semibold text-slate-600 mb-1">URL Sfondo Locandina (A4 Vert.)</label>
                                <input type="url" defaultValue={b.posterBgUrl || ''} onBlur={(e) => handleBrandUpdate(b.id, 'posterBgUrl', e.target.value)} placeholder="https://.../locandina.jpg" className="text-xs px-3 py-2 border border-slate-300 rounded-xl w-full bg-white font-mono" />
                              </div>
                              <div>
                                <label className="block text-[11px] font-semibold text-slate-600 mb-1">URL Sfondo Attestato (A4 Oriz.)</label>
                                <input type="url" defaultValue={b.certificateBgUrl || ''} onBlur={(e) => handleBrandUpdate(b.id, 'certificateBgUrl', e.target.value)} placeholder="https://.../attestato.jpg" className="text-xs px-3 py-2 border border-slate-300 rounded-xl w-full bg-white font-mono" />
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {adminTab === 'branding' && (
                    <div className="max-w-xl mx-auto bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
                      <h3 className="text-lg font-bold text-slate-900 mb-1">Personalizzazione Azienda e Logo</h3>
                      <p className="text-xs text-slate-500 mb-6">Modifica nome azienda, logo, titolo calendario, copyright e l'email che riceve le notifiche di iscrizione.</p>
                      {settingsSavedMsg && (
                        <div className="mb-4 bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs p-3 rounded-xl font-semibold">✓ Personalizzazioni salvate sul database!</div>
                      )}
                      <form onSubmit={handleSaveSettings} className="space-y-4">
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Nome Azienda Erogatrice *</label>
                          <input type="text" required value={tempCompanyName} onChange={(e) => setTempCompanyName(e.target.value)} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Es. Azienda di prova" />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">URL Logo Aziendale (Header e PDF)</label>
                          <input type="url" value={tempCompanyLogo} onChange={(e) => setTempCompanyLogo(e.target.value)} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="https://..." />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Titolo Principale Calendario (Banner) *</label>
                          <input type="text" required value={tempHeaderTitle} onChange={(e) => setTempHeaderTitle(e.target.value)} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Es. CALENDARIO CORSI 2026" />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Testo Copyright Footer *</label>
                          <input type="text" required value={tempCopyrightText} onChange={(e) => setTempCopyrightText(e.target.value)} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Es. © 2026 Nome Azienda..." />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Email Riferimento Admin (notifiche nuove iscrizioni) *</label>
                          <input type="email" required value={tempAdminEmail} onChange={(e) => setTempAdminEmail(e.target.value)} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="es. ermanno.zanardi69@gmail.com" />
                        </div>
                        <div className="pt-2">
                          <button type="submit" className="w-full bg-[#1b365d] hover:bg-[#162d4f] text-white font-bold py-3 px-4 rounded-xl text-sm transition-colors shadow-md">Salva Personalizzazioni sul Cloud</button>
                        </div>
                      </form>
                    </div>
                  )}

                  {adminTab === 'add-course' && (
                    <div className="max-w-2xl mx-auto bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
                      <div className="flex justify-between items-center mb-2">
                        <h3 className="text-lg font-bold text-slate-900">{editingCourseId ? '✏ Modifica Corso Esistente' : '➕ Crea Nuovo Corso'}</h3>
                        {editingCourseId && (
                          <button onClick={() => { setEditingCourseId(null); setNewCourseData({ brand: brands[0]?.id || 'tecnoalarm', brandName: brands[0]?.name || 'TECNOALARM', title: '', code: '', date: '', time: '09:00 – 13:00', modality: 'In presenza', location: '', maxParticipants: 12, duration: '4 Ore', description: '', level: 'Base', price: 'Gratuito', speaker: 'Ermanno Zanardi', isNew: true, isActive: true }); if(editorRef.current) editorRef.current.innerHTML=''; }} className="text-xs text-blue-600 hover:underline font-semibold">Passa a Nuovo Corso</button>
                        )}
                      </div>
                      <p className="text-xs text-slate-500 mb-6">{companyName} • Gestione catalogo corsi su Supabase.</p>

                      <form onSubmit={handleAddCourseSubmit} className="space-y-4">
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Marchio di Riferimento *</label>
                            <select name="brand" value={newCourseData.brand} onChange={handleNewCourseChange} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d] bg-white">
                              {brands.map(b => (<option key={b.id} value={b.id}>{b.name}</option>))}
                            </select>
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Livello del Corso</label>
                            <select name="level" value={newCourseData.level} onChange={handleNewCourseChange} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d] bg-white">
                              <option value="Base">Base</option>
                              <option value="Intermedio">Intermedio</option>
                              <option value="Avanzato">Avanzato</option>
                              <option value="Professionale">Professionale</option>
                            </select>
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Relatore del Corso *</label>
                            <input type="text" name="speaker" required value={newCourseData.speaker} onChange={handleNewCourseChange} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Es. Ermanno Zanardi" />
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Titolo del Corso *</label>
                          <input type="text" name="title" required value={newCourseData.title} onChange={handleNewCourseChange} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Es. CORSO TECNICO AVANZATO" />
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Modalità *</label>
                            <select name="modality" value={newCourseData.modality} onChange={handleNewCourseChange} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d] bg-white">
                              <option value="In presenza">In presenza</option>
                              <option value="Google Meet">Google Meet</option>
                            </select>
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Max Partecipanti *</label>
                            <input type="number" name="maxParticipants" min="1" max="200" required value={newCourseData.maxParticipants} onChange={handleNewCourseChange} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Costo Corso *</label>
                            <input type="text" name="price" required value={newCourseData.price} onChange={handleNewCourseChange} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Es. Gratuito o € 150 + IVA" />
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Data *</label>
                            <input type="text" name="date" required value={newCourseData.date} onChange={handleNewCourseChange} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Es. giovedì 15 nov 2026" />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Orario *</label>
                            <input type="text" name="time" required value={newCourseData.time} onChange={handleNewCourseChange} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Es. 09:00 – 13:00" />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Durata *</label>
                            <input type="text" name="duration" required value={newCourseData.duration} onChange={handleNewCourseChange} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Es. 4 Ore" />
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Sede o Link Piattaforma *</label>
                            <input type="text" name="location" required value={newCourseData.location} onChange={handleNewCourseChange} className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b365d]" placeholder="Es. Via Bergamo,20 - Mornico al Serio (BG)" />
                          </div>
                          <div className="flex flex-col justify-center pt-2 gap-2">
                            <label className="flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer">
                              <input type="checkbox" name="isNew" checked={newCourseData.isNew} onChange={handleNewCourseChange} className="rounded border-slate-300 h-4 w-4 text-[#1b365d]" /> Etichetta Novità sulla Card
                            </label>
                            <label className="flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer">
                              <input type="checkbox" name="isActive" checked={newCourseData.isActive} onChange={handleNewCourseChange} className="rounded border-slate-300 h-4 w-4 text-emerald-600" /> Corso Attivo e Visibile nel Front-End
                            </label>
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Descrizione Dettagliata (Formattabile) *</label>
                          <div className="border border-slate-300 rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-[#1b365d] bg-white">
                            <div className="bg-slate-100 border-b border-slate-300 px-3 py-2 flex items-center gap-1.5 flex-wrap">
                              <button type="button" onClick={() => formatTextCommand('bold')} className="px-2.5 py-1 bg-white hover:bg-slate-200 border border-slate-300 rounded font-bold text-xs text-slate-700 shadow-2xs" title="Grassetto">B</button>
                              <button type="button" onClick={() => formatTextCommand('italic')} className="px-2.5 py-1 bg-white hover:bg-slate-200 border border-slate-300 rounded italic text-xs text-slate-700 shadow-2xs" title="Corsivo">I</button>
                              <button type="button" onClick={() => formatTextCommand('underline')} className="px-2.5 py-1 bg-white hover:bg-slate-200 border border-slate-300 rounded underline text-xs text-slate-700 shadow-2xs" title="Sottolineato">U</button>
                              <span className="w-px h-4 bg-slate-300 mx-1"></span>
                              <button type="button" onClick={() => formatTextCommand('insertUnorderedList')} className="px-2.5 py-1 bg-white hover:bg-slate-200 border border-slate-300 rounded text-xs text-slate-700 shadow-2xs font-bold" title="Elenco puntato">• Elenco</button>
                              <button type="button" onClick={() => formatTextCommand('removeFormat')} className="px-2.5 py-1 bg-white hover:bg-slate-200 border border-slate-300 rounded text-xs text-slate-500 shadow-2xs" title="Pulisci formattazione">✕ Pulisci</button>
                            </div>
                            <div
                              ref={editorRef}
                              contentEditable={true}
                              onInput={handleEditorInput}
                              className="w-full px-3.5 py-2.5 text-sm min-h-[120px] max-h-[250px] overflow-y-auto focus:outline-none prose max-w-none text-slate-800"
                              placeholder="Inserisci la descrizione del corso..."
                            ></div>
                          </div>
                          <span className="text-[10px] text-slate-400 mt-1 block">Puoi evidenziare il testo in grassetto, corsivo o inserire elenchi puntati come in Word.</span>
                        </div>

                        <div className="pt-2 flex gap-3">
                          <button type="submit" className="flex-1 bg-[#1b365d] hover:bg-[#162d4f] text-white font-bold py-3 px-4 rounded-xl text-sm transition-colors shadow-md">{editingCourseId ? 'Salva Modifiche Corso' : 'Pubblica Corso nel Catalogo'}</button>
                          <button type="button" onClick={() => { setEditingCourseId(null); setAdminTab(isCourseExpired(newCourseData.date) ? 'courses-history' : 'courses-management'); }} className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-4 rounded-xl text-sm transition-colors">Annulla</button>
                        </div>
                      </form>

                      <div className="mt-8 border-t border-slate-200 pt-6">
                        <h4 className="text-sm font-bold text-slate-900 mb-3">Corsi in Catalogo (Attiva / Disattiva Rapida)</h4>
                        <div className="space-y-2 max-h-60 overflow-y-auto">
                          {courses.map(c => {
                            const bObj = brands.find(b => b.id === c.id || b.name === c.brandName);
                            const isActive = c.isActive !== false;
                            return (
                              <div key={c.id} className="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs gap-2">
                                <div className="truncate pr-2">
                                  <span className="font-bold uppercase" style={{color: bObj?.color || '#8b1e1e'}}>{bObj?.name || c.brandName}:</span> <span className="font-semibold text-slate-900">{c.title}</span> <span className="text-slate-500 font-normal">({c.level || 'Base'})</span>
                                </div>
                                <div className="flex items-center gap-2 flex-shrink-0">
                                  <button
                                    onClick={() => handleToggleCourseActive(c)}
                                    className={`px-3 py-1 rounded-lg font-bold text-xs transition-colors shadow-sm ${isActive ? 'bg-emerald-600 text-white hover:bg-emerald-700' : 'bg-slate-300 text-slate-700 hover:bg-slate-400'}`}
                                  >
                                    {isActive ? '✓ Attivo' : '✕ Disattivo'}
                                  </button>
                                  <button onClick={() => handleEditCourseClick(c)} className="text-blue-600 hover:text-blue-800 font-bold px-2.5 py-1 bg-white border border-blue-200 rounded-lg text-xs">Modifica</button>
                                  <button onClick={() => handleDeleteCourse(c.id)} className="text-red-600 hover:text-red-800 font-bold px-2.5 py-1 bg-white border border-red-200 rounded-lg text-xs">Elimina</button>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </main>

            <footer className="bg-[#1b365d] text-white border-t border-blue-900/50 py-6 text-center text-xs text-slate-300 mt-12">
              <p>{copyrightText}</p>
            </footer>
          </div>
        );
      }

      // Se l'indirizzo contiene ?verifica=CODICE mostra solo la pagina di verifica
      // (senza caricare l'elenco completo di corsi e iscritti).
      const urlParams = new URLSearchParams(window.location.search);
      const verifyCodeParam = urlParams.get('verifica');
      const attestatoCodeParam = urlParams.get('attestato');
      ReactDOM.render(
        attestatoCodeParam ? <AttestatoPage code={attestatoCodeParam.trim()} />
          : verifyCodeParam ? <VerifyPage code={verifyCodeParam.trim()} />
          : <App />,
        document.getElementById('root')
      );
    </script>
  </body>
</html>
